<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CHAK338 — Upgrader</title>

<script src="data.js"></script>

<style>
* {
    box-sizing: border-box;
}

:root {
    --bg: #06080c;
    --panel: #0d121a;
    --panel2: #111821;
    --border: rgba(255,255,255,.08);
    --text: #f4f7fb;
    --muted: #7f8b9b;
    --green: #20e58a;
    --green-dark: #0d9f60;
    --red: #ff4058;
    --yellow: #ffc857;
}

html,
body {
    margin: 0;
    min-height: 100%;
}

body {
    min-height: 100vh;
    color: var(--text);
    background:
        radial-gradient(
            circle at 50% -10%,
            rgba(20,120,75,.16),
            transparent 35%
        ),
        linear-gradient(
            180deg,
            #080a0f 0%,
            #05070a 100%
        );
    font-family:
        Inter,
        Arial,
        Helvetica,
        sans-serif;
}

button {
    font-family: inherit;
}

.header {
    height: 70px;
    padding: 0 28px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    position: sticky;
    top: 0;
    z-index: 50;

    background: rgba(6,8,12,.92);
    backdrop-filter: blur(14px);

    border-bottom:
        1px solid var(--border);
}

.logo {
    font-size: 22px;
    font-weight: 950;
    letter-spacing: -1px;
}

.logo span {
    color: var(--green);
}

.nav {
    display: flex;
    gap: 6px;
}

.nav a {
    color: #929dac;
    text-decoration: none;

    padding: 10px 14px;

    border-radius: 9px;

    font-size: 13px;
    font-weight: 800;

    transition: .18s;
}

.nav a:hover,
.nav a.active {
    color: white;
    background: rgba(255,255,255,.06);
}

.xp {
    color: var(--green);

    padding: 9px 14px;

    border-radius: 9px;

    border:
        1px solid rgba(32,229,138,.2);

    background:
        rgba(32,229,138,.06);

    font-size: 13px;
    font-weight: 900;
}

.page {
    max-width: 1500px;
    margin: auto;

    padding:
        30px
        20px
        70px;
}

.heading {
    text-align: center;
    margin-bottom: 25px;
}

.heading h1 {
    margin: 0;

    font-size: 34px;
    font-weight: 950;
    letter-spacing: -1px;
}

.heading p {
    margin:
        7px
        0
        0;

    color: var(--muted);
    font-size: 13px;
}

.layout {
    display: grid;

    grid-template-columns:
        330px
        minmax(430px,1fr)
        330px;

    gap: 18px;

    align-items: start;
}

.panel {
    overflow: hidden;

    background:
        linear-gradient(
            180deg,
            rgba(16,22,32,.97),
            rgba(9,13,19,.97)
        );

    border:
        1px solid var(--border);

    border-radius: 16px;

    box-shadow:
        0 20px 60px rgba(0,0,0,.25);
}

.panel-header {
    min-height: 57px;

    padding:
        0
        17px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    border-bottom:
        1px solid var(--border);
}

.panel-header h2 {
    margin: 0;

    font-size: 14px;
    font-weight: 900;
}

.panel-header span {
    color: var(--muted);

    font-size: 11px;
    font-weight: 700;
}

/* =========================
   INVENTORY
========================= */

.inventory {
    padding: 12px;

    max-height: 700px;

    overflow-y: auto;
}

.item {
    display: flex;
    align-items: center;

    gap: 11px;

    padding: 9px;

    margin-bottom: 8px;

    border-radius: 11px;

    border:
        1px solid rgba(255,255,255,.06);

    background:
        rgba(255,255,255,.025);

    cursor: pointer;

    transition:
        transform .18s,
        border .18s,
        background .18s;
}

.item:hover {
    transform: translateY(-1px);

    border-color:
        rgba(32,229,138,.25);
}

.item.selected {
    border-color:
        rgba(32,229,138,.75);

    background:
        rgba(32,229,138,.08);

    box-shadow:
        0 0 18px rgba(32,229,138,.08);
}

.item-image {
    width: 58px;
    height: 58px;

    flex: 0 0 58px;

    object-fit: contain;

    border-radius: 8px;

    background:
        rgba(0,0,0,.22);
}

.item-info {
    min-width: 0;
    flex: 1;
}

.item-name {
    font-size: 12px;
    font-weight: 900;

    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.item-price {
    margin-top: 5px;

    color: var(--green);

    font-size: 13px;
    font-weight: 950;
}

.check {
    width: 21px;
    height: 21px;

    display: grid;
    place-items: center;

    border-radius: 50%;

    border:
        1px solid #4c5665;

    color: #03130b;

    font-size: 12px;
    font-weight: 950;
}

.item.selected .check {
    background: var(--green);
    border-color: var(--green);
}

/* =========================
   CENTER
========================= */

.center {
    display: flex;
    flex-direction: column;

    gap: 16px;
}

.upgrade-panel {
    padding: 22px;
}

.stake-line {
    display: flex;
    align-items: center;
    justify-content: center;

    gap: 7px;

    color: var(--muted);

    font-size: 13px;
}

.stake-line strong {
    color: white;
    font-size: 17px;
}

/* =========================
   WHEEL
========================= */

.wheel-container {
    width: min(400px,80vw);
    aspect-ratio: 1;

    position: relative;

    margin:
        25px
        auto;
}

.wheel {
    position: absolute;
    inset: 0;

    border-radius: 50%;

    /*
       ЗЕЛЁНАЯ ЗОНА.
       Значение --chance устанавливается JS.

       10% = 36°
       25% = 90°
       50% = 180°
       75% = 270°
    */

    background:
        conic-gradient(
            from -90deg,

            var(--green)
            0deg,

            var(--green)
            calc(var(--chance) * 3.6deg),

            #441722
            calc(var(--chance) * 3.6deg),

            #151a23
            360deg
        );

    box-shadow:
        0 0 0 9px #0a0e14,
        0 0 0 10px rgba(255,255,255,.07),
        0 0 40px rgba(32,229,138,.12);

    transition:
        background .3s ease,
        box-shadow .3s ease;
}

.wheel::before {
    content: "";

    position: absolute;

    inset: 17px;

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            #18202c 0%,
            #0d121a 65%,
            #090c11 100%
        );

    box-shadow:
        inset 0 0 35px rgba(0,0,0,.85);
}

.wheel::after {
    content: "";

    position: absolute;

    inset: 5px;

    border-radius: 50%;

    border:
        1px solid
        rgba(255,255,255,.08);
}

.pointer {
    position: absolute;

    left: 50%;
    top: -14px;

    z-index: 10;

    transform:
        translateX(-50%);

    width: 0;
    height: 0;

    border-left:
        13px solid transparent;

    border-right:
        13px solid transparent;

    border-top:
        28px solid white;

    filter:
        drop-shadow(
            0 0 7px
            rgba(255,255,255,.8)
        );
}

/*
   ВАЖНО:

   Стрелка вращается по кругу.
   Она не зависит от CSS зелёной зоны.

   JS задаёт точно тот же угол,
   который использует RNG.
*/

.needle {
    position: absolute;

    z-index: 5;

    left: 50%;
    top: 50%;

    width: 5px;
    height: 44%;

    transform-origin:
        50% 100%;

    transform:
        translate(-50%,-100%)
        rotate(0deg);

    transition:
        transform
        3.6s
        cubic-bezier(.12,.68,.12,1);
}

.needle-line {
    position: absolute;

    left: 50%;
    top: 0;

    width: 5px;
    height: 100%;

    transform:
        translateX(-50%);

    border-radius: 10px;

    background: white;

    box-shadow:
        0 0 9px
        rgba(255,255,255,.85);
}

.needle-center {
    position: absolute;

    left: 50%;
    bottom: -12px;

    transform:
        translateX(-50%);

    width: 27px;
    height: 27px;

    border-radius: 50%;

    background: #edf2f8;

    border:
        5px solid #0b0f15;

    box-shadow:
        0 0 17px
        rgba(255,255,255,.3);
}

.wheel-center {
    position: absolute;

    z-index: 6;

    left: 50%;
    top: 50%;

    transform:
        translate(-50%,-50%);

    width: 190px;

    text-align: center;
}

.big-chance {
    color: var(--green);

    font-size: 49px;
    line-height: 1;

    font-weight: 950;

    text-shadow:
        0 0 25px
        rgba(32,229,138,.3);
}

.chance-label {
    margin-top: 7px;

    color: #7c8796;

    font-size: 10px;
    font-weight: 900;

    text-transform: uppercase;

    letter-spacing: 1.6px;
}

/* =========================
   CHANCE
========================= */

.chances {
    display: grid;

    grid-template-columns:
        repeat(4,1fr);

    gap: 8px;
}

.chance {
    padding: 11px 5px;

    border-radius: 9px;

    border:
        1px solid rgba(255,255,255,.08);

    background:
        #0b1017;

    color: #9aa5b4;

    cursor: pointer;

    font-size: 13px;
    font-weight: 950;

    transition: .18s;
}

.chance:hover {
    color: white;

    border-color:
        rgba(255,255,255,.2);
}

.chance.active {
    color: var(--green);

    border-color:
        rgba(32,229,138,.6);

    background:
        rgba(32,229,138,.1);

    box-shadow:
        0 0 16px
        rgba(32,229,138,.08);
}

/* =========================
   STATS
========================= */

.stats {
    display: grid;

    grid-template-columns:
        repeat(3,1fr);

    gap: 8px;

    margin-top: 13px;
}

.stat {
    padding: 11px 6px;

    text-align: center;

    border-radius: 9px;

    border:
        1px solid rgba(255,255,255,.05);

    background:
        rgba(255,255,255,.025);
}

.stat span {
    display: block;

    color: var(--muted);

    font-size: 9px;
    font-weight: 800;

    text-transform: uppercase;
}

.stat strong {
    display: block;

    margin-top: 4px;

    color: white;

    font-size: 14px;
    font-weight: 950;
}

/* =========================
   BUTTON
========================= */

.upgrade-button {
    width: 100%;

    margin-top: 14px;

    padding: 16px;

    border: 0;

    border-radius: 11px;

    background:
        linear-gradient(
            135deg,
            #29ed96,
            #0fae69
        );

    color: #03130b;

    font-size: 15px;
    font-weight: 950;

    cursor: pointer;

    box-shadow:
        0 8px 28px
        rgba(32,229,138,.17);

    transition: .18s;
}

.upgrade-button:hover:not(:disabled) {
    transform: translateY(-1px);

    filter: brightness(1.08);
}

.upgrade-button:disabled {
    opacity: .35;

    cursor: not-allowed;

    filter: grayscale(1);
}

/* =========================
   TARGETS
========================= */

.targets {
    padding: 12px;

    max-height: 700px;

    overflow-y: auto;
}

.target {
    display: flex;
    align-items: center;

    gap: 10px;

    padding: 9px;

    margin-bottom: 8px;

    border-radius: 11px;

    border:
        1px solid rgba(255,255,255,.06);

    background:
        rgba(255,255,255,.025);

    cursor: pointer;

    transition: .18s;
}

.target:hover:not(.locked) {
    border-color:
        rgba(32,229,138,.4);
}

.target.active {
    border-color: var(--green);

    background:
        rgba(32,229,138,.09);

    box-shadow:
        0 0 18px
        rgba(32,229,138,.08);
}

.target.locked {
    cursor: not-allowed;
    opacity: .35;
}

.target-image {
    width: 58px;
    height: 58px;

    object-fit: contain;

    border-radius: 8px;

    background:
        rgba(0,0,0,.2);
}

.target-info {
    min-width: 0;
    flex: 1;
}

.target-name {
    font-size: 12px;
    font-weight: 900;

    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.target-price {
    margin-top: 4px;

    color: var(--yellow);

    font-size: 13px;
    font-weight: 950;
}

.target-status {
    margin-top: 3px;

    font-size: 9px;
    font-weight: 900;
}

.available {
    color: var(--green);
}

.unavailable {
    color: var(--red);
}

.target-multiplier {
    margin-top: 3px;

    color: #758092;

    font-size: 10px;
}

/* =========================
   EMPTY
========================= */

.empty {
    padding: 45px 15px;

    text-align: center;

    color: var(--muted);

    font-size: 12px;
}

/* =========================
   RESULT MODAL
========================= */

.overlay {
    position: fixed;

    inset: 0;

    z-index: 200;

    display: none;
    place-items: center;

    background:
        rgba(0,0,0,.78);

    backdrop-filter:
        blur(8px);
}

.overlay.show {
    display: grid;
}

.modal {
    width:
        min(
            470px,
            calc(100vw - 30px)
        );

    padding: 30px;

    text-align: center;

    border-radius: 18px;

    border:
        1px solid
        rgba(255,255,255,.1);

    background:
        linear-gradient(
            180deg,
            #111923,
            #0a0f16
        );

    box-shadow:
        0 30px 100px
        rgba(0,0,0,.7);

    animation:
        modalIn .25s ease;
}

@keyframes modalIn {

    from {
        opacity: 0;
        transform: scale(.9);
    }

    to {
        opacity: 1;
        transform: scale(1);
    }
}

.modal-icon {
    font-size: 45px;
}

.modal h2 {
    margin:
        10px
        0
        5px;

    font-size: 27px;
    font-weight: 950;
}

.modal p {
    margin: 0;

    color: var(--muted);

    font-size: 13px;
}

.modal-image {
    display: block;

    width: 180px;
    height: 180px;

    margin:
        20px
        auto;

    object-fit: contain;
}

.modal-price {
    color: var(--yellow);

    font-size: 22px;
    font-weight: 950;
}

.take-button,
.close-button {
    width: 100%;

    padding: 14px;

    border: 0;

    border-radius: 10px;

    cursor: pointer;

    font-weight: 950;
}

.take-button {
    color: #03130b;

    background:
        linear-gradient(
            135deg,
            #29ed96,
            #0fae69
        );
}

.close-button {
    margin-top: 9px;

    color: white;

    background:
        rgba(255,255,255,.07);

    border:
        1px solid
        rgba(255,255,255,.07);
}

/* =========================
   SPIN
========================= */

.wheel-container.spinning .wheel {
    animation:
        wheelGlow .35s
        infinite alternate;
}

@keyframes wheelGlow {

    from {
        box-shadow:
            0 0 0 9px #0a0e14,
            0 0 0 10px rgba(255,255,255,.07),
            0 0 25px rgba(32,229,138,.12);
    }

    to {
        box-shadow:
            0 0 0 9px #0a0e14,
            0 0 0 10px rgba(255,255,255,.07),
            0 0 65px rgba(32,229,138,.4);
    }
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:1100px) {

    .layout {
        grid-template-columns:
            280px
            minmax(400px,1fr);
    }

    .targets-panel {
        grid-column:
            1 / -1;
    }

    .targets {
        display: grid;

        grid-template-columns:
            repeat(2,1fr);

        gap: 8px;
    }

    .target {
        margin-bottom: 0;
    }
}

@media(max-width:760px) {

    .header {
        padding: 0 12px;
    }

    .nav a {
        display: none;
    }

    .page {
        padding:
            20px
            10px
            50px;
    }

    .layout {
        display: flex;
        flex-direction: column;
    }

    .panel,
    .center {
        width: 100%;
    }

    .targets {
        display: block;
    }

    .wheel-container {
        width: 310px;
    }

    .heading h1 {
        font-size: 28px;
    }
}
</style>
</head>

<body>

<header class="header">

    <div class="logo">
        CHAK338 <span>GAMING</span>
    </div>

    <nav class="nav">
        <a href="index.html">Главная</a>
        <a href="index.html#cases">Кейсы</a>
        <a href="upgrade.html" class="active">Апгрейд</a>
        <a href="inventory.html">Инвентарь</a>
    </nav>

    <div class="xp">
        EXP:
        <span id="xpValue">0</span>
    </div>

</header>


<main class="page">

    <div class="heading">

        <h1>UPGRADER</h1>

        <p>
            Подними свой предмет и попробуй забрать более дорогой
        </p>

    </div>


    <div class="layout">


        <!-- =====================
             INVENTORY
        ====================== -->

        <section class="panel">

            <div class="panel-header">

                <h2>ТВОЙ ИНВЕНТАРЬ</h2>

                <span id="inventoryCount">
                    0 предметов
                </span>

            </div>

            <div
                class="inventory"
                id="inventory"
            ></div>

        </section>


        <!-- =====================
             CENTER
        ====================== -->

        <section class="center">

            <div class="panel upgrade-panel">

                <div class="stake-line">

                    Ставка:

                    <strong id="stakeValue">
                        0
                    </strong>

                </div>


                <!-- WHEEL -->

                <div
                    class="wheel-container"
                    id="wheelContainer"
                >

                    <div class="pointer"></div>

                    <div
                        class="wheel"
                        id="wheel"
                        style="--chance:50"
                    >

                        <div
                            class="needle"
                            id="needle"
                        >

                            <div class="needle-line"></div>

                            <div class="needle-center"></div>

                        </div>


                        <div class="wheel-center">

                            <div
                                class="big-chance"
                                id="bigChance"
                            >
                                50%
                            </div>

                            <div class="chance-label">
                                шанс победы
                            </div>

                        </div>

                    </div>

                </div>


                <!-- CHANCE -->

                <div class="chances">

                    <button
                        class="chance active"
                        data-chance="10"
                    >
                        10%
                    </button>

                    <button
                        class="chance"
                        data-chance="25"
                    >
                        25%
                    </button>

                    <button
                        class="chance"
                        data-chance="50"
                    >
                        50%
                    </button>

                    <button
                        class="chance"
                        data-chance="75"
                    >
                        75%
                    </button>

                </div>


                <!-- STATS -->

                <div class="stats">

                    <div class="stat">

                        <span>
                            Ставка
                        </span>

                        <strong id="stakeStat">
                            0
                        </strong>

                    </div>

                    <div class="stat">

                        <span>
                            Макс. цель
                        </span>

                        <strong id="maxStat">
                            0
                        </strong>

                    </div>

                    <div class="stat">

                        <span>
                            Множитель
                        </span>

                        <strong id="multiplierStat">
                            x0
                        </strong>

                    </div>

                </div>


                <button
                    class="upgrade-button"
                    id="upgradeButton"
                    disabled
                >
                    ВЫБЕРИ ПРЕДМЕТЫ
                </button>

            </div>

        </section>


        <!-- =====================
             TARGETS
        ====================== -->

        <section class="panel targets-panel">

            <div class="panel-header">

                <h2>
                    ВЫБЕРИ ЦЕЛЬ
                </h2>

                <span id="targetInfo">
                    ожидание ставки
                </span>

            </div>

            <div
                class="targets"
                id="targets"
            ></div>

        </section>

    </div>

</main>


<!-- =========================
     RESULT
========================= -->

<div
    class="overlay"
    id="resultOverlay"
>

    <div class="modal">

        <div
            class="modal-icon"
            id="modalIcon"
        >
            🏆
        </div>

        <h2 id="modalTitle">
            АПГРЕЙД УСПЕШЕН!
        </h2>

        <p id="modalText"></p>

        <img
            class="modal-image"
            id="modalImage"
            src=""
            alt=""
        >

        <div
            class="modal-price"
            id="modalPrice"
        ></div>

        <button
            class="take-button"
            id="takeButton"
            onclick="takeWonItem()"
        >
            ЗАБРАТЬ ПРЕДМЕТ
        </button>

        <button
            class="close-button"
            id="closeButton"
            onclick="closeResult()"
            style="display:none"
        >
            ЗАКРЫТЬ
        </button>

    </div>

</div>


<script>

/* =====================================================
   CHAK338 UPGRADER
===================================================== */

let inventory = [];

let selectedIds = new Set();

let target = null;

let chance = 50;

let spinning = false;

let pendingWinItem = null;


/* =====================================================
   BASIC HELPERS
===================================================== */

function getItems() {

    if (
        typeof ITEMS !== "undefined" &&
        Array.isArray(ITEMS)
    ) {
        return ITEMS;
    }

    return [];
}


function itemPrice(item) {

    return Number(
        item?.price || 0
    );
}


function itemName(item) {

    return (
        item?.name ||
        item?.title ||
        "Предмет"
    );
}


function itemImage(item) {

    return item?.image || "";
}


function formatPrice(value) {

    if (
        typeof formatPriceFromData === "function"
    ) {
        return formatPriceFromData(value);
    }

    if (
        typeof window.formatPrice === "function"
    ) {
        try {
            return window.formatPrice(value);
        } catch(e) {}
    }

    return Number(value || 0)
        .toLocaleString("ru-RU");
}


/* =====================================================
   INVENTORY STORAGE
===================================================== */

function loadInventoryStorage() {

    if (
        typeof getInventory === "function"
    ) {

        try {

            const result =
                getInventory();

            if (Array.isArray(result)) {
                return result;
            }

        } catch(e) {}

    }

    try {

        const raw =
            localStorage.getItem(
                "chak338_inventory"
            );

        return JSON.parse(raw || "[]");

    } catch(e) {

        return [];

    }
}


function saveInventoryStorage(list) {

    localStorage.setItem(
        "chak338_inventory",
        JSON.stringify(list)
    );

}


/* =====================================================
   INVENTORY IDS
===================================================== */

function makeId(item,index) {

    if (item?.uid) {
        return String(item.uid);
    }

    if (item?.instanceId) {
        return String(item.instanceId);
    }

    if (item?.inventoryId) {
        return String(item.inventoryId);
    }

    /*
       Для старых предметов без ID.
    */

    return (
        itemName(item)
        + "_"
        + itemPrice(item)
        + "_"
        + index
    );
}


function normalizeInventory() {

    const raw =
        loadInventoryStorage();

    inventory =
        raw.map(
            (item,index) => {

                return {
                    ...item,

                    __uid:
                        makeId(item,index)
                };

            }
        );
}


/* =====================================================
   XP
===================================================== */

function getXP() {

    return Number(
        localStorage.getItem(
            "chak338_xp"
        ) || 0
    );

}


function updateXP() {

    document
        .getElementById("xpValue")
        .textContent =
        getXP().toLocaleString("ru-RU");

}


/* =====================================================
   INVENTORY RENDER
===================================================== */

function renderInventory() {

    const box =
        document.getElementById(
            "inventory"
        );

    document
        .getElementById(
            "inventoryCount"
        )
        .textContent =
        `${inventory.length} предметов`;


    if (!inventory.length) {

        box.innerHTML = `
            <div class="empty">
                Инвентарь пуст.
                <br><br>
                Открой кейс, чтобы получить предмет.
            </div>
        `;

        return;
    }


    box.innerHTML =
        inventory
            .map(
                item => {

                    const selected =
                        selectedIds.has(
                            item.__uid
                        );

                    return `

                        <div
                            class="
                                item
                                ${selected ? "selected" : ""}
                            "
                            onclick="
                                toggleInventoryItem(
                                    '${escapeAttr(item.__uid)}'
                                )
                            "
                        >

                            <img
                                class="item-image"
                                src="${escapeAttr(itemImage(item))}"
                                alt=""
                            >

                            <div class="item-info">

                                <div class="item-name">
                                    ${escapeHtml(
                                        itemName(item)
                                    )}
                                </div>

                                <div class="item-price">
                                    ${formatPrice(
                                        itemPrice(item)
                                    )}
                                </div>

                            </div>

                            <div class="check">
                                ${selected ? "✓" : ""}
                            </div>

                        </div>

                    `;

                }
            )
            .join("");

}


function toggleInventoryItem(id) {

    if (spinning) return;


    if (
        selectedIds.has(id)
    ) {

        selectedIds.delete(id);

    } else {

        selectedIds.add(id);

    }


    /*
       Если ставка изменилась,
       старая цель может стать недоступной.
    */

    const max =
        getMaxTarget();

    if (
        target &&
        itemPrice(target) > max
    ) {

        target = null;

    }


    renderInventory();

    updateAll();

}


/* =====================================================
   STAKE
===================================================== */

function getSelectedItems() {

    return inventory.filter(
        item =>
            selectedIds.has(
                item.__uid
            )
    );

}


function getStake() {

    return getSelectedItems()
        .reduce(
            (sum,item) =>
                sum + itemPrice(item),
            0
        );

}


function getMaxTarget() {

    const stake =
        getStake();

    if (!stake) {
        return 0;
    }

    /*
       Например:

       ставка 100
       шанс 50%

       максимум:
       100 / 0.50 = 200

       25%:
       100 / 0.25 = 400

       10%:
       100 / 0.10 = 1000
    */

    return stake /
        (chance / 100);

}


/* =====================================================
   TARGETS
===================================================== */

function getTargets() {

    const stake =
        getStake();

    return getItems()
        .filter(
            item =>
                itemPrice(item) > stake
        )
        .sort(
            (a,b) =>
                itemPrice(a) -
                itemPrice(b)
        );

}


function renderTargets() {

    const box =
        document.getElementById(
            "targets"
        );

    const stake =
        getStake();


    if (!stake) {

        target = null;

        box.innerHTML = `
            <div class="empty">
                Выбери предметы
                <br>
                из инвентаря слева.
            </div>
        `;

        document
            .getElementById(
                "targetInfo"
            )
            .textContent =
            "ожидание ставки";

        return;

    }


    const max =
        getMaxTarget();

    const targets =
        getTargets();


    if (!targets.length) {

        box.innerHTML = `
            <div class="empty">
                Нет предметов
                дороже ставки.
            </div>
        `;

        return;

    }


    let available = 0;


    box.innerHTML =
        targets
            .map(
                (item,index) => {

                    const price =
                        itemPrice(item);

                    const canUse =
                        price <= max;

                    if (canUse) {
                        available++;
                    }


                    const active =
                        target &&
                        target.__targetKey ===
                        `${itemName(item)}_${price}_${index}`;


                    /*
                       Это минимальный шанс,
                       при котором цель становится
                       доступной.
                    */

                    const requiredChance =
                        Math.min(
                            100,
                            (stake / price) * 100
                        );


                    return `

                        <div
                            class="
                                target
                                ${active ? "active" : ""}
                                ${canUse ? "" : "locked"}
                            "
                            ${
                                canUse
                                ?
                                `onclick="selectTarget(${index})"`
                                :
                                ""
                            }
                        >

                            <img
                                class="target-image"
                                src="${escapeAttr(
                                    itemImage(item)
                                )}"
                                alt=""
                            >

                            <div class="target-info">

                                <div class="target-name">
                                    ${escapeHtml(
                                        itemName(item)
                                    )}
                                </div>

                                <div class="target-price">
                                    ${formatPrice(price)}
                                </div>

                                ${
                                    canUse
                                    ?
                                    `
                                        <div
                                            class="
                                                target-status
                                                available
                                            "
                                        >
                                            ДОСТУПНО
                                            ·
                                            минимум
                                            ${requiredChance.toFixed(1)}%
                                        </div>
                                    `
                                    :
                                    `
                                        <div
                                            class="
                                                target-status
                                                unavailable
                                            "
                                        >
                                            НЕДОСТУПНО
                                            ·
                                            нужно
                                            ${requiredChance.toFixed(1)}%
                                        </div>
                                    `
                                }

                                <div
                                    class="target-multiplier"
                                >
                                    x${(
                                        price / stake
                                    ).toFixed(2)}
                                </div>

                            </div>

                        </div>

                    `;

                }
            )
            .join("");


    document
        .getElementById(
            "targetInfo"
        )
        .textContent =
        `${available} доступно`;

}


function selectTarget(index) {

    if (spinning) return;


    const targets =
        getTargets();

    const selectedTarget =
        targets[index];

    if (!selectedTarget) {
        return;
    }


    const max =
        getMaxTarget();


    if (
        itemPrice(selectedTarget) >
        max
    ) {

        return;

    }


    target = {
        ...selectedTarget,

        __targetKey:
            `${itemName(selectedTarget)}_${itemPrice(selectedTarget)}_${index}`
    };


    renderTargets();

    updateButton();

}


/* =====================================================
   UPDATE UI
===================================================== */

function updateAll() {

    const stake =
        getStake();

    const max =
        getMaxTarget();


    document
        .getElementById(
            "stakeValue"
        )
        .textContent =
        formatPrice(stake);


    document
        .getElementById(
            "stakeStat"
        )
        .textContent =
        formatPrice(stake);


    document
        .getElementById(
            "maxStat"
        )
        .textContent =
        formatPrice(max);


    document
        .getElementById(
            "bigChance"
        )
        .textContent =
        `${chance}%`;


    /*
       КЛЮЧЕВОЙ ФИКС:

       CSS шкала теперь получает
       актуальный процент.

       10 -> 36°
       25 -> 90°
       50 -> 180°
       75 -> 270°
    */

    document
        .getElementById("wheel")
        .style
        .setProperty(
            "--chance",
            chance
        );


    document
        .querySelectorAll(".chance")
        .forEach(
            button => {

                button.classList.toggle(
                    "active",
                    Number(
                        button.dataset.chance
                    ) === chance
                );

            }
        );


    if (
        stake &&
        target
    ) {

        document
            .getElementById(
                "multiplierStat"
            )
            .textContent =
            "x" +
            (
                itemPrice(target) /
                stake
            ).toFixed(2);

    } else {

        document
            .getElementById(
                "multiplierStat"
            )
            .textContent =
            "x0";

    }


    renderTargets();

    updateButton();

}


function updateButton() {

    const button =
        document.getElementById(
            "upgradeButton"
        );


    if (spinning) {

        button.disabled = true;

        button.textContent =
            "КОЛЕСО КРУТИТСЯ...";

        return;

    }


    if (!getStake()) {

        button.disabled = true;

        button.textContent =
            "ВЫБЕРИ ПРЕДМЕТЫ";

        return;

    }


    if (!target) {

        button.disabled = true;

        button.textContent =
            "ВЫБЕРИ ЦЕЛЬ";

        return;

    }


    button.disabled = false;

    button.textContent =
        `АПГРЕЙД → ${itemName(target)}`;

}


/* =====================================================
   CHANCE BUTTONS
===================================================== */

document
    .querySelectorAll(".chance")
    .forEach(
        button => {

            button.addEventListener(
                "click",
                () => {

                    if (spinning) {
                        return;
                    }


                    chance =
                        Number(
                            button.dataset.chance
                        );


                    /*
                       После смены процента
                       пересчитываем максимум.

                       Если цель больше нового
                       максимума — снимаем её.
                    */

                    const max =
                        getMaxTarget();


                    if (
                        target &&
                        itemPrice(target) >
                        max
                    ) {

                        target = null;

                    }


                    updateAll();

                }
            );

        }
    );


/* =====================================================
   START UPGRADE
===================================================== */

document
    .getElementById(
        "upgradeButton"
    )
    .addEventListener(
        "click",
        startUpgrade
    );


function startUpgrade() {

    if (spinning) {
        return;
    }


    const stake =
        getStake();


    if (
        !stake ||
        !target
    ) {

        return;

    }


    const max =
        getMaxTarget();


    if (
        itemPrice(target) >
        max
    ) {

        alert(
            "Цель недоступна при выбранном проценте."
        );

        return;

    }


    spinning = true;

    updateButton();


    /*
       =================================================
       ЕДИНСТВЕННЫЙ RNG
       =================================================

       Именно это число определяет победу.

       0...chance = ЗЕЛЁНАЯ ЗОНА
       chance...100 = КРАСНАЯ ЗОНА

       Потом это же число превращается
       в угол стрелки.

       Поэтому больше не может быть ситуации:

       "стрелка в зелёном,
        а пишет проигрыш".
    */

    const roll =
        Math.random() * 100;


    const won =
        roll < chance;


    /*
       Переводим roll 0..100
       в угол зелёного/красного сектора.

       0% = верх
       100% = полный круг
    */

    const finalAngle =
        roll * 3.6;


    /*
       Несколько полных оборотов
       + реальный угол результата.
    */

    const fullSpins =
        7 * 360;


    const rotation =
        fullSpins +
        finalAngle;


    const needle =
        document.getElementById(
            "needle"
        );


    /*
       Сбрасываем CSS transition,
       чтобы следующий запуск начинался
       с нулевого положения.
    */

    needle.style.transition =
        "none";

    needle.style.transform =
        "translate(-50%,-100%) rotate(0deg)";


    void needle.offsetWidth;


    /*
       Возвращаем анимацию.
    */

    needle.style.transition =
        "transform 3.6s cubic-bezier(.12,.68,.12,1)";


    needle.style.transform =
        `
            translate(-50%,-100%)
            rotate(${rotation}deg)
        `;


    document
        .getElementById(
            "wheelContainer"
        )
        .classList.add(
            "spinning"
        );


    playTickSound();


    /*
       После завершения анимации
       используем ТОТ ЖЕ won,
       который был рассчитан выше.
    */

    setTimeout(
        () => {

            document
                .getElementById(
                    "wheelContainer"
                )
                .classList.remove(
                    "spinning"
                );


            finishUpgrade(
                won,
                target,
                stake
            );

        },
        3750
    );

}


/* =====================================================
   FINISH UPGRADE
===================================================== */

function finishUpgrade(
    won,
    selectedTarget,
    originalStake
) {

    /*
       Сохраняем ID ставки ДО очистки.
    */

    const stakeItems =
        getSelectedItems();


    const stakeIds =
        new Set(
            stakeItems.map(
                item =>
                    item.__uid
            )
        );


    /*
       Удаляем предметы ставки.
    */

    inventory =
        inventory.filter(
            item =>
                !stakeIds.has(
                    item.__uid
                )
        );


    /*
       Сразу сохраняем,
       чтобы ставка не вернулась
       после обновления страницы.
    */

    saveInventoryNow();


    if (won) {

        /*
           =================================================
           WIN
           =================================================

           ВАЖНО:

           Мы НЕ добавляем предмет в inventory
           окончательно прямо сейчас.

           Сначала показываем окно.

           Пользователь нажимает
           "ЗАБРАТЬ ПРЕДМЕТ".

           После этого предмет реально
           записывается в localStorage.
        */

        pendingWinItem = {
            ...selectedTarget,

            uid:
                "upgrade_win_" +
                Date.now() +
                "_" +
                Math.random()
                    .toString(36)
                    .slice(2)
        };


        showWinModal(
            pendingWinItem
        );


        playWinSound();

    } else {

        /*
           LOSS
        */

        pendingWinItem = null;


        showLoseModal(
            selectedTarget,
            originalStake
        );


        playFailSound();

    }


    selectedIds.clear();

    target = null;

    spinning = false;


    normalizeInventory();

    renderInventory();

    updateXP();

    updateAll();

}


/* =====================================================
   SAVE INVENTORY
===================================================== */

function saveInventoryNow() {

    const clean =
        inventory.map(
            item => {

                const copy =
                    {...item};

                delete copy.__uid;

                delete copy.__targetKey;

                return copy;

            }
        );


    saveInventoryStorage(
        clean
    );

}


/* =====================================================
   TAKE WIN ITEM
===================================================== */

function takeWonItem() {

    if (!pendingWinItem) {
        return;
    }


    /*
       Создаём чистый объект.
    */

    const item = {
        ...pendingWinItem
    };


    delete item.__uid;

    delete item.__targetKey;


    /*
       =================================================
       ДОБАВЛЯЕМ В ИНВЕНТАРЬ
       =================================================
    */

    inventory.push(item);


    /*
       Сохраняем.
    */

    saveInventoryNow();


    /*
       Закрываем кнопку "забрать".
    */

    document
        .getElementById(
            "takeButton"
        )
        .style.display =
        "none";


    document
        .getElementById(
            "closeButton"
        )
        .style.display =
        "block";


    document
        .getElementById(
            "modalText"
        )
        .textContent =
        "Предмет добавлен в твой инвентарь!";


    pendingWinItem = null;


    /*
       Обновляем всё.
    */

    normalizeInventory();

    renderInventory();

    updateAll();

}

/* =====================================================
   SOUNDS
===================================================== */

let audioContext = null;


function getAudio() {

    if (!audioContext) {

        audioContext =
            new (
                window.AudioContext ||
                window.webkitAudioContext
            )();

    }

    return audioContext;

}


function beep(
    frequency,
    duration,
    volume
) {

    try {

        const ctx =
            getAudio();


        const oscillator =
            ctx.createOscillator();


        const gain =
            ctx.createGain();


        oscillator.type =
            "sine";

        oscillator.frequency.value =
            frequency;


        gain.gain.value =
            volume;


        oscillator.connect(
            gain
        );

        gain.connect(
            ctx.destination
        );


        oscillator.start();


        gain.gain.exponentialRampToValueAtTime(
            .001,
            ctx.currentTime +
            duration
        );


        oscillator.stop(
            ctx.currentTime +
            duration
        );

    } catch(e) {}

}


function playTickSound() {

    let ticks = 0;


    const interval =
        setInterval(
            () => {

                beep(
                    600 +
                    ticks * 18,

                    .035,

                    .018
                );


                ticks++;


                if (ticks >= 28) {

                    clearInterval(
                        interval
                    );

                }

            },
            125
        );

}


function playWinSound() {

    beep(
        600,
        .12,
        .04
    );


    setTimeout(
        () =>
            beep(
                800,
                .15,
                .045
            ),
        110
    );


    setTimeout(
        () =>
            beep(
                1050,
                .25,
                .05
            ),
        230
    );

}


function playFailSound() {

    beep(
        220,
        .2,
        .04
    );


    setTimeout(
        () =>
            beep(
                150,
                .3,
                .04
            ),
        160
    );

}


/* =====================================================
   SECURITY / HTML ESCAPE
===================================================== */

function escapeHtml(value) {

    return String(
        value ?? ""
    )
        .replaceAll(
            "&",
            "&amp;"
        )
        .replaceAll(
            "<",
            "&lt;"
        )
        .replaceAll(
            ">",
            "&gt;"
        )
        .replaceAll(
            '"',
            "&quot;"
        )
        .replaceAll(
            "'",
            "&#039;"
        );

}


function escapeAttr(value) {

    return escapeHtml(
        value
    );

}


/* =====================================================
   INIT
===================================================== */

normalizeInventory();

renderInventory();

updateXP();

updateAll();
