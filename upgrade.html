<!DOCTYPE html>
<html lang="ru">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CHAK338 — Upgrade</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="data.js"></script>

<style>

* {
    box-sizing: border-box;
}

body {

    margin: 0;

    background:
        radial-gradient(
            circle at 50% 0%,
            rgba(75,70,170,.22),
            transparent 40%
        ),
        #060810;

    color: white;

    font-family:
        Inter,
        Arial,
        sans-serif;
}


.glass {

    background:
        rgba(14,18,31,.86);

    border:
        1px solid rgba(255,255,255,.07);

    backdrop-filter:
        blur(15px);
}


.item {

    position: relative;

    background:
        rgba(255,255,255,.035);

    border:
        1px solid rgba(255,255,255,.06);

    border-radius: 16px;

    padding: 10px;

    cursor: pointer;

    transition: .2s;
}


.item:hover {

    border-color:
        rgba(139,92,246,.55);

    transform:
        translateY(-2px);
}


.item.selected {

    border-color:
        #8b5cf6;

    box-shadow:
        0 0 0 1px #8b5cf6,
        0 0 25px rgba(139,92,246,.2);
}


.item.disabled {

    opacity: .35;

    cursor:
        not-allowed;
}


.item img {

    width: 90px;
    height: 90px;

    object-fit:
        contain;

    display:
        block;

    margin:
        auto;
}


.wheel-wrap {

    position: relative;

    width: 360px;
    height: 360px;

    margin:
        20px auto;
}


.wheel {

    position: absolute;

    inset: 15px;

    border-radius:
        50%;

    background:
        conic-gradient(
            from -90deg,
            #16a34a 0deg,
            #16a34a var(--green-angle),
            #1a2030 var(--green-angle),
            #1a2030 360deg
        );

    box-shadow:

        0 0 0 8px #111625,

        0 0 0 10px
        rgba(255,255,255,.06),

        0 20px 80px
        rgba(0,0,0,.6);

    transform:
        rotate(0deg);

    transition:
        transform 4.8s cubic-bezier(.08,.75,.08,1);

    overflow:
        hidden;
}


.wheel::before {

    content: "";

    position: absolute;

    inset: 22px;

    border-radius:
        50%;

    background:
        radial-gradient(
            circle,
            #111827 0%,
            #0b0f1b 68%,
            #080b13 100%
        );

    border:
        2px solid
        rgba(255,255,255,.06);
}


.wheel-center {

    position: absolute;

    left: 50%;
    top: 50%;

    width: 72px;
    height: 72px;

    transform:
        translate(-50%,-50%);

    border-radius:
        50%;

    background:
        linear-gradient(
            145deg,
            #1f2937,
            #080b12
        );

    border:
        2px solid
        rgba(255,255,255,.1);

    z-index: 20;

    display:
        flex;

    align-items:
        center;

    justify-content:
        center;

    font-size:
        24px;

    box-shadow:
        0 8px 30px
        rgba(0,0,0,.6);
}


/*
    НОВАЯ СТРЕЛКА

    Маленькая.
    Тонкая.
    Зелёная.
    Всегда смотрит на верх колеса.

    Она НЕ вращается.
    Вращается само колесо.

    Благодаря этому визуальное попадание
    и логика результата полностью совпадают.
*/

.pointer {

    position: absolute;

    z-index: 50;

    left: 50%;
    top: -2px;

    transform:
        translateX(-50%);

    width: 0;
    height: 0;

    border-left:
        7px solid transparent;

    border-right:
        7px solid transparent;

    border-top:
        0;

    border-bottom:
        20px solid #4ade80;

    filter:
        drop-shadow(
            0 0 6px
            rgba(74,222,128,.8)
        );
}


.pointer::after {

    content: "";

    position: absolute;

    left: -2px;
    top: 16px;

    width: 4px;
    height: 15px;

    border-radius: 4px;

    background:
        #4ade80;

    box-shadow:
        0 0 8px
        rgba(74,222,128,.8);
}


.chance-buttons {

    display:
        grid;

    grid-template-columns:
        repeat(4,1fr);

    gap:
        8px;
}


.chance-btn {

    padding:
        10px;

    border-radius:
        12px;

    background:
        rgba(255,255,255,.05);

    font-weight:
        800;

    transition:
        .2s;
}


.chance-btn.active {

    background:
        #7c3aed;

    box-shadow:
        0 5px 20px
        rgba(124,58,237,.25);
}


.result-overlay {

    position: fixed;

    inset: 0;

    z-index: 1000;

    display: none;

    align-items: center;

    justify-content: center;

    background:
        rgba(0,0,0,.8);

    backdrop-filter:
        blur(12px);

    padding: 20px;
}


.result-overlay.show {

    display:
        flex;
}


.result-box {

    width:
        min(430px,100%);

    background:
        #0c101c;

    border:
        1px solid
        rgba(255,255,255,.08);

    border-radius:
        28px;

    padding:
        35px;

    text-align:
        center;

    box-shadow:
        0 30px 100px
        rgba(0,0,0,.7);
}


.result-box img {

    width:
        180px;

    height:
        180px;

    object-fit:
        contain;

    margin:
        10px auto 20px;
}


.success {

    color:
        #4ade80;
}


.fail {

    color:
        #f87171;
}


@media(max-width:900px) {

    .wheel-wrap {

        width:
            300px;

        height:
            300px;
    }

}


@media(max-width:600px) {

    .wheel-wrap {

        width:
            260px;

        height:
            260px;
    }

}

</style>

</head>


<body>


<header class="border-b border-white/5 bg-black/30 backdrop-blur-xl sticky top-0 z-50">

    <div class="max-w-7xl mx-auto px-5 py-4 flex justify-between items-center">

        <a
            href="index.html"
            class="font-black text-2xl">

            CHAK338
            <span class="text-violet-400">
                GAMING
            </span>

        </a>


        <nav class="flex gap-2">

            <a
                href="index.html"
                class="px-4 py-2 rounded-xl hover:bg-white/5">

                Главная

            </a>


            <a
                href="inventory.html"
                class="px-4 py-2 rounded-xl hover:bg-white/5">

                Инвентарь

            </a>


            <a
                href="upgrade.html"
                class="px-4 py-2 rounded-xl bg-violet-600">

                Апгрейд

            </a>

        </nav>

    </div>

</header>



<main class="max-w-7xl mx-auto px-5 py-8">


    <div class="mb-8">

        <div class="text-violet-400 text-sm font-bold uppercase tracking-widest">
            UPGRADE
        </div>

        <h1 class="text-4xl font-black mt-1">
            Апгрейдер
        </h1>

        <p class="text-white/45 mt-2">
            Выбери предмет, шанс и цель. Если стрелка остановилась
            в зелёной зоне — апгрейд успешен.
        </p>

    </div>



    <div class="grid lg:grid-cols-[320px_1fr_320px] gap-5">


        <!-- ================================================= -->
        <!-- INVENTORY -->
        <!-- ================================================= -->

        <section class="glass rounded-3xl p-5">

            <div class="flex justify-between items-center mb-5">

                <div>

                    <div class="text-white/40 text-xs uppercase">
                        Инвентарь
                    </div>

                    <div class="text-xl font-black">
                        Выберите предмет
                    </div>

                </div>

                <div
                    id="stakeValue"

                class="grid grid-cols-2 gap-3 max-h-[650px] overflow-y-auto pr-1">

        <!-- ================================================= -->
        <!-- CENTER -->
        <!-- ================================================= -->

        <section class="glass rounded-3xl p-5">


            <div class="text-center">

                <div class="text-white/40 text-xs uppercase tracking-widest">

                </div>


                <div
                    id="chanceText"

                </div>

            </div>


            <div class="wheel-wrap">

                <div
                    id="wheel"

                    style="--green-angle:180deg;">

                </div>


                <div class="pointer"></div>

                </div>

            </div>


            <div class="max-w-sm mx-auto">


                <div class="chance-buttons mb-5">

                    <button
                        class="chance-btn"

                    </button>


                    <button

                        data-chance="25">

                        25%

                    </button>


                    <button

                        data-chance="50">

                        50%

                    </button>


                    <button
                        class="chance-btn"
                        data-chance="75">

                        75%

                    </button>

                </div>


                <div
                    id="upgradeInfo"
                    class="rounded-2xl bg-white/5 p-4 text-center text-white/50 mb-4">

                    Выберите предмет

                </div>


                <button
                    id="upgradeButton"
                    onclick="startUpgrade()"

                    class="w-full py-4 rounded-2xl bg-violet-600 hover:bg-violet-500 font-black text-lg">

                    АПГРЕЙД

                </button>

            </div>

        </section>



        <!-- ================================================= -->
        <!-- TARGETS -->
        <!-- ================================================= -->

        <section class="glass rounded-3xl p-5">

            <div class="mb-5">

                <div class="text-white/40 text-xs uppercase">
                    Цели
                </div>

                <div class="text-xl font-black">
                    Выберите предмет
                </div>

                <div
                    id="maxTargetText"
                    class="text-sm text-white/40 mt-1">

                    Максимум: —

                </div>

            </div>


            <div
                id="targetGrid"
                class="grid grid-cols-2 gap-3 max-h-[650px] overflow-y-auto pr-1">

            </div>

        </section>


    </div>

</main>



<!-- RESULT -->

<div
    id="resultOverlay"
    class="result-overlay">

    <div
        id="resultBox"
        class="result-box">

    </div>

</div>



<script>

// ============================================================
// STATE
// ============================================================

let inventory = [];

let selectedInventoryIds =
    new Set();

let selectedTargetId =
    null;

let chance =
    50;

let rolling =
    false;


// ============================================================
// LOAD INVENTORY
// ============================================================

function loadInventory() {

    inventory =
        getInventory();

    renderInventory();
    renderTargets();
    updateUI();
}


// ============================================================
// ITEM ID
// ============================================================

function itemId(item) {

    return (
        item.inventoryId ||
        item.instanceId ||
        item.uid ||
        item.id
    );
}


// ============================================================
// SELECT INVENTORY
// ============================================================

function toggleInventoryItem(id) {

    if (rolling) return;


    if (
        selectedInventoryIds.has(id)
    ) {

        selectedInventoryIds.delete(id);

    } else {

        selectedInventoryIds.add(id);

    }


    selectedTargetId = null;

    renderInventory();
    renderTargets();
    updateUI();
}


// ============================================================
// STAKE
// ============================================================

function getStake() {

    return inventory
        .filter(item =>
            selectedInventoryIds.has(
                itemId(item)
            )
        )
        .reduce(
            (sum,item) =>
                sum + Number(item.price || 0),
            0
        );
}


// ============================================================
// MAX TARGET
// ============================================================

function getMaxTarget() {

    const stake =
        getStake();

    if (!stake) return 0;

    return Math.floor(
        stake / (chance / 100)
    );
}


// ============================================================
// RENDER INVENTORY
// ============================================================

function renderInventory() {

    const grid =
        document.getElementById(
            "inventoryGrid"
        );


    if (!inventory.length) {

        grid.innerHTML = `

            <div class="col-span-2 text-center py-10 text-white/30">

                Инвентарь пуст.

                <br><br>

                Открой кейс, чтобы получить предмет.

            </div>

        `;

        return;
    }


    grid.innerHTML =
        inventory.map(item => {

            const id =
                itemId(item);

            const selected =
                selectedInventoryIds.has(id);


            return `

                <div
                    class="item ${selected ? "selected" : ""}"
                    onclick="toggleInventoryItem('${escapeAttr(id)}')">

                    <img
                        src="${item.image}"
                        alt="">

                    <div class="text-center">

                        <div class="text-xs font-bold truncate">
                            ${item.name}
                        </div>

                        <div class="text-violet-400 font-black text-sm">
                            ${item.price}
                        </div>

                    </div>

                </div>

            `;

        }).join("");
}


// ============================================================
// ESCAPE
// ============================================================

function escapeAttr(value) {

    return String(value)
        .replaceAll("&","&amp;")
        .replaceAll("'","&#39;")
        .replaceAll('"',"&quot;");
}


// ============================================================
// TARGETS
// ============================================================

function renderTargets() {

    const grid =
        document.getElementById(
            "targetGrid"
        );


    const stake =
        getStake();

    const max =
        getMaxTarget();


    document.getElementById(
        "maxTargetText"
    ).textContent =
        stake
            ? `Максимум: ${max} монет`
            : "Максимум: —";


    const targets =
        ITEMS_FOR_UPGRADE();


    if (!targets.length) {

        grid.innerHTML = `

            <div class="col-span-2 text-center py-10 text-white/30">

                Нет доступных целей

            </div>

        `;

        return;
    }


    grid.innerHTML =
        targets.map(item => {

            const possible =
                stake > 0 &&
                item.price > stake &&
                item.price <= max;


            const selected =
                selectedTargetId ===
                item.id;


            return `

                <div
                    class="item
                        ${selected ? "selected" : ""}
                        ${!possible ? "disabled" : ""}"
                    onclick="${
                        possible
                            ? `selectTarget('${escapeAttr(item.id)}')`
                            : ""
                    }">

                    <img
                        src="${item.image}"
                        alt="">

                    <div class="text-center">

                        <div class="text-xs font-bold truncate">
                            ${item.name}
                        </div>

                        <div class="text-violet-400 font-black text-sm">
                            ${item.price}
                        </div>

                        ${
                            possible
                                ? `
                                <div class="text-green-400 text-[10px] font-bold mt-1">
                                    ДОСТУПНО
                                </div>
                                `
                                : `
                                <div class="text-white/20 text-[10px] font-bold mt-1">
                                    НЕДОСТУПНО
                                </div>
                                `
                        }

                    </div>

                </div>

            `;

        }).join("");
}


// ============================================================
// ITEMS FOR UPGRADE
// ============================================================

function ITEMS_FOR_UPGRADE() {

    const all = [];


    CASES.forEach(c => {

        c.items.forEach(item => {

            all.push(item);

        });

    });


    // удаляем дубликаты по id

    const map =
        new Map();

    all.forEach(item => {

        if (!map.has(item.id)) {
            map.set(item.id,item);
        }

    });


    return [...map.values()]
        .sort(
            (a,b) =>
                a.price - b.price
        );
}


// ============================================================
// SELECT TARGET
// ============================================================

function selectTarget(id) {

    if (rolling) return;

    selectedTargetId = id;

    renderTargets();
    updateUI();
}


// ============================================================
// CHANCE BUTTONS
// ============================================================

document
    .querySelectorAll(".chance-btn")
    .forEach(button => {

        button.addEventListener(
            "click",
            () => {

                if (rolling) return;

                chance =
                    Number(
                        button.dataset.chance
                    );


                document
                    .querySelectorAll(".chance-btn")
                    .forEach(btn =>
                        btn.classList.remove(
                            "active"
                        )
                    );


                button.classList.add(
                    "active"
                );


                selectedTargetId =
                    null;


                document.getElementById(
                    "chanceText"
                ).textContent =
                    `${chance}%`;


                document.getElementById(
                    "wheel"
                ).style
                  .setProperty(
                      "--green-angle",
                      `${chance * 3.6}deg`
                  );


                renderTargets();
                updateUI();

            }
        );

    });


// ============================================================
// UPDATE UI
// ============================================================

function updateUI() {

    const stake =
        getStake();


    document.getElementById(
        "stakeValue"
    ).textContent =
        `${stake} монет`;


    const target =
        ITEMS_FOR_UPGRADE()
            .find(
                item =>
                    item.id ===
                    selectedTargetId
            );


    const info =
        document.getElementById(
            "upgradeInfo"
        );


    if (!stake) {

        info.innerHTML =
            "Выберите предмет из инвентаря";

    } else if (!target) {

        info.innerHTML =
            `Ставка: <b>${stake}</b> монет<br>
             Выберите цель`;

    } else {

        const needed =
            Math.min(
                100,
                stake / target.price * 100
            );


        info.innerHTML = `

            Ставка:
            <b>${stake}</b> монет

            <br>

            Цель:
            <b>${target.price}</b> монет

            <br>

            Шанс:
            <b class="text-violet-400">
                ${chance}%
            </b>

        `;

    }


    const canUpgrade =
        stake > 0 &&
        target &&
        target.price > stake &&
        target.price <= getMaxTarget();


    document.getElementById(
        "upgradeButton"
    ).disabled =
        !canUpgrade || rolling;
}


// ============================================================
// START UPGRADE
// ============================================================

function startUpgrade() {

    if (rolling) return;


    const stake =
        getStake();


    const target =
        ITEMS_FOR_UPGRADE()
            .find(
                item =>
                    item.id ===
                    selectedTargetId
            );


    if (!stake || !target) return;


    const max =
        getMaxTarget();


    if (
        target.price <= stake ||
        target.price > max
    ) {

        return;
    }


    rolling = true;

    updateUI();


    /*
        ======================================================
        САМОЕ ВАЖНОЕ ИСПРАВЛЕНИЕ
        ======================================================

        Сначала определяем WIN.

        Затем выбираем конечный угол.

        WIN:
        угол гарантированно внутри зелёного сектора.

        LOSE:
        угол гарантированно за зелёным сектором.

        Поэтому визуальная стрелка и результат
        больше никогда не расходятся.
    */


    const won =
        Math.random() <
        chance / 100;


    let finalAngle;


    if (won) {

        // случайный угол внутри зелёной зоны
        const inside =
            Math.random() *
            (chance * 3.6);

        finalAngle =
            inside;

    } else {

        // выбираем угол вне зелёной зоны
        const greenAngle =
            chance * 3.6;

        const outside =
            greenAngle +
            Math.random() *
            (360 - greenAngle);


        finalAngle =
            outside;
    }


    /*
        Добавляем несколько полных оборотов.
        Колесо всегда движется вперёд.
    */

    const spins =
        6 * 360;


    const totalRotation =
        spins + finalAngle;


    const wheel =
        document.getElementById(
            "wheel"
        );


    // сбрасываем transition
    wheel.style.transition =
        "none";

    wheel.style.transform =
        "rotate(0deg)";


    // браузеру нужно дать кадр
    requestAnimationFrame(() => {

        requestAnimationFrame(() => {

            wheel.style.transition =
                "transform 4.8s cubic-bezier(.08,.75,.08,1)";

            wheel.style.transform =
                `rotate(${totalRotation}deg)`;

        });

    });


    playUpgradeSound();


    setTimeout(() => {

        finishUpgrade(
            won,
            target,
            stake
        );

    }, 4950);
}


// ============================================================
// FINISH UPGRADE
// ============================================================

function finishUpgrade(
    won,
    target,
    stake
) {

    /*
        ВАЖНО:

        Мы работаем с inventory по inventoryId,
        поэтому предметы не будут случайно удаляться
        из-за одинаковых item.id.
    */


    const selectedIds =
        new Set(
            [...selectedInventoryIds]
        );


    let currentInventory =
        getInventory();


    // удаляем именно выбранные экземпляры
    currentInventory =
        currentInventory.filter(
            item =>
                !selectedIds.has(
                    itemId(item)
                )
        );


    if (won) {

        // победный предмет СРАЗУ добавляется
        // в инвентарь

        currentInventory.push(
            makeInventoryItem(
                target,
                "upgrade"
            )
        );

    }


    saveInventory(
        currentInventory
    );


    inventory =
        currentInventory;


    selectedInventoryIds.clear();

    selectedTargetId =
        null;


    rolling = false;


    showResult(
        won,
        target,
        stake
    );


    renderInventory();
    renderTargets();
    updateUI();
}


// ============================================================
// RESULT
// ============================================================

function showResult(
    won,
    target,
    stake
) {

    const overlay =
        document.getElementById(
            "resultOverlay"
        );


    const box =
        document.getElementById(
            "resultBox"
        );


    if (won) {

        box.innerHTML = `

            <div class="success text-2xl font-black">
                ПОБЕДА!
            </div>

            <div class="text-white/50 mt-2">
                Стрелка попала в зелёную зону
            </div>

            <img
                src="${target.image}"
                alt="">

            <div class="text-2xl font-black">
                ${target.name}
            </div>

            <div class="text-green-400 text-xl font-black mt-2">
                ${target.price} монет
            </div>

            <div class="text-white/40 mt-3">
                Предмет добавлен в инвентарь
            </div>

            <button
                onclick="closeResult()"
                class="mt-6 w-full py-3 rounded-xl bg-violet-600 hover:bg-violet-500 font-bold">

                ЗАБРАТЬ

            </button>

        `;

    } else {

        box.innerHTML = `

            <div class="fail text-2xl font-black">
                ПОРАЖЕНИЕ
            </div>

            <div class="text-white/50 mt-2">
                Стрелка остановилась вне зелёной зоны
            </div>

            <div class="text-6xl mt-8 mb-8">
                ✕
            </div>

            <div class="text-white/40">
                Ставка ${stake} монет сгорела
            </div>

            <button
                onclick="closeResult()"
                class="mt-6 w-full py-3 rounded-xl bg-white/10 hover:bg-white/15 font-bold">

                ЗАКРЫТЬ

            </button>

        `;

    }


    overlay.classList.add(
        "show"
    );
}


// ============================================================
// CLOSE RESULT
// ============================================================

function closeResult() {

    document.getElementById(
        "resultOverlay"
    ).classList.remove(
        "show"
    );
}


// ============================================================
// SOUND
// ============================================================

function playUpgradeSound() {

    try {

        const ctx =
            new (
                window.AudioContext ||
                window.webkitAudioContext
            )();


        const osc =
            ctx.createOscillator();

        const gain =
            ctx.createGain();


        osc.type =
            "sine";

        osc.frequency.setValueAtTime(
            100,
            ctx.currentTime
        );


        osc.frequency.exponentialRampToValueAtTime(
            500,
            ctx.currentTime + 4
        );


        gain.gain.setValueAtTime(
            .001,
            ctx.currentTime
        );


        gain.gain.exponentialRampToValueAtTime(
            .08,
            ctx.currentTime + .2
        );


        gain.gain.exponentialRampToValueAtTime(
            .001,
            ctx.currentTime + 4.5
        );


        osc.connect(gain);
        gain.connect(ctx.destination);


        osc.start();

        osc.stop(
            ctx.currentTime + 4.5
        );

    } catch {}

}

loadInventory();
