<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CHAK338 — Апгрейд</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="data.js"></script>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background:
        radial-gradient(circle at 50% -20%, rgba(124,58,237,.14), transparent 35%),
        #070912;
    color: white;
    font-family: Inter, Arial, sans-serif;
}

.header {
    height: 84px;
    background: rgba(7,9,18,.96);
    border-bottom: 1px solid rgba(255,255,255,.06);
}

.container {
    width: min(1350px, calc(100% - 30px));
    margin: auto;
}

.logo {
    font-size: 25px;
    font-weight: 950;
}

.logo span {
    color: #9d7cff;
}

.nav a {
    color: #ddd;
    text-decoration: none;
    font-weight: 700;
    margin-left: 30px;
}

.nav .active {
    background: #7c3aed;
    padding: 12px 18px;
    border-radius: 13px;
}

.page {
    padding: 28px 0;
}

.layout {
    display: grid;
    grid-template-columns: 320px minmax(450px, 1fr) 320px;
    gap: 20px;
}

.panel {
    background: #0d101d;
    border: 1px solid #24283a;
    border-radius: 23px;
    min-height: 760px;
    overflow: hidden;
}

.panel-header {
    padding: 20px;
}

.small-label {
    color: #707688;
    font-size: 12px;
    text-transform: uppercase;
    font-weight: 800;
}

.panel-title {
    margin-top: 5px;
    font-size: 21px;
    line-height: 1.1;
    font-weight: 950;
}

.coins {
    color: #a783ff;
    font-size: 18px;
    font-weight: 950;
}

.inventory {
    padding: 0 18px 20px;
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;

    max-height: 660px;
    overflow-y: auto;
}

.inv-item {
    background: #151927;
    border: 1px solid #252a3d;
    border-radius: 16px;
    padding: 10px;
    cursor: pointer;
    transition: .2s;
}

.inv-item:hover {
    border-color: #7350e8;
}

.inv-item.selected {
    border: 2px solid #8b5cf6;
    box-shadow: 0 0 20px rgba(124,58,237,.2);
}

.inv-image,
.target-image {
    width: 100%;
    height: 90px;
    object-fit: contain;
    border-radius: 12px;
    background: #0c0f1b;
}

.item-name {
    font-size: 12px;
    font-weight: 850;
    margin-top: 7px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.item-price {
    color: #a783ff;
    font-weight: 950;
    margin-top: 3px;
}

.center {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 35px 20px 30px;
}

.chance-label {
    color: #74798a;
    font-size: 12px;
    font-weight: 800;
    letter-spacing: 1px;
}

.chance {
    font-size: 38px;
    font-weight: 950;
    margin-top: 3px;
}

.wheel-wrap {
    width: 390px;
    height: 390px;
    position: relative;
    margin: 15px auto 25px;

    display: flex;
    align-items: center;
    justify-content: center;
}

.wheel-shadow {
    position: absolute;
    inset: 7px;
    border-radius: 50%;
    background: #151a2a;
    box-shadow:
        0 0 0 2px #22283a,
        0 15px 50px rgba(0,0,0,.45);
}

.wheel {
    position: absolute;
    inset: 18px;

    border-radius: 50%;

    background:
        conic-gradient(
            from -90deg,
            #16b957 0deg,
            #16b957 var(--green-angle),
            #1b2233 var(--green-angle),
            #1b2233 360deg
        );

    transform: rotate(0deg);

    box-shadow:
        inset 0 0 0 8px #131a29,
        0 0 35px rgba(22,185,87,.08);
}

.wheel::after {
    content: "";
    position: absolute;
    inset: 34px;
    border-radius: 50%;

    background:
        radial-gradient(circle at 50% 45%,
            #101522,
            #080b14 75%);

    box-shadow:
        inset 0 0 30px rgba(0,0,0,.5);
}

/* =====================================================
   НОВАЯ СТРЕЛКА
   Она находится ВНУТРИ круга.
   ===================================================== */

.pointer {
    position: absolute;

    top: 28px;
    left: 50%;

    transform: translateX(-50%);

    width: 0;
    height: 0;

    border-left: 9px solid transparent;
    border-right: 9px solid transparent;
    border-top: 16px solid #4ade80;

    z-index: 20;

    filter:
        drop-shadow(0 0 5px rgba(74,222,128,.8));
}

/*
   Маленький наконечник чуть ниже,
   чтобы стрелка визуально смотрела именно на сектор.
*/
.pointer::after {
    content: "";

    position: absolute;

    left: -3px;
    top: -17px;

    width: 6px;
    height: 7px;

    background: #4ade80;
    border-radius: 5px;
}

.center-circle {
    position: absolute;

    width: 70px;
    height: 70px;

    border-radius: 50%;

    background: #101521;
    border: 2px solid #2b3345;

    z-index: 15;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 26px;
    color: white;
}

.chances {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;

    width: min(390px, 100%);
}

.chance-btn {
    border: 0;
    border-radius: 12px;

    padding: 12px 8px;

    background: #171b29;
    color: white;

    font-size: 16px;
    font-weight: 950;

    cursor: pointer;
}

.chance-btn.active {
    background: #7c3aed;
    box-shadow: 0 8px 25px rgba(124,58,237,.3);
}

.summary {
    width: min(390px, 100%);

    margin-top: 20px;

    padding: 18px;

    border-radius: 16px;

    background: #171b29;

    text-align: center;

    color: #8d92a2;
}

.summary strong {
    color: #a783ff;
}

.upgrade-btn {
    width: min(390px, 100%);

    margin-top: 16px;

    border: 0;
    border-radius: 15px;

    padding: 17px;

    background: linear-gradient(90deg,#7c3aed,#9333ea);

    color: white;

    font-size: 18px;
    font-weight: 950;

    cursor: pointer;
}

.upgrade-btn:disabled {
    opacity: .4;
    cursor: not-allowed;
}

.targets {
    padding: 0 18px 20px;

    display: grid;
    grid-template-columns: repeat(2,1fr);
    gap: 12px;

    max-height: 660px;
    overflow-y: auto;
}

.target {
    background: #151927;
    border: 1px solid #252a3d;

    border-radius: 16px;

    padding: 10px;

    opacity: .45;
}

.target.available {
    opacity: 1;
}

.target.selected {
    opacity: 1;
    border: 2px solid #8b5cf6;
}

.target-status {
    color: #36dc78;
    font-size: 10px;
    font-weight: 900;
    margin-top: 4px;
}

.target.unavailable .target-status {
    color: #676c7b;
}

.empty {
    grid-column: 1/-1;
    color: #73788a;
    text-align: center;
    padding: 40px 10px;
}

/* RESULT */

.result-overlay {
    position: fixed;
    inset: 0;

    background: rgba(0,0,0,.72);
    backdrop-filter: blur(10px);

    display: none;

    align-items: center;
    justify-content: center;

    z-index: 1000;

    padding: 20px;
}

.result-overlay.show {
    display: flex;
}

.result-box {
    width: min(440px,100%);

    background: #0e1220;

    border: 1px solid #2d3347;

    border-radius: 25px;

    padding: 30px;

    text-align: center;

    box-shadow: 0 30px 100px rgba(0,0,0,.7);
}

.result-icon {
    font-size: 60px;
}

.result-title {
    font-size: 34px;
    font-weight: 950;
    margin-top: 8px;
}

.result-sub {
    color: #8b91a2;
    margin-top: 8px;
}

.result-item-image {
    width: 180px;
    height: 180px;

    object-fit: contain;

    margin: 15px auto;
}

.result-item-name {
    font-size: 23px;
    font-weight: 950;
}

.result-item-price {
    color: #a783ff;
    font-size: 20px;
    font-weight: 950;
    margin-top: 5px;
}

.result-close {
    width: 100%;
    margin-top: 20px;

    border: 0;
    border-radius: 14px;

    padding: 15px;

    background: #7c3aed;

    color: white;
    font-weight: 950;

    cursor: pointer;
}

@media(max-width:1100px) {
    .layout {
        grid-template-columns: 280px 1fr;
    }

    .targets-panel {
        grid-column: 1/-1;
    }

    .targets {
        grid-template-columns: repeat(4,1fr);
        max-height: 400px;
    }
}

@media(max-width:750px) {
    .layout {
        grid-template-columns: 1fr;
    }

    .panel {
        min-height: auto;
    }

    .wheel-wrap {
        width: 320px;
        height: 320px;
    }

    .targets {
        grid-template-columns: repeat(2,1fr);
    }
}
</style>
</head>

<body>

<header class="header">
    <div class="container flex items-center justify-between h-full">

        <div class="logo">
            CHAK338 <span>GAMING</span>
        </div>

        <nav class="nav">
            <a href="index.html">Главная</a>
            <a href="inventory.html">Инвентарь</a>
            <a href="upgrade.html" class="active">Апгрейд</a>
        </nav>

    </div>
</header>


<main class="page">

<div class="container">

<div class="layout">

<!-- =====================================================
     INVENTORY
     ===================================================== -->

<section class="panel">

    <div class="panel-header">

        <div class="small-label">
            Инвентарь
        </div>

        <div class="flex justify-between items-start">

            <div class="panel-title">
                Выберите<br>
                предмет
            </div>

            <div id="coins" class="coins">
                0<br>монет
            </div>

        </div>

    </div>

    <div id="inventory" class="inventory"></div>

</section>


<!-- =====================================================
     CENTER
     ===================================================== -->

<section class="panel">

<div class="center">

    <div class="chance-label">
        CHANCE
    </div>

    <div id="chanceText" class="chance">
        50%
    </div>


    <div class="wheel-wrap">

        <div class="wheel-shadow"></div>

        <div
            id="wheel"
            class="wheel"
            style="--green-angle:180deg;"
        ></div>

        <!-- СТРЕЛКА ТЕПЕРЬ ВНУТРИ КРУГА -->
        <div class="pointer"></div>

        <div class="center-circle">
            ↑
        </div>

    </div>


    <div class="chances">

        <button
            class="chance-btn"
            data-chance="10"
            onclick="setChance(10)"
        >
            10%
        </button>

        <button
            class="chance-btn"
            data-chance="25"
            onclick="setChance(25)"
        >
            25%
        </button>

        <button
            class="chance-btn active"
            data-chance="50"
            onclick="setChance(50)"
        >
            50%
        </button>

        <button
            class="chance-btn"
            data-chance="75"
            onclick="setChance(75)"
        >
            75%
        </button>

    </div>


    <div id="summary" class="summary">
        Выберите предмет из инвентаря
    </div>


    <button
        id="upgradeButton"
        class="upgrade-btn"
        onclick="startUpgrade()"
        disabled
    >
        АПГРЕЙД
    </button>

</div>

</section>


<!-- =====================================================
     TARGETS
     ===================================================== -->

<section class="panel targets-panel">

    <div class="panel-header">

        <div class="small-label">
            Цели
        </div>

        <div class="panel-title">
            Выберите предмет
        </div>

        <div id="maxText"
             style="color:#777c8d;margin-top:5px;">
            Максимум: —
        </div>

    </div>

    <div id="targets" class="targets"></div>

</section>

</div>

</div>

</main>


<!-- =====================================================
     RESULT
     ===================================================== -->

<div id="resultOverlay" class="result-overlay">

    <div class="result-box">

        <div id="resultIcon" class="result-icon">
            🎉
        </div>

        <div id="resultTitle" class="result-title">
            ПОБЕДА!
        </div>

        <div id="resultSub" class="result-sub">
            Предмет добавлен в инвентарь
        </div>

        <img
            id="resultItemImage"
            class="result-item-image"
            src=""
            alt=""
        >

        <div id="resultItemName"
             class="result-item-name">
        </div>

        <div id="resultItemPrice"
             class="result-item-price">
        </div>

        <button
            class="result-close"
            onclick="closeResult()"
        >
            ЗАБРАТЬ
        </button>

    </div>

</div>


<script>
let inventory = [];
let selectedInventory = new Set();

let chance = 50;
let selectedTarget = null;

let upgrading = false;


/* =====================================================
   INVENTORY
   ===================================================== */

function loadInventory() {

    try {

        inventory = JSON.parse(
            localStorage.getItem(
                'chak338_inventory'
            ) || '[]'
        );

    } catch {

        inventory = [];

    }

    /*
       Старые предметы могли иметь сломанные картинки.
       Восстанавливаем их из data.js по имени.
    */

    inventory = inventory.map(item => {

        const catalogItem =
            ITEMS.find(
                x =>
                    x.name === item.name &&
                    Number(x.price) === Number(item.price)
            );

        if (catalogItem) {

            return {
                ...catalogItem,
                ...item,

                image:
                    catalogItem.image ||
                    item.image
            };

        }

        return item;

    });

    renderInventory();
}


function saveInventory() {

    localStorage.setItem(
        'chak338_inventory',
        JSON.stringify(inventory)
    );

}


function renderInventory() {

    const el =
        document.getElementById('inventory');

    el.innerHTML = '';

    let total = 0;

    selectedInventory.forEach(index => {

        if (inventory[index]) {
            total += Number(
                inventory[index].price || 0
            );
        }

    });

    document.getElementById('coins').innerHTML =
        `${total}<br>монет`;


    if (!inventory.length) {

        el.innerHTML = `
            <div class="empty">
                Инвентарь пуст
            </div>
        `;

        renderTargets();

        updateSummary();

        return;
    }


    inventory.forEach((item,index) => {

        const card =
            document.createElement('div');

        card.className =
            'inv-item' +
            (selectedInventory.has(index)
                ? ' selected'
                : '');

        const image =
            getItemImage(item);

        card.innerHTML = `
            <img
                class="inv-image"
                src="${image}"
                alt=""
                onerror="this.src=svgIcon('🎁')"
            >

            <div class="item-name">
                ${item.name}
            </div>

            <div class="item-price">
                ${item.price}
            </div>
        `;

        card.onclick = () => {

            if (upgrading) return;

            if (selectedInventory.has(index)) {
                selectedInventory.delete(index);
            } else {
                selectedInventory.add(index);
            }

            renderInventory();

            renderTargets();

            updateSummary();

        };

        el.appendChild(card);

    });
}


function getItemImage(item) {

    if (
        item &&
        typeof item.image === 'string' &&
        item.image.length > 10
    ) {
        return item.image;
    }

    const catalog =
        ITEMS.find(
            x =>
                x.name === item?.name &&
                Number(x.price) === Number(item?.price)
        );

    if (catalog?.image) {
        return catalog.image;
    }

    return svgIcon(
        item?.emoji || '🎁'
    );
}


/* =====================================================
   CHANCE
   ===================================================== */

function setChance(value) {

    if (upgrading) return;

    chance = value;

    document.getElementById('chanceText')
        .textContent = `${value}%`;

    document.querySelectorAll('.chance-btn')
        .forEach(btn => {

            btn.classList.toggle(
                'active',
                Number(btn.dataset.chance) === value
            );

        });

    updateWheel();

    renderTargets();

    updateSummary();
}


function updateWheel() {

    document.getElementById('wheel')
        .style.setProperty(
            '--green-angle',
            `${chance * 3.6}deg`
        );
}


/* =====================================================
   STAKE
   ===================================================== */

function getStake() {

    let total = 0;

    selectedInventory.forEach(index => {

        if (inventory[index]) {

            total += Number(
                inventory[index].price || 0
            );

        }

    });

    return total;
}


/* =====================================================
   TARGETS
   ===================================================== */

function renderTargets() {

    const el =
        document.getElementById('targets');

    el.innerHTML = '';

    const stake = getStake();

    if (stake <= 0) {

        document.getElementById('maxText')
            .textContent =
            'Максимум: —';

        el.innerHTML = `
            <div class="empty">
                Сначала выберите предмет
            </div>
        `;

        selectedTarget = null;

        return;
    }


    /*
       Формула:
       максимум = ставка / шанс
    */

    const max =
        Math.floor(
            stake / (chance / 100)
        );

    document.getElementById('maxText')
        .textContent =
        `Максимум: ${max} монет`;


    /*
       Показываем ВСЕ предметы дороже ставки.
    */

    const targets =
        ITEMS
            .filter(
                item =>
                    Number(item.price) > stake
            )
            .sort(
                (a,b) =>
                    Number(a.price) -
                    Number(b.price)
            );


    if (!targets.length) {

        el.innerHTML = `
            <div class="empty">
                Нет доступных целей
            </div>
        `;

        return;
    }


    targets.forEach(item => {

        const possible =
            Number(item.price) <= max;

        const card =
            document.createElement('div');

        card.className =
            'target' +
            (possible ? ' available' : ' unavailable') +
            (selectedTarget === item ? ' selected' : '');

        card.innerHTML = `

            <img
                class="target-image"
                src="${getItemImage(item)}"
                alt=""
                onerror="this.src=svgIcon('🎁')"
            >

            <div class="item-name">
                ${item.name}
            </div>

            <div class="item-price">
                ${item.price}
            </div>

            <div class="target-status">
                ${possible
                    ? 'ДОСТУПНО'
                    : 'НЕДОСТУПНО'}
            </div>
        `;


        if (possible) {

            card.onclick = () => {

                if (upgrading) return;

                selectedTarget = item;

                renderTargets();

                updateSummary();

            };

        }


        el.appendChild(card);

    });

}


/* =====================================================
   SUMMARY
   ===================================================== */

function updateSummary() {

    const stake = getStake();

    const summary =
        document.getElementById('summary');

    const button =
        document.getElementById('upgradeButton');


    if (!stake) {

        summary.textContent =
            'Выберите предмет из инвентаря';

        button.disabled = true;

        return;
    }


    if (!selectedTarget) {

        summary.innerHTML = `
            Ставка: <strong>${stake} монет</strong><br>
            Выберите цель
        `;

        button.disabled = true;

        return;
    }


    const max =
        Math.floor(
            stake / (chance / 100)
        );


    if (selectedTarget.price > max) {

        summary.innerHTML = `
            Цель слишком дорогая
        `;

        button.disabled = true;

        return;
    }


    summary.innerHTML = `
        Ставка: <strong>${stake} монет</strong><br>
        Цель: <strong>${selectedTarget.price} монет</strong><br>
        Шанс: <strong>${chance}%</strong>
    `;

    button.disabled = false;
}


/* =====================================================
   САМОЕ ВАЖНОЕ — АПГРЕЙД
   ===================================================== */

function startUpgrade() {

    if (upgrading) return;

    const stake = getStake();

    if (!stake || !selectedTarget) return;


    const max =
        Math.floor(
            stake / (chance / 100)
        );


    if (selectedTarget.price > max) {

        alert(
            'Этот предмет недоступен при выбранном шансе.'
        );

        return;
    }


    upgrading = true;

    document.getElementById('upgradeButton')
        .disabled = true;


    /*
       ===================================================
       НЕ ДЕЛАЕМ ВТОРОЙ RANDOM ПОСЛЕ ВРАЩЕНИЯ.
       ===================================================

       Сначала определяем результат.
    */

    const won =
        Math.random() < chance / 100;


    /*
       Выбираем конкретную точку на круге.

       0 градусов = стрелка сверху.

       Зелёная зона:
       0 ... chance*3.6
    */

    let resultAngle;


    if (won) {

        /*
           Точно внутри зелёной зоны.
           Оставляем небольшой запас от границ.
        */

        const greenEnd =
            chance * 3.6;

        resultAngle =
            8 +
            Math.random() *
            Math.max(
                5,
                greenEnd - 16
            );

    } else {

        /*
           Точно вне зелёной зоны.
        */

        const greenEnd =
            chance * 3.6;

        const outside =
            360 - greenEnd;

        resultAngle =
            greenEnd +
            8 +
            Math.random() *
            Math.max(
                5,
                outside - 16
            );

    }


    /*
       ---------------------------------------------------
       КРИТИЧЕСКОЕ ИСПРАВЛЕНИЕ:
       колесо должно приехать именно этим сектором
       под неподвижную стрелку сверху.
       ---------------------------------------------------
    */

    const fullSpins =
        360 * 5;

    const finalRotation =
        fullSpins - resultAngle;


    const wheel =
        document.getElementById('wheel');


    /*
       Отключаем старую анимацию.
    */

    wheel.style.transition = 'none';

    wheel.style.transform =
        'rotate(0deg)';

    /*
       Маленькая пауза перед стартом,
       чтобы браузер гарантированно применил 0°.
    */

    requestAnimationFrame(() => {

        requestAnimationFrame(() => {

            wheel.style.transition =
                'transform 4.2s cubic-bezier(.08,.72,.12,1)';

            wheel.style.transform =
                `rotate(${finalRotation}deg)`;

        });

    });


    /*
       После завершения НЕ вычисляем новый random.

       Используем тот же resultAngle,
       который был заложен в колесо.
    */

    setTimeout(() => {

        finishUpgrade(
            won,
            resultAngle
        );

    }, 4450);
}


/* =====================================================
   ФИНИШ
   ===================================================== */

function finishUpgrade(won, resultAngle) {

    /*
       Дополнительная проверка:
       действительно ли угол находится
       внутри зелёного сектора.
    */

    const greenEnd =
        chance * 3.6;

    const actuallyGreen =
        resultAngle >= 0 &&
        resultAngle <= greenEnd;


    /*
       Если по визуальной позиции зелёное,
       результат обязан быть WIN.
    */

    const finalWin =
        actuallyGreen;


    const selectedIndices =
        Array.from(selectedInventory)
            .sort((a,b) => b - a);


    /*
       Ставка удаляется всегда:
       и при победе, и при проигрыше.
    */

    selectedIndices.forEach(index => {

        if (index >= 0 && index < inventory.length) {
            inventory.splice(index,1);
        }

    });


    selectedInventory.clear();


    /*
       При победе целевой предмет
       сразу добавляется в инвентарь.
    */

    if (finalWin && selectedTarget) {

        const wonItem = {
            ...selectedTarget,

            id:
                'upgrade_' +
                Date.now() +
                '_' +
                Math.random()
                    .toString(36)
                    .slice(2),

            obtainedAt: Date.now(),
            source: 'upgrade'
        };

        inventory.push(wonItem);

        showResult(true, wonItem);

    } else {

        showResult(false, null);

    }


    saveInventory();

    selectedTarget = null;

    renderInventory();

    renderTargets();

    updateSummary();

    upgrading = false;
}


/* =====================================================
   RESULT
   ===================================================== */

function showResult(won, item) {

    const overlay =
        document.getElementById('resultOverlay');

    const icon =
        document.getElementById('resultIcon');

    const title =
        document.getElementById('resultTitle');

    const sub =
        document.getElementById('resultSub');

    const image =
        document.getElementById('resultItemImage');

    const name =
        document.getElementById('resultItemName');

    const price =
        document.getElementById('resultItemPrice');


    overlay.classList.add('show');


    if (won) {

        icon.textContent = '🎉';

        title.textContent =
            'ПОБЕДА!';

        title.style.color =
            '#4ade80';

        sub.textContent =
            'Предмет добавлен в инвентарь';

        image.src =
            getItemImage(item);

        name.textContent =
            item.name;

        price.textContent =
            `${item.price} монет`;

    } else {

        icon.textContent = '💥';

        title.textContent =
            'ПОРАЖЕНИЕ';

        title.style.color =
            '#f87171';

        sub.textContent =
            'Ставка потеряна';

        image.src =
            '';

        name.textContent =
            '';

        price.textContent =
            '';

    }
}


function closeResult() {

    document
        .getElementById('resultOverlay')
        .classList.remove('show');

}


/* =====================================================
   START
   ===================================================== */

setChance(50);

loadInventory();

</script>
