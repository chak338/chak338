<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CHAK338 — Upgrader</title>

<script src="https://cdn.tailwindcss.com"></script>

<style>
    * {
        box-sizing: border-box;
    }

    html, body {
        margin: 0;
        padding: 0;
        min-height: 100%;
        background:
            radial-gradient(circle at 50% 20%, rgba(74, 222, 128, .08), transparent 30%),
            radial-gradient(circle at 10% 80%, rgba(59, 130, 246, .08), transparent 30%),
            #07090d;
        color: #fff;
        font-family: Arial, Helvetica, sans-serif;
    }

    body {
        overflow-x: hidden;
    }

    button {
        font-family: inherit;
    }

    .page {
        min-height: 100vh;
    }

    /* =========================
       HEADER
    ========================= */

    .header {
        height: 72px;
        border-bottom: 1px solid rgba(255,255,255,.07);
        background: rgba(7,9,13,.92);
        backdrop-filter: blur(18px);
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 30px;
        position: sticky;
        top: 0;
        z-index: 100;
    }

    .logo {
        display: flex;
        align-items: center;
        gap: 12px;
        font-weight: 900;
        font-size: 22px;
        letter-spacing: 1px;
    }

    .logo-icon {
        width: 38px;
        height: 38px;
        border-radius: 12px;
        background: linear-gradient(135deg, #22c55e, #16a34a);
        display: grid;
        place-items: center;
        box-shadow: 0 0 25px rgba(34,197,94,.25);
    }

    .nav {
        display: flex;
        gap: 8px;
    }

    .nav a {
        color: #9ca3af;
        text-decoration: none;
        padding: 10px 15px;
        border-radius: 10px;
        transition: .2s;
        font-weight: 700;
        font-size: 14px;
    }

    .nav a:hover,
    .nav a.active {
        color: #fff;
        background: rgba(255,255,255,.07);
    }

    /* =========================
       MAIN
    ========================= */

    .main {
        max-width: 1500px;
        margin: 0 auto;
        padding: 35px 25px 70px;
    }

    .title {
        text-align: center;
        margin-bottom: 30px;
    }

    .title h1 {
        margin: 0;
        font-size: clamp(32px, 5vw, 54px);
        font-weight: 1000;
        letter-spacing: -2px;
    }

    .title h1 span {
        color: #22c55e;
        text-shadow: 0 0 30px rgba(34,197,94,.35);
    }

    .title p {
        color: #6b7280;
        margin: 10px 0 0;
    }

    /* =========================
       LAYOUT
    ========================= */

    .upgrade-layout {
        display: grid;
        grid-template-columns: 1fr 540px 1fr;
        gap: 24px;
        align-items: start;
    }

    .panel {
        background:
            linear-gradient(180deg, rgba(255,255,255,.045), rgba(255,255,255,.018));
        border: 1px solid rgba(255,255,255,.08);
        border-radius: 20px;
        box-shadow:
            0 25px 80px rgba(0,0,0,.35),
            inset 0 1px 0 rgba(255,255,255,.03);
        overflow: hidden;
    }

    .panel-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 18px 20px;
        border-bottom: 1px solid rgba(255,255,255,.06);
    }

    .panel-head h2 {
        margin: 0;
        font-size: 17px;
        font-weight: 900;
    }

    .counter {
        color: #6b7280;
        font-size: 12px;
    }

    /* =========================
       INVENTORY
    ========================= */

    .inventory {
        min-height: 580px;
    }

    .inventory-grid {
        padding: 15px;
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
        max-height: 580px;
        overflow-y: auto;
    }

    .inventory-grid::-webkit-scrollbar,
    .targets-grid::-webkit-scrollbar {
        width: 5px;
    }

    .inventory-grid::-webkit-scrollbar-thumb,
    .targets-grid::-webkit-scrollbar-thumb {
        background: #272d36;
        border-radius: 99px;
    }

    .item {
        position: relative;
        border-radius: 14px;
        border: 1px solid rgba(255,255,255,.07);
        background:
            linear-gradient(180deg, rgba(255,255,255,.045), rgba(0,0,0,.18));
        padding: 8px;
        cursor: pointer;
        transition:
            transform .18s,
            border-color .18s,
            box-shadow .18s,
            background .18s;
        min-width: 0;
    }

    .item:hover {
        transform: translateY(-2px);
        border-color: rgba(255,255,255,.2);
    }

    .item.selected {
        border-color: #22c55e;
        background:
            linear-gradient(180deg, rgba(34,197,94,.15), rgba(34,197,94,.035));
        box-shadow:
            0 0 0 1px rgba(34,197,94,.2),
            0 0 25px rgba(34,197,94,.12);
    }

    .item-image {
        height: 105px;
        border-radius: 10px;
        background:
            radial-gradient(circle, rgba(255,255,255,.07), transparent 65%),
            #0b0e13;
        display: grid;
        place-items: center;
        overflow: hidden;
    }

    .item-image img,
    .item-image svg {
        width: 85%;
        height: 85%;
        object-fit: contain;
    }

    .item-name {
        margin-top: 8px;
        font-size: 11px;
        font-weight: 800;
        color: #d1d5db;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    .item-price {
        margin-top: 3px;
        color: #22c55e;
        font-weight: 900;
        font-size: 13px;
    }

    .check {
        position: absolute;
        top: 7px;
        right: 7px;
        width: 21px;
        height: 21px;
        border-radius: 50%;
        background: #22c55e;
        display: none;
        place-items: center;
        font-size: 12px;
        font-weight: 900;
        box-shadow: 0 0 15px rgba(34,197,94,.5);
    }

    .item.selected .check {
        display: grid;
    }

    .empty {
        padding: 60px 20px;
        text-align: center;
        color: #6b7280;
        grid-column: 1/-1;
    }

    /* =========================
       CENTER
    ========================= */

    .center {
        display: flex;
        flex-direction: column;
        gap: 18px;
    }

    .upgrade-card {
        background:
            radial-gradient(circle at 50% 45%, rgba(34,197,94,.055), transparent 45%),
            linear-gradient(180deg, rgba(255,255,255,.045), rgba(255,255,255,.015));
        border: 1px solid rgba(255,255,255,.08);
        border-radius: 24px;
        padding: 25px;
        box-shadow: 0 30px 90px rgba(0,0,0,.4);
    }

    .values {
        display: grid;
        grid-template-columns: 1fr 70px 1fr;
        align-items: center;
        gap: 10px;
        margin-bottom: 24px;
    }

    .value-box {
        text-align: center;
        padding: 13px;
        background: rgba(0,0,0,.22);
        border: 1px solid rgba(255,255,255,.06);
        border-radius: 14px;
    }

    .value-label {
        color: #6b7280;
        font-size: 10px;
        text-transform: uppercase;
        font-weight: 800;
        letter-spacing: .8px;
    }

    .value {
        margin-top: 4px;
        font-size: 23px;
        font-weight: 1000;
    }

    .value.green {
        color: #22c55e;
    }

    .arrow-between {
        text-align: center;
        color: #4b5563;
        font-size: 25px;
    }

    /* =========================
       CHANCE
    ========================= */

    .chance-title {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 10px;
    }

    .chance-title span:first-child {
        font-size: 13px;
        color: #9ca3af;
        font-weight: 800;
    }

    .chance-value {
        color: #22c55e;
        font-size: 20px;
        font-weight: 1000;
    }

    .chance-buttons {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 8px;
        margin-bottom: 22px;
    }

    .chance-btn {
        height: 42px;
        border-radius: 11px;
        border: 1px solid rgba(255,255,255,.08);
        background: rgba(255,255,255,.035);
        color: #9ca3af;
        cursor: pointer;
        font-weight: 900;
        transition: .2s;
    }

    .chance-btn:hover {
        color: #fff;
        background: rgba(255,255,255,.07);
    }

    .chance-btn.active {
        color: #07100a;
        background: #22c55e;
        border-color: #22c55e;
        box-shadow: 0 0 25px rgba(34,197,94,.2);
    }

    /* =========================
       WHEEL
    ========================= */

    .wheel-zone {
        position: relative;
        width: 400px;
        height: 400px;
        margin: 0 auto 24px;
        display: grid;
        place-items: center;
    }

    .wheel-glow {
        position: absolute;
        inset: 12px;
        border-radius: 50%;
        background: rgba(34,197,94,.08);
        filter: blur(35px);
        opacity: .7;
        pointer-events: none;
    }

    .wheel {
        width: 340px;
        height: 340px;
        border-radius: 50%;
        position: relative;
        background:
            conic-gradient(
                from -90deg,
                #22c55e 0deg,
                #22c55e calc(var(--chance) * 3.6deg),
                #171b22 calc(var(--chance) * 3.6deg),
                #101319 360deg
            );
        box-shadow:
            0 0 0 10px #0c1015,
            0 0 0 12px rgba(255,255,255,.06),
            0 0 60px rgba(0,0,0,.8),
            0 0 90px rgba(34,197,94,.09);
        transform: rotate(0deg);
    }

    .wheel::before {
        content: "";
        position: absolute;
        inset: 18px;
        border-radius: 50%;
        border: 1px solid rgba(255,255,255,.12);
        box-shadow: inset 0 0 50px rgba(0,0,0,.6);
    }

    .wheel::after {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: 50%;
        background:
            repeating-conic-gradient(
                from -90deg,
                rgba(255,255,255,.12) 0deg,
                rgba(255,255,255,.12) .7deg,
                transparent .7deg,
                transparent 30deg
            );
        opacity: .12;
        pointer-events: none;
    }

    .wheel-center {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 125px;
        height: 125px;
        transform: translate(-50%, -50%);
        border-radius: 50%;
        background:
            radial-gradient(circle at 35% 25%, #303741, #101419 65%);
        border: 5px solid #0a0d11;
        box-shadow:
            0 0 0 2px rgba(255,255,255,.08),
            0 12px 35px rgba(0,0,0,.7);
        display: grid;
        place-items: center;
        z-index: 5;
    }

    .center-percent {
        font-size: 29px;
        font-weight: 1000;
    }

    .center-small {
        font-size: 9px;
        color: #6b7280;
        text-transform: uppercase;
        font-weight: 900;
        letter-spacing: 1px;
        margin-top: -30px;
    }

    /*
       НОВАЯ СТРЕЛКА

       Вращается именно сама стрелка.
       Она всегда начинается сверху.
       Кончик смотрит в сторону сектора.
    */

    .needle-wrapper {
        position: absolute;
        inset: 0;
        z-index: 20;
        pointer-events: none;
        transform: rotate(0deg);
        transform-origin: 50% 50%;
    }

    .needle {
        position: absolute;
        left: 50%;
        top: 25px;
        width: 0;
        height: 145px;
        transform: translateX(-50%);
    }

    .needle-line {
        position: absolute;
        left: -3px;
        top: 0;
        width: 6px;
        height: 130px;
        border-radius: 99px;
        background:
            linear-gradient(to bottom, #ffffff, #d1d5db 60%, #9ca3af);
        box-shadow:
            0 0 7px rgba(255,255,255,.9),
            0 0 20px rgba(255,255,255,.35);
    }

    .needle-tip {
        position: absolute;
        top: -8px;
        left: -12px;
        width: 0;
        height: 0;
        border-left: 12px solid transparent;
        border-right: 12px solid transparent;
        border-bottom: 23px solid #ffffff;
        filter:
            drop-shadow(0 0 5px rgba(255,255,255,.9))
            drop-shadow(0 0 12px rgba(255,255,255,.45));
    }

    .needle-hub {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 46px;
        height: 46px;
        transform: translate(-50%, -50%);
        border-radius: 50%;
        z-index: 30;
        background:
            radial-gradient(circle at 35% 30%, #ffffff, #bfc5cc 30%, #424a54 65%, #151a20);
        border: 4px solid #090c10;
        box-shadow:
            0 0 0 2px rgba(255,255,255,.15),
            0 0 25px rgba(255,255,255,.15);
    }

    .pointer-top {
        position: absolute;
        top: -8px;
        left: 50%;
        transform: translateX(-50%);
        width: 0;
        height: 0;
        border-left: 11px solid transparent;
        border-right: 11px solid transparent;
        border-top: 18px solid #fff;
        z-index: 50;
        filter:
            drop-shadow(0 0 5px #fff)
            drop-shadow(0 0 15px rgba(255,255,255,.45));
        display: none;
    }

    /* состояние вращения */

    .needle-wrapper.spinning {
        animation: needleSpin 4.5s cubic-bezier(.12,.76,.15,1) forwards;
    }

    @keyframes needleSpin {
        0% {
            transform: rotate(0deg);
        }

        100% {
            transform: rotate(var(--final-angle));
        }
    }

    .wheel.spinning {
        box-shadow:
            0 0 0 10px #0c1015,
            0 0 0 12px rgba(255,255,255,.08),
            0 0 80px rgba(34,197,94,.18);
    }

    .wheel-result-win {
        animation: winPulse .8s ease-in-out 2;
    }

    @keyframes winPulse {
        0%,100% {
            filter: brightness(1);
        }
        50% {
            filter: brightness(1.35);
        }
    }

    .wheel-result-loss {
        animation: lossPulse .5s ease-in-out 2;
    }

    @keyframes lossPulse {
        0%,100% {
            filter: brightness(1);
        }
        50% {
            filter: brightness(.7);
        }
    }

    /* =========================
       BUTTON
    ========================= */

    .upgrade-btn {
        width: 100%;
        height: 62px;
        border: 0;
        border-radius: 15px;
        background:
            linear-gradient(135deg, #22c55e, #16a34a);
        color: #031007;
        font-size: 17px;
        font-weight: 1000;
        cursor: pointer;
        box-shadow:
            0 10px 35px rgba(34,197,94,.18),
            inset 0 1px 0 rgba(255,255,255,.3);
        transition: .2s;
    }

    .upgrade-btn:hover:not(:disabled) {
        transform: translateY(-2px);
        box-shadow:
            0 15px 45px rgba(34,197,94,.28),
            inset 0 1px 0 rgba(255,255,255,.3);
    }

    .upgrade-btn:active:not(:disabled) {
        transform: translateY(0);
    }

    .upgrade-btn:disabled {
        cursor: not-allowed;
        opacity: .35;
        box-shadow: none;
    }

    .hint {
        text-align: center;
        margin-top: 11px;
        color: #4b5563;
        font-size: 11px;
    }

    /* =========================
       TARGETS
    ========================= */

    .targets {
        min-height: 580px;
    }

    .target-info {
        padding: 14px 20px;
        background: rgba(34,197,94,.045);
        border-bottom: 1px solid rgba(255,255,255,.06);
    }

    .target-info-row {
        display: flex;
        justify-content: space-between;
        font-size: 12px;
        margin-bottom: 6px;
    }

    .target-info-row:last-child {
        margin-bottom: 0;
    }

    .muted {
        color: #6b7280;
    }

    .target-max {
        color: #22c55e;
        font-weight: 900;
    }

    .targets-grid {
        padding: 15px;
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
        max-height: 530px;
        overflow-y: auto;
    }

    .target {
        position: relative;
        border-radius: 14px;
        border: 1px solid rgba(255,255,255,.07);
        background:
            linear-gradient(180deg, rgba(255,255,255,.045), rgba(0,0,0,.18));
        padding: 8px;
        cursor: pointer;
        transition: .2s;
        opacity: .55;
    }

    .target.reachable {
        opacity: 1;
    }

    .target.reachable:hover {
        transform: translateY(-2px);
        border-color: rgba(255,255,255,.2);
    }

    .target.selected {
        border-color: #22c55e;
        box-shadow:
            0 0 0 1px rgba(34,197,94,.2),
            0 0 25px rgba(34,197,94,.12);
        background: rgba(34,197,94,.1);
    }

    .target.locked {
        cursor: not-allowed;
        filter: grayscale(.3);
    }

    .target-image {
        height: 105px;
        border-radius: 10px;
        display: grid;
        place-items: center;
        background:
            radial-gradient(circle, rgba(255,255,255,.07), transparent 65%),
            #0b0e13;
        overflow: hidden;
    }

    .target-image img,
    .target-image svg {
        width: 85%;
        height: 85%;
        object-fit: contain;
    }

    .target-name {
        margin-top: 8px;
        font-size: 11px;
        font-weight: 800;
        color: #d1d5db;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    .target-price {
        color: #22c55e;
        font-size: 13px;
        font-weight: 900;
        margin-top: 3px;
    }

    .target-chance {
        position: absolute;
        top: 7px;
        left: 7px;
        background: rgba(0,0,0,.75);
        border-radius: 7px;
        padding: 4px 6px;
        font-size: 9px;
        font-weight: 900;
        color: #9ca3af;
    }

    .target.reachable .target-chance {
        color: #22c55e;
    }

    /* =========================
       RESULT MODAL
    ========================= */

    .modal {
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,.78);
        backdrop-filter: blur(15px);
        z-index: 999;
        display: none;
        align-items: center;
        justify-content: center;
        padding: 20px;
    }

    .modal.show {
        display: flex;
    }

    .result-box {
        width: min(470px, 100%);
        background:
            radial-gradient(circle at 50% 10%, rgba(34,197,94,.12), transparent 35%),
            #0d1117;
        border: 1px solid rgba(255,255,255,.1);
        border-radius: 25px;
        padding: 30px;
        text-align: center;
        box-shadow: 0 40px 120px rgba(0,0,0,.65);
        animation: modalIn .3s ease;
    }

    @keyframes modalIn {
        from {
            transform: scale(.9) translateY(20px);
            opacity: 0;
        }
        to {
            transform: scale(1) translateY(0);
            opacity: 1;
        }
    }

    .result-status {
        font-size: 13px;
        font-weight: 1000;
        letter-spacing: 2px;
        text-transform: uppercase;
    }

    .result-status.win {
        color: #22c55e;
    }

    .result-status.loss {
        color: #ef4444;
    }

    .result-title {
        font-size: 38px;
        font-weight: 1000;
        margin: 7px 0 20px;
    }

    .result-image {
        width: 230px;
        height: 190px;
        margin: 0 auto 18px;
        border-radius: 20px;
        background:
            radial-gradient(circle, rgba(34,197,94,.1), transparent 65%),
            #090c10;
        display: grid;
        place-items: center;
        overflow: hidden;
    }

    .result-image img,
    .result-image svg {
        width: 90%;
        height: 90%;
        object-fit: contain;
    }

    .result-item-name {
        font-size: 20px;
        font-weight: 1000;
    }

    .result-item-price {
        margin-top: 5px;
        color: #22c55e;
        font-size: 18px;
        font-weight: 900;
    }

    .modal-buttons {
        display: flex;
        gap: 10px;
        margin-top: 25px;
    }

    .modal-btn {
        flex: 1;
        height: 52px;
        border-radius: 13px;
        border: 0;
        cursor: pointer;
        font-weight: 1000;
        transition: .2s;
    }

    .modal-btn.green {
        background: #22c55e;
        color: #031007;
    }

    .modal-btn.gray {
        background: rgba(255,255,255,.07);
        color: #fff;
    }

    .modal-btn:hover {
        transform: translateY(-2px);
    }

    /* =========================
       RESPONSIVE
    ========================= */

    @media (max-width: 1250px) {
        .upgrade-layout {
            grid-template-columns: 1fr 1fr;
        }

        .center {
            grid-column: 1 / -1;
            grid-row: 1;
            max-width: 620px;
            width: 100%;
            margin: 0 auto;
        }

        .inventory {
            grid-column: 1;
        }

        .targets {
            grid-column: 2;
        }
    }

    @media (max-width: 800px) {
        .header {
            padding: 0 15px;
        }

        .nav a {
            padding: 8px;
            font-size: 12px;
        }

        .logo {
            font-size: 17px;
        }

        .main {
            padding: 25px 12px 50px;
        }

        .upgrade-layout {
            display: flex;
            flex-direction: column;
        }

        .center,
        .inventory,
        .targets {
            width: 100%;
            max-width: none;
        }

        .wheel-zone {
            width: 330px;
            height: 330px;
        }

        .wheel {
            width: 280px;
            height: 280px;
        }

        .needle {
            top: 30px;
            height: 120px;
        }

        .needle-line {
            height: 105px;
        }
    }

    @media (max-width: 480px) {
        .inventory-grid,
        .targets-grid {
            grid-template-columns: repeat(2, 1fr);
        }

        .upgrade-card {
            padding: 15px;
        }

        .wheel-zone {
            transform: scale(.9);
            margin-top: -15px;
            margin-bottom: 0;
        }

        .values {
            grid-template-columns: 1fr;
        }

        .arrow-between {
            transform: rotate(90deg);
            height: 10px;
        }
    }
</style>
</head>

<body>

<div class="page">

    <!-- HEADER -->

    <header class="header">
        <div class="logo">
            <div class="logo-icon">⚡</div>
            CHAK338
        </div>

        <nav class="nav">

<script src="data.js"></script>

<script>

/* ============================================================
   CHAK338 UPGRADER
   ============================================================

   ГЛАВНОЕ ИСПРАВЛЕНИЕ:

   1. RNG вызывается ТОЛЬКО ОДИН РАЗ.
   2. Сначала определяется WIN/LOSS.
   3. Потом вычисляется конкретный угол.
   4. Стрелка заканчивает вращение ИМЕННО в этом месте.
   5. WIN -> угол внутри зелёного сектора.
   6. LOSS -> угол вне зелёного сектора.
   7. После окончания анимации результат НЕ пересчитывается.

============================================================ */


/* =========================
   STATE
========================= */

let inventory = [];
let selectedIds = new Set();

let chance = 50;
let selectedTarget = null;

let spinning = false;
let pendingWinItem = null;


/* =========================
   DOM
========================= */

const inventoryGrid =
    document.getElementById('inventoryGrid');

const targetsGrid =
    document.getElementById('targetsGrid');

const inventoryCount =
    document.getElementById('inventoryCount');

const targetCount =
    document.getElementById('targetCount');

const reachableCount =
    document.getElementById('reachableCount');

const stakeValue =
    document.getElementById('stakeValue');

const targetValue =
    document.getElementById('targetValue');

const maxTarget =
    document.getElementById('maxTarget');

const chanceValue =
    document.getElementById('chanceValue');

const wheelPercent =
    document.getElementById('wheelPercent');

const wheel =
    document.getElementById('wheel');

const needleWrapper =
    document.getElementById('needleWrapper');

const upgradeButton =
    document.getElementById('upgradeButton');

const resultModal =
    document.getElementById('resultModal');

const resultStatus =
    document.getElementById('resultStatus');

const resultTitle =
    document.getElementById('resultTitle');

const resultImage =
    document.getElementById('resultImage');

const resultItemName =
    document.getElementById('resultItemName');

const resultItemPrice =
    document.getElementById('resultItemPrice');

const takeItemButton =
    document.getElementById('takeItemButton');


/* =========================
   DATA HELPERS
========================= */

function getItemsDatabase() {

    if (Array.isArray(window.ITEMS)) {
        return window.ITEMS;
    }

    if (Array.isArray(window.items)) {
        return window.items;
    }

    if (Array.isArray(window.CASES)) {

        const result = [];

        window.CASES.forEach(c => {

            if (Array.isArray(c.items)) {
                result.push(...c.items);
            }

        });

        return result;
    }

    return [];
}


function getInventory() {

    try {

        const raw =
            localStorage.getItem('chak338_inventory');

        if (!raw) {
            return [];
        }

        const parsed = JSON.parse(raw);

        return Array.isArray(parsed)
            ? parsed
            : [];

    } catch (error) {

        console.error(
            'Ошибка загрузки инвентаря:',
            error
        );

        return [];
    }
}


function saveInventory(items) {

    inventory = items;

    localStorage.setItem(
        'chak338_inventory',
        JSON.stringify(items)
    );
}


function getItemId(item, index = 0) {

    return String(
        item.instanceId ??
        item.inventoryId ??
        item.uid ??
        item.id ??
        (
            item.name +
            '_' +
            item.price +
            '_' +
            index
        )
    );
}


function getItemName(item) {

    return (
        item.name ??
        item.title ??
        'Предмет'
    );
}


function getItemPrice(item) {

    return Number(
        item.price ??
        item.value ??
        0
    );
}


function getItemImage(item) {

    return (
        item.image ??
        item.img ??
        item.icon ??
        ''
    );
}


/* =========================
   IMAGE
========================= */

function renderImage(item, className = '') {

    const src = getItemImage(item);

    if (!src) {

        return `
            <div
                style="
                    font-size:42px;
                    opacity:.45;
                "
            >
                🎁
            </div>
        `;
    }

    return `
        <img
            class="${className}"
            src="${src}"
            alt="${escapeHtml(getItemName(item))}"
            onerror="
                this.style.display='none';
                this.nextElementSibling.style.display='block';
            "
        >

        <div
            style="
                display:none;
                font-size:42px;
                opacity:.45;
            "
        >
            🎁
        </div>
    `;
}


function escapeHtml(value) {

    return String(value)
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
}


/* =========================
   INVENTORY
========================= */

function renderInventory() {

    inventory = getInventory();

    inventoryCount.textContent =
        `${inventory.length} предметов`;

    if (!inventory.length) {

        inventoryGrid.innerHTML = `
            <div class="empty">

                <div
                    style="
                        font-size:48px;
                        margin-bottom:15px;
                    "
                >
                    📦
                </div>

                <div>
                    Инвентарь пуст
                </div>

                <div
                    style="
                        margin-top:8px;
                        font-size:11px;
                    "
                >
                    Открой кейс, чтобы получить предмет
                </div>

            </div>
        `;

        return;
    }


    inventoryGrid.innerHTML =
        inventory
            .map((item, index) => {

                const id =
                    getItemId(item, index);

                const selected =
                    selectedIds.has(id);

                return `

                    <div
                        class="item ${selected ? 'selected' : ''}"
                        data-id="${escapeHtml(id)}"
                        onclick="toggleInventoryItem('${escapeJs(id)}')"
                    >

                        <div class="check">
                            ✓
                        </div>

                        <div class="item-image">
                            ${renderImage(item)}
                        </div>

                        <div class="item-name">
                            ${escapeHtml(getItemName(item))}
                        </div>

                        <div class="item-price">
                            ${getItemPrice(item)}
                        </div>

                    </div>

                `;

            })
            .join('');
}


function escapeJs(value) {

    return String(value)
        .replaceAll('\\', '\\\\')
        .replaceAll("'", "\\'");
}


/* =========================
   SELECT INVENTORY
========================= */

function toggleInventoryItem(id) {

    if (spinning) {
        return;
    }

    if (selectedIds.has(id)) {

        selectedIds.delete(id);

    } else {

        selectedIds.add(id);
    }

    selectedTarget = null;

    renderInventory();
    renderTargets();
    updateInterface();
}


/* =========================
   STAKE
========================= */

function getSelectedItems() {

    return inventory.filter(
        (item, index) =>
            selectedIds.has(
                getItemId(item, index)
            )
    );
}


function getStake() {

    return getSelectedItems()
        .reduce(
            (sum, item) =>
                sum + getItemPrice(item),
            0
        );
}


/* =========================
   TARGETS
========================= */

function renderTargets() {

    const stake = getStake();

    /*
       Например:

       ставка = 100
       шанс = 50%

       максимальная цель =
       100 / 0.5 = 200

       ставка = 100
       шанс = 25%

       максимум =
       100 / 0.25 = 400
    */

    const maximum =
        chance > 0
            ? stake / (chance / 100)
            : 0;


    const allItems =
        getItemsDatabase()
            .filter(
                item =>
                    getItemPrice(item) > stake
            )
            .sort(
                (a, b) =>
                    getItemPrice(a) -
                    getItemPrice(b)
            );


    targetCount.textContent =
        allItems.length;


    let reachable = 0;


    targetsGrid.innerHTML =
        allItems
            .map(item => {

                const price =
                    getItemPrice(item);

                const possible =
                    stake > 0 &&
                    price <= maximum;

                if (possible) {
                    reachable++;
                }


                const isSelected =
                    selectedTarget === item;


                /*
                   Шанс конкретной цели =
                   ставка / цена * 100

                   Но никогда не больше выбранного
                   общего шанса.
                */

                const targetChance =
                    price > 0
                        ? Math.min(
                            100,
                            (stake / price) * 100
                        )
                        : 0;


                return `

                    <div
                        class="
                            target
                            ${possible ? 'reachable' : 'locked'}
                            ${isSelected ? 'selected' : ''}
                        "
                        onclick="
                            ${possible
                                ? `selectTargetByObject(${JSON.stringify(item).replaceAll('"', '&quot;')})`
                                : ''
                            }
                        "
                    >

                        <div class="target-chance">
                            ${possible
                                ? targetChance.toFixed(1) + '%'
                                : '🔒'
                            }
                        </div>

                        <div class="target-image">
                            ${renderImage(item)}
                        </div>

                        <div class="target-name">
                            ${escapeHtml(getItemName(item))}
                        </div>

                        <div class="target-price">
                            ${price}
                        </div>

                    </div>

                `;

            })
            .join('');


    reachableCount.textContent =
        reachable;

    maxTarget.textContent =
        maximum > 0
            ? Math.floor(maximum)
            : '0';
}


/*
   Надёжный выбор цели.
   Вместо передачи объекта через HTML
   ищем его по имени + цене.
*/

function selectTargetByObject(data) {

    if (spinning) {
        return;
    }

    const target =
        getItemsDatabase().find(
            item =>
                getItemName(item) === data.name &&
                getItemPrice(item) === getItemPrice(data)
        );

    if (!target) {
        return;
    }

    const stake = getStake();

    const maximum =
        stake / (chance / 100);

    if (
        stake <= 0 ||
        getItemPrice(target) <= stake ||
        getItemPrice(target) > maximum
    ) {
        return;
    }

    selectedTarget = target;

    renderTargets();
    updateInterface();
}


/* =========================
   INTERFACE
========================= */

function updateInterface() {

    const stake =
        getStake();

    stakeValue.textContent =
        stake;

    chanceValue.textContent =
        chance + '%';

    wheelPercent.textContent =
        chance + '%';

    wheel.style
        .setProperty(
            '--chance',
            chance
        );


    if (selectedTarget) {

        targetValue.textContent =
            getItemPrice(selectedTarget);

    } else {

        targetValue.textContent =
            '—';
    }


    if (spinning) {

        upgradeButton.disabled = true;
        upgradeButton.textContent =
            '⚡ ВРАЩЕНИЕ...';

        return;
    }


    if (!stake) {

        upgradeButton.disabled = true;
        upgradeButton.textContent =
            'ВЫБЕРИ ПРЕДМЕТЫ';

        return;
    }


    if (!selectedTarget) {

        upgradeButton.disabled = true;
        upgradeButton.textContent =
            'ВЫБЕРИ ЦЕЛЬ';

        return;
    }


    upgradeButton.disabled = false;

    upgradeButton.textContent =
        `АПГРЕЙД НА ${getItemPrice(selectedTarget)}`;
}


/* =========================
   CHANCE BUTTONS
========================= */

document
    .querySelectorAll('.chance-btn')
    .forEach(button => {

        button.addEventListener(
            'click',
            () => {

                if (spinning) {
                    return;
                }

                chance =
                    Number(
                        button.dataset.chance
                    );


                document
                    .querySelectorAll('.chance-btn')
                    .forEach(btn => {

                        btn.classList.toggle(
                            'active',
                            btn === button
                        );

                    });


                /*
                   При смене шанса старая цель
                   может стать недоступной.
                */

                const stake =
                    getStake();

                if (selectedTarget) {

                    const maximum =
                        stake / (chance / 100);

                    if (
                        getItemPrice(selectedTarget) >
                        maximum
                    ) {
                        selectedTarget = null;
                    }
                }


                renderTargets();
                updateInterface();
            }
        );

    });


/* =========================
   AUDIO
========================= */

let audioContext = null;

function getAudioContext() {

    if (!audioContext) {

        audioContext =
            new (
                window.AudioContext ||
                window.webkitAudioContext
            )();

    }

    return audioContext;
}


function playTick() {

    try {

        const ctx =
            getAudioContext();

        const oscillator =
            ctx.createOscillator();

        const gain =
            ctx.createGain();

        oscillator.type = 'square';

        oscillator.frequency.setValueAtTime(
            650 + Math.random() * 250,
            ctx.currentTime
        );

        gain.gain.setValueAtTime(
            .045,
            ctx.currentTime
        );

        gain.gain.exponentialRampToValueAtTime(
            .001,
            ctx.currentTime + .035
        );

        oscillator.connect(gain);
        gain.connect(ctx.destination);

        oscillator.start();

        oscillator.stop(
            ctx.currentTime + .04
        );

    } catch (e) {}
}


function playWinSound() {

    try {

        const ctx =
            getAudioContext();

        const notes = [
            523.25,
            659.25,
            783.99,
            1046.50
        ];

        notes.forEach(
            (frequency, index) => {

                const oscillator =
                    ctx.createOscillator();

                const gain =
                    ctx.createGain();

                oscillator.type =
                    'sine';

                oscillator.frequency.value =
                    frequency;

                const start =
                    ctx.currentTime +
                    index * .10;

                gain.gain.setValueAtTime(
                    .001,
                    start
                );

                gain.gain.exponentialRampToValueAtTime(
                    .20,
                    start + .025
                );

                gain.gain.exponentialRampToValueAtTime(
                    .001,
                    start + .25
                );

                oscillator.connect(gain);
                gain.connect(ctx.destination);

                oscillator.start(start);

                oscillator.stop(
                    start + .28
                );

            }
        );

    } catch (e) {}
}


function playLossSound() {

    try {

        const ctx =
            getAudioContext();

        const oscillator =
            ctx.createOscillator();

        const gain =
            ctx.createGain();

        oscillator.type =
            'sawtooth';

        oscillator.frequency.setValueAtTime(
            180,
            ctx.currentTime
        );

        oscillator.frequency.exponentialRampToValueAtTime(
            70,
            ctx.currentTime + .5
        );

        gain.gain.setValueAtTime(
            .001,
            ctx.currentTime
        );

        gain.gain.exponentialRampToValueAtTime(
            .12,
            ctx.currentTime + .03
        );

        gain.gain.exponentialRampToValueAtTime(
            .001,
            ctx.currentTime + .55
        );

        oscillator.connect(gain);
        gain.connect(ctx.destination);

        oscillator.start();

        oscillator.stop(
            ctx.currentTime + .6
        );

    } catch (e) {}
}


/* =========================
   TICK SOUND LOOP
========================= */

let tickTimer = null;

function startTicks() {

    stopTicks();

    let delay = 100;

    function tick() {

        if (!spinning) {
            return;
        }

        playTick();

        delay *= 1.09;

        if (delay > 350) {
            delay = 350;
        }

        tickTimer =
            setTimeout(
                tick,
                delay
            );
    }

    tick();
}


function stopTicks() {

    if (tickTimer) {

        clearTimeout(
            tickTimer
        );

        tickTimer = null;
    }
}


/* ============================================================
   НОВАЯ ЛОГИКА УГЛА СТРЕЛКИ
============================================================ */


/*
   Визуально зелёный сектор начинается сверху:

   0°
   |
   | зелёная зона
   ↓
   chance * 3.6°

   Например 50%:

   0° → 180° = GREEN
   180° → 360° = LOSS
*/


function randomFloat(min, max) {

    return (
        Math.random() *
        (max - min) +
        min
    );
}


/*
   Получаем угол, который гарантированно
   соответствует результату.

   WIN:
      угол находится внутри зелёного сектора.

   LOSS:
      угол находится за пределами зелёного сектора.
*/

function getResultAngle(won) {

    const greenDegrees =
        chance * 3.6;


    let angle;


    if (won) {

        /*
           Не ставим прямо на границу.

           Это важно:
           если шанс 50%, не выбираем
           180.000°, потому что это граница.

           Берём безопасную середину сектора.
        */

        const margin =
            Math.min(
                8,
                greenDegrees * .12
            );

        angle =
            randomFloat(
                margin,
                greenDegrees - margin
            );

    } else {

        const margin =
            Math.min(
                8,
                (360 - greenDegrees) * .12
            );


        angle =
            randomFloat(
                greenDegrees + margin,
                360 - margin
            );
    }


    return angle;
}


/*
   Добавляем несколько полных оборотов,
   чтобы стрелка красиво крутилась.

   При этом последний угол всегда
   сохраняется правильным.
*/

function buildFinalRotation(resultAngle) {

    const fullSpins = 5;

    return (
        fullSpins * 360 +
        resultAngle
    );
}


/* =========================
   START UPGRADE
========================= */

upgradeButton.addEventListener(
    'click',
    startUpgrade
);


function startUpgrade() {

    if (spinning) {
        return;
    }


    const selected =
        getSelectedItems();

    const stake =
        selected.reduce(
            (sum, item) =>
                sum + getItemPrice(item),
            0
        );


    if (!selected.length) {

        alert(
            'Выбери хотя бы один предмет'
        );

        return;
    }


    if (!selectedTarget) {

        alert(
            'Выбери предмет для апгрейда'
        );

        return;
    }


    const targetPrice =
        getItemPrice(
            selectedTarget
        );


    const maximum =
        stake / (chance / 100);


    if (
        targetPrice <= stake ||
        targetPrice > maximum
    ) {

        alert(
            'Эта цель недоступна при выбранном шансе'
        );

        selectedTarget = null;

        renderTargets();
        updateInterface();

        return;
    }


    /* ========================================================
       ВАЖНО:

       RNG ТОЛЬКО ОДИН РАЗ.

       После этой строки результат уже известен.
    ======================================================== */

    const roll =
        Math.random() * 100;

    const won =
        roll < chance;


    /*
       Получаем угол ТОЛЬКО после определения
       результата.

       Поэтому визуальный результат
       гарантированно соответствует результату.
    */

    const resultAngle =
        getResultAngle(won);


    const finalRotation =
        buildFinalRotation(
            resultAngle
        );


    console.log(
        '[UPGRADER]',
        {
            roll,
            chance,
            won,
            resultAngle,
            finalRotation
        }
    );


    spinning = true;

    upgradeButton.disabled =
        true;


    /*
       Запоминаем результат прямо в state.

       Никакого нового Math.random()
       после анимации больше нет.
    */

    window.__upgradeResult = {
        won,
        roll,
        angle: resultAngle,
        target: selectedTarget,
        stake,
        items: selected
    };


    /*
       Удаляем старые визуальные классы.
    */

    wheel.classList.remove(
        'wheel-result-win',
        'wheel-result-loss'
    );


    /*
       Убираем предыдущую анимацию.
    */

    needleWrapper.classList.remove(
        'spinning'
    );

    /*
       Форсируем reflow,
       чтобы CSS-анимация могла стартовать
       заново.
    */

    void needleWrapper.offsetWidth;


    /*
       Передаём CSS финальный угол.

       Именно этот угол соответствует
       результату.
    */

    needleWrapper.style
        .setProperty(
            '--final-angle',
            finalRotation + 'deg'
        );


    /*
       Начинаем звуки.
    */

    startTicks();


    /*
       Запускаем вращение.
    */

    needleWrapper.classList.add(
        'spinning'
    );


    /*
       Немного визуального эффекта.
    */

    wheel.classList.add(
        'spinning'
    );


    /*
       Ждём фактического окончания CSS-анимации.
    */

    needleWrapper.addEventListener(
        'animationend',
        onSpinFinished,
        {
            once: true
        }
    );

}


/* =========================
   FINISH SPIN
========================= */

function onSpinFinished() {

    stopTicks();


    const result =
        window.__upgradeResult;


    if (!result) {

        spinning = false;

        updateInterface();

        return;
    }


    /*
       Ещё раз:

       НЕ ДЕЛАЕМ Math.random() ЗДЕСЬ.

       Результат уже был определён
       ДО вращения.
    */

    const won =
        result.won;


    if (won) {

        wheel.classList.remove(
            'spinning',
            'wheel-result-loss'
        );

        wheel.classList.add(
            'wheel-result-win'
        );

        playWinSound();

    } else {

        wheel.classList.remove(
            'spinning',
            'wheel-result-win'
        );

        wheel.classList.add(
            'wheel-result-loss'
        );

        playLossSound();
    }


    /*
       Если проигрыш:
       ставка сгорает.
    */

    if (!won) {

        removeSelectedFromInventory();

        showLossResult();

        spinning = false;

        selectedIds.clear();

        selectedTarget = null;

        renderInventory();
        renderTargets();
        updateInterface();

        return;
    }


    /*
       WIN:

       Ставка удаляется из инвентаря.

       Сам выигранный предмет НЕ добавляем
       дважды.

       Он попадёт в inventory только
       после нажатия "ЗАБРАТЬ ПРЕДМЕТ".
    */

    removeSelectedFromInventory();


    pendingWinItem = {
        ...result.target
    };


    selectedIds.clear();
    selectedTarget = null;


    spinning = false;


    renderInventory();
    renderTargets();
    updateInterface();


    showWinResult(
        pendingWinItem
    );

}


/* =========================
   REMOVE STAKE
========================= */

function removeSelectedFromInventory() {

    const ids =
        new Set(
            selectedIds
        );


    inventory =
        inventory.filter(
            (item, index) =>
                !ids.has(
                    getItemId(
                        item,
                        index
                    )
                )
        );


    saveInventory(
        inventory
    );
}


/* =========================
   WIN RESULT
========================= */

function showWinResult(item) {

    resultStatus.textContent =
        'ПОБЕДА';

    resultStatus.className =
        'result-status win';


    resultTitle.textContent =
        'АПГРЕЙД УСПЕШЕН!';


    resultImage.innerHTML =
        renderImage(item);


    resultItemName.textContent =
        getItemName(item);


    resultItemPrice.textContent =
        getItemPrice(item) +
        ' XP / VALUE';


    takeItemButton.style.display =
        'block';


    resultModal.classList.add(
        'show'
    );
}


/* =========================
   LOSS RESULT
========================= */

function showLossResult() {

    resultStatus.textContent =
        'ПОРАЖЕНИЕ';

    resultStatus.className =
        'result-status loss';


    resultTitle.textContent =
        'НЕ ПОВЕЗЛО';


    resultImage.innerHTML = `
        <div
            style="
                font-size:80px;
                opacity:.55;
            "
        >
            💀
        </div>
    `;


    resultItemName.textContent =
        'Предметы сгорели';


    resultItemPrice.textContent =
        'Попробуй ещё раз';


    takeItemButton.style.display =
        'none';


    resultModal.classList.add(
        'show'
    );
}


/* =========================
   TAKE WON ITEM
========================= */

function takeWonItem() {

    if (!pendingWinItem) {
        return;
    }


    /*
       Проверяем, не был ли предмет
       уже добавлен.
    */

    const newItem = {
        ...pendingWinItem,

        /*
           Создаём новый уникальный ID.

           Это особенно важно, если выигранный
           предмет уже существует в инвентаре.
        */

        instanceId:
            'upgrade_' +
            Date.now() +
            '_' +
            Math.random()
                .toString(36)
                .slice(2)
    };


    inventory =
        getInventory();


    inventory.push(
        newItem
    );


    saveInventory(
        inventory
    );


    /*
       Начисляем XP за успешный апгрейд.
    */

    addXP(
        getItemPrice(newItem)
    );


    pendingWinItem =
        null;


    closeResult();


    renderInventory();
    renderTargets();
    updateInterface();
}


/* =========================
   CLOSE MODAL
========================= */

function closeResult() {

    resultModal.classList.remove(
        'show'
    );

    wheel.classList.remove(
        'wheel-result-win',
        'wheel-result-loss'
    );

    wheel.classList.remove(
        'spinning'
    );


    /*
       Возвращаем стрелку визуально
       в начальное положение.

       Это происходит после того,
       как пользователь увидел результат.
    */

    needleWrapper.style.transition =
        'transform .35s ease';

    needleWrapper.style.transform =
        'rotate(0deg)';


    setTimeout(
        () => {

            needleWrapper.style.transition =
                '';

            needleWrapper.classList.remove(
                'spinning'
            );

            needleWrapper.style.transform =
                '';

        },
        400
    );


    window.__upgradeResult =
        null;
}


/* =========================
   XP
========================= */

function addXP(amount) {

    try {

        const current =
            Number(
                localStorage.getItem(
                    'chak338_xp'
                ) || 0
            );


        localStorage.setItem(
            'chak338_xp',
            String(
                current + Number(amount)
            )
        );

    } catch (e) {

        console.error(
            'Ошибка XP:',
            e
        );
    }
}


/* =========================
   MODAL CLICK OUTSIDE
========================= */

resultModal.addEventListener(
    'click',
    event => {

        if (
            event.target ===
            resultModal
        ) {
            closeResult();
        }

    }
);


/* =========================
   ESC
========================= */

document.addEventListener(
    'keydown',
    event => {

        if (
            event.key === 'Escape' &&
            resultModal.classList.contains(
                'show'
            )
        ) {

            closeResult();
        }

    }
);


/* =========================
   INIT
========================= */

function init() {

    inventory =
        getInventory();

    selectedIds =
        new Set();

    selectedTarget =
        null;

    chance =
        50;

    renderInventory();
    renderTargets();
    updateInterface();
}


init();

</script>

</body>
</html>
