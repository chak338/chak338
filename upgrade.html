<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

<title>CHAK338 — Апгрейдер</title>

<script src="https://cdn.tailwindcss.com"></script>

<style>

body {
    background:#07070b;
    color:#f8fafc;
}

.card {

    background:#0c0c12;

    border:
        1px solid
        rgba(255,255,255,.08);

}

.item {

    transition:.2s;

}

.item:hover {

    transform:
        translateY(-3px);

}

.selected {

    border-color:
        #d946ef !important;

    box-shadow:
        0 0 25px
        rgba(217,70,239,.15);

}

.target-selected {

    border-color:
        #ef4444 !important;

    box-shadow:
        0 0 25px
        rgba(239,68,68,.2);

}

</style>

    class="fixed top-0
    left-0 right-0 z-50
    bg-[#0c0c12]/90
    backdrop-blur-xl
    border-b border-white/10">

<div
    class="max-w-7xl
    mx-auto px-5">

<div
    class="h-20
    flex items-center
    justify-between">

<a
    href="index.html"
    class="font-black text-xl">

CHAK338

</a>


<div class="flex gap-3">

<a
    href="index.html"
    class="px-4 py-3
    rounded-xl
    bg-white/5
    font-bold">

ГЛАВНАЯ

</a>

<a
    href="inventory.html"
    class="px-4 py-3
    rounded-xl
    bg-white/5
    font-bold">

ИНВЕНТАРЬ

</a>

</div>

</div>

</div>

</header>


<main
    class="max-w-7xl
    mx-auto
    px-5
    pt-32
    pb-20">


<div class="mb-10">

<div
    class="text-xs
    text-fuchsia-400
    uppercase
    tracking-[.3em]
    font-black">

CHAK338 UPGRADE

</div>


<h1
    class="text-5xl
    font-black
    mt-3">

АПГРЕЙДЕР

</h1>


<p
    class="text-zinc-500
    mt-4">

Выбери предметы,
шанс и цель улучшения.

</p>

</div>


<div
    class="grid
    lg:grid-cols-[1fr_320px_1fr]
    gap-5">


<!-- =====================================================
     STAKE
===================================================== -->

<div>

<div
    class="flex
    justify-between
    mb-4">

<h2
    class="font-black
    text-xl">

ТВОИ ПРЕДМЕТЫ

</h2>

<span
    id="stakeValue"
    class="text-zinc-500">

0 коп.

</span>

</div>


<div
    id="stakeItems"
    class="grid
    grid-cols-2
    sm:grid-cols-3
    gap-3">

</div>

</div>


<!-- =====================================================
     CENTER
===================================================== -->

<div
    class="card
    rounded-3xl
    p-6
    h-fit">


<div
    class="text-center">

<div
    class="text-xs
    uppercase
    tracking-widest
    text-zinc-500
    font-black">

Шанс

</div>


<div
    id="chanceText"
    class="text-5xl
    font-black
    mt-2">

50%

</div>

</div>


<div
    class="grid
    grid-cols-4
    gap-2
    mt-6">


<button
    class="chance px-3 py-3
    rounded-xl
    bg-white/5
    font-black"
    data-chance="10">

10%

</button>


<button
    class="chance px-3 py-3
    rounded-xl
    bg-white/5
    font-black"
    data-chance="25">

25%

</button>


<button
    class="chance px-3 py-3
    rounded-xl
    bg-fuchsia-500
    font-black"
    data-chance="50">

50%

</button>


<button
    class="chance px-3 py-3
    rounded-xl
    bg-white/5
    font-black"
    data-chance="75">

75%

</button>

</div>


<div
    class="mt-7
    rounded-2xl
    bg-black/30
    p-4">

<div
    class="text-xs
    text-zinc-500">

МАКСИМАЛЬНАЯ ЦЕНА ЦЕЛИ

</div>

<div
    id="maxTarget"
    class="text-2xl
    font-black
    mt-1">

0 коп.

</div>

</div>


<button
    id="upgradeButton"
    class="w-full
    mt-5
    py-4
    rounded-2xl
    bg-fuchsia-500
    text-white
    font-black">

УЛУЧШИТЬ

</button>


<div
    id="status"
    class="text-center
    text-sm
    text-zinc-500
    mt-4">

Выбери предметы

</div>

</div>


<!-- =====================================================
     TARGET
===================================================== -->

<div>

<div
    class="flex
    justify-between
    mb-4">

<h2
    class="font-black
    text-xl">

ЦЕЛЬ

</h2>

<span
    id="targetValue"
    class="text-zinc-500">

0 коп.

</span>

</div>


<div
    id="targetItems"
    class="grid
    grid-cols-2
    sm:grid-cols-3
    gap-3">

</div>

</div>

</div>

</main>


<script src="data.js"></script>

<script>

let inventory =
    getInventory();


let selectedStake =
    [];


let selectedTarget =
    null;


let selectedChance =
    50;


/* =====================================================
   RENDER STAKE
===================================================== */

function renderStake() {

    const box =
        document.getElementById(
            "stakeItems"
        );


    box.innerHTML = "";


    inventory.forEach(
        (item,index) => {

            const rarity =
                getRarity(
                    item.rarity
                );


            const selected =
                selectedStake.includes(index);


            const card =
                document.createElement(
                    "div"
                );


            card.className =
                `item card rounded-2xl p-3 cursor-pointer ${
                    selected
                    ? "selected"
                    : ""
                }`;


            card.onclick =
                () => toggleStake(index);


            card.innerHTML = `

                <div
                    class="h-28
                    flex items-center
                    justify-center">

                    <img
                        src="${item.image}"
                        class="max-w-full
                        max-h-full
                        object-contain">

                </div>


                <div
                    class="text-[10px]
                    font-black
                    uppercase"
                    style="
                        color:${rarity.color}
                    ">

                    ${rarity.name}

                </div>


                <div
                    class="font-bold
                    text-sm mt-1">

                    ${item.name}

                </div>


                <div
                    class="text-xs
                    text-zinc-500 mt-1">

                    ${formatPrice(item.price)}

                </div>

            `;


            box.appendChild(card);

        }
    );


    updateValues();

}


/* =====================================================
   TOGGLE STAKE
===================================================== */

function toggleStake(index) {

    if (
        selectedStake.includes(index)
    ) {

        selectedStake =
            selectedStake.filter(
                i => i !== index
            );

    } else {

        selectedStake.push(index);

    }


    selectedTarget = null;

    renderStake();

    renderTargets();

}


/* =====================================================
   STAKE VALUE
===================================================== */

function getStakeValue() {

    return selectedStake.reduce(
        (sum,index) => {

            return sum +
                Number(
                    inventory[index].price
                );

        },
        0
    );

}


/* =====================================================
   TARGETS
===================================================== */

function renderTargets() {

    const box =
        document.getElementById(
            "targetItems"
        );


    box.innerHTML = "";


    const stake =
        getStakeValue();


    if (!stake) {

        box.innerHTML = `
            <div
                class="col-span-full
                text-center
                text-zinc-600
                py-16">

                Сначала выбери
                предметы для ставки.

            </div>
        `;

        return;

    }


    const max =
        stake /
        (selectedChance / 100);


    const targets =
        ITEMS.filter(item => {

            return (
                item.price > stake &&
                item.price <= max
            );

        });


    if (!targets.length) {

        box.innerHTML = `
            <div
                class="col-span-full
                text-center
                text-zinc-600
                py-16">

                Для этого шанса
                подходящих целей нет.

            </div>
        `;

        return;

    }


    targets.forEach(item => {

        const rarity =
            getRarity(item.rarity);


        const card =
            document.createElement("div");


        card.className =
            `item card rounded-2xl
            p-3 cursor-pointer ${
                selectedTarget &&
                selectedTarget.id === item.id
                ? "target-selected"
                : ""
            }`;


        card.onclick = () => {

            selectedTarget = item;

            renderTargets();

        };


        card.innerHTML = `

            <div
                class="h-28
                flex items-center
                justify-center">

                <img
                    src="${item.image}"
                    class="max-w-full
                    max-h-full
                    object-contain">

            </div>


            <div
                class="text-[10px]
                uppercase
                font-black"
                style="
                    color:${rarity.color}
                ">

                ${rarity.name}

            </div>


            <div
                class="font-bold
                text-sm mt-1">

                ${item.name}

            </div>


            <div
                class="text-xs
                text-zinc-500 mt-1">

                ${formatPrice(item.price)}

            </div>

        `;


        box.appendChild(card);

    });

}


/* =====================================================
   VALUES
===================================================== */

function updateValues() {

    const stake =
        getStakeValue();


    const max =
        stake
        ? stake /
          (selectedChance / 100)
        : 0;


    document.getElementById(
        "stakeValue"
    ).textContent =
        formatPrice(stake);


    document.getElementById(
        "maxTarget"
    ).textContent =
        formatPrice(max);


    document.getElementById(
        "chanceText"
    ).textContent =
        selectedChance + "%";


    document.getElementById(
        "targetValue"
    ).textContent =
        selectedTarget
        ? formatPrice(
            selectedTarget.price
          )
        : "0 коп.";


    const button =
        document.getElementById(
            "upgradeButton"
        );


    const status =
        document.getElementById(
            "status"
        );


    if (!stake) {

        button.disabled = true;

        button.classList.add(
            "opacity-40"
        );

        status.textContent =
            "Выбери предметы";

        return;

    }


    if (!selectedTarget) {

        button.disabled = true;

        button.classList.add(
            "opacity-40"
        );

        status.textContent =
            "Выбери предмет-цель";

        return;

    }


    button.disabled = false;

    button.classList.remove(
        "opacity-40"
    );

    status.textContent =
        `Шанс успеха: ${selectedChance}%`;

}


/* =====================================================
   CHANCE
===================================================== */

document
    .querySelectorAll(".chance")
    .forEach(button => {

        button.onclick = () => {

            selectedChance =
                Number(
                    button.dataset.chance
                );


            document
                .querySelectorAll(".chance")
                .forEach(b => {

                    b.classList.remove(
                        "bg-fuchsia-500"
                    );

                    b.classList.add(
                        "bg-white/5"
                    );

                });


            button.classList.remove(
                "bg-white/5"
            );

            button.classList.add(
                "bg-fuchsia-500"
            );


            selectedTarget = null;


            updateValues();

            renderTargets();

        };

    });


/* =====================================================
   UPGRADE
===================================================== */

document.getElementById(
    "upgradeButton"
).onclick = () => {

    if (
        !selectedStake.length ||
        !selectedTarget
    ) {

        return;

    }


    const roll =
        Math.random() * 100;


    const win =
        roll < selectedChance;


    if (win) {

        removeInventoryItems(
            selectedStake
        );


        addInventoryItem(
            selectedTarget
        );


        alert(
            `УСПЕХ!\n\nТы получил: ${selectedTarget.name}`
        );

    } else {

        removeInventoryItems(
            selectedStake
        );


        alert(
            "НЕУДАЧА!\n\nПредметы ставки потеряны."
        );

    }


    inventory =
        getInventory();


    selectedStake = [];

    selectedTarget = null;


    renderStake();

    renderTargets();

    updateValues();

};


/* =====================================================
   START
===================================================== */

renderStake();

renderTargets();

updateValues();

</script>

</body>

</html>
