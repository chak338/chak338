<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CHAK338 — Апгрейд</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="data.js"></script>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background:
        radial-gradient(circle at 50% 0%, rgba(124,58,237,.12), transparent 35%),
        #070911;
    color: white;
    font-family: Arial, Helvetica, sans-serif;
}

header {
    height: 84px;
    border-bottom: 1px solid #171a27;
    background: rgba(7,9,17,.92);
}

.logo {
    font-size: 24px;
    font-weight: 900;
    letter-spacing: -.5px;
}

.logo span {
    color: #9b6cff;
}

.nav-link {
    color: #c8cad3;
    text-decoration: none;
    transition: .2s;
}

.nav-link:hover {
    color: white;
}

.nav-active {
    background: #7c3aed;
    color: white;
    padding: 12px 18px;
    border-radius: 13px;
}

.page {
    max-width: 1240px;
    margin: 26px auto;
    padding: 0 16px;
}

.layout {
    display: grid;
    grid-template-columns: 320px minmax(420px, 1fr) 320px;
    gap: 20px;
}

.panel {
    background: #0d101c;
    border: 1px solid #202433;
    border-radius: 24px;
    min-height: 760px;
    overflow: hidden;
}

.panel-head {
    padding: 22px 20px 14px;
}

.panel-label {
    font-size: 12px;
    color: #7f8494;
    text-transform: uppercase;
    letter-spacing: .08em;
    font-weight: 700;
}

.panel-title {
    margin-top: 5px;
    font-size: 22px;
    font-weight: 900;
}

.coins {
    color: #a78bfa;
    font-weight: 900;
    font-size: 18px;
}

.inventory-grid {
    padding: 0 20px 20px;
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
}

.item-card {
    position: relative;
    background: #151824;
    border: 1px solid #242837;
    border-radius: 17px;
    padding: 10px;
    cursor: pointer;
    transition: .18s;
    min-width: 0;
}

.item-card:hover {
    transform: translateY(-2px);
    border-color: #6840d7;
}

.item-card.selected {
    border: 2px solid #914dff;
    box-shadow: 0 0 25px rgba(124,58,237,.18);
}

.item-image {
    width: 100%;
    aspect-ratio: 1;
    object-fit: contain;
    display: block;
    border-radius: 10px;
    background: #0b0e17;
}

.item-name {
    text-align: center;
    margin-top: 7px;
    font-size: 12px;
    font-weight: 800;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.item-price {
    text-align: center;
    color: #a78bfa;
    font-size: 14px;
    font-weight: 900;
    margin-top: 3px;
}

.center {
    min-height: 760px;
    display: flex;
    flex-direction: column;
    align-items: center;
}

.chance-label {
    margin-top: 20px;
    color: #777c8b;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: .12em;
    font-weight: 800;
}

.chance-number {
    font-size: 38px;
    font-weight: 900;
    margin-top: 2px;
}

.wheel-wrap {
    width: 380px;
    height: 380px;
    position: relative;
    margin-top: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
}

/*
=========================================================
ГЛАВНОЕ ИСПРАВЛЕНИЕ СТРЕЛКИ
=========================================================

Раньше стрелка находилась снаружи круга.

Теперь она находится ВНУТРИ wheel-wrap:
top: 19px

Она не выходит за пределы внешнего круга.
*/

.pointer {
    position: absolute;

    top: 18px;
    left: 50%;

    transform: translateX(-50%);

    width: 0;
    height: 0;

    border-left: 7px solid transparent;
    border-right: 7px solid transparent;
    border-top: 16px solid #55ff9a;

    filter:
        drop-shadow(0 0 5px rgba(85,255,154,.9))
        drop-shadow(0 0 10px rgba(85,255,154,.5));

    z-index: 20;

    transition: filter .2s;
}

.pointer::after {
    content: "";

    position: absolute;

    left: -2px;
    top: -16px;

    width: 4px;
    height: 16px;

    background: #55ff9a;

    border-radius: 999px;

    box-shadow:
        0 0 6px #55ff9a,
        0 0 12px rgba(85,255,154,.6);
}

.wheel {
    width: 350px;
    height: 350px;
    border-radius: 50%;

    padding: 22px;

    background:
        conic-gradient(
            from -90deg,
            #19b657 0deg,
            #19b657 var(--green-angle),
            #1a2233 var(--green-angle),
            #1a2233 360deg
        );

    box-shadow:
        0 0 0 8px #111624,
        0 0 0 10px #181d2c,
        0 20px 60px rgba(0,0,0,.35);

    position: relative;

    transform: rotate(0deg);
    transition: transform 4.3s cubic-bezier(.12,.72,.1,1);
}

.wheel::before {
    content: "";

    position: absolute;
    inset: 22px;

    border-radius: 50%;

    background:
        radial-gradient(
            circle at 50% 45%,
            #101624,
            #090c15 70%
        );

    border: 1px solid #202737;
}

.wheel-center {
    position: absolute;

    left: 50%;
    top: 50%;

    transform: translate(-50%, -50%);

    width: 72px;
    height: 72px;

    border-radius: 50%;

    background:
        radial-gradient(circle, #171d2b, #0c101a);

    border: 2px solid #2c3445;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 30px;

    z-index: 5;
}

.chance-buttons {
    display: flex;
    gap: 8px;
    margin-top: 25px;
}

.chance-btn {
    width: 90px;
    height: 44px;

    border: 0;
    border-radius: 12px;

    background: #171b29;
    color: white;

    font-weight: 900;
    font-size: 16px;

    cursor: pointer;

    transition: .2s;
}

.chance-btn:hover {
    background: #22273a;
}

.chance-btn.active {
    background: #813cff;
    box-shadow: 0 8px 24px rgba(124,58,237,.3);
}

.info-box {
    margin-top: 20px;

    width: min(385px, calc(100% - 30px));

    padding: 17px;

    border-radius: 15px;

    background: #181c29;

    text-align: center;

    color: #8d91a0;

    line-height: 1.5;
}

.info-box strong {
    color: #a78bfa;
}

.upgrade-button {
    width: min(385px, calc(100% - 30px));

    margin-top: 16px;

    height: 60px;

    border: 0;
    border-radius: 16px;

    background: linear-gradient(
        135deg,
        #7c3aed,
        #9333ea
    );

    color: white;

    font-size: 18px;
    font-weight: 900;

    cursor: pointer;

    box-shadow: 0 15px 35px rgba(124,58,237,.25);

    transition: .2s;
}

.upgrade-button:hover {
    transform: translateY(-2px);
}

.upgrade-button:disabled {
    opacity: .4;
    cursor: not-allowed;
    transform: none;
}

.targets {
    height: 660px;
    overflow-y: auto;
    padding: 0 20px 20px;

    scrollbar-width: thin;
    scrollbar-color: #555 #11131c;
}

.target-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
}

.target-card {
    background: #151824;
    border: 1px solid #222737;
    border-radius: 17px;
    padding: 10px;

    opacity: .42;

    transition: .18s;
}

.target-card.available {
    opacity: 1;
    cursor: pointer;
}

.target-card.available:hover {
    transform: translateY(-2px);
    border-color: #7546dc;
}

.target-card.selected {
    border: 2px solid #914dff;
    opacity: 1;
    box-shadow: 0 0 25px rgba(124,58,237,.18);
}

.target-card img {
    width: 100%;
    aspect-ratio: 1;
    object-fit: contain;
    background: #0b0e17;
    border-radius: 10px;
}

.target-name {
    font-size: 12px;
    text-align: center;
    font-weight: 800;
    margin-top: 7px;

    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.target-price {
    text-align: center;
    color: #a78bfa;
    font-weight: 900;
    margin-top: 3px;
}

.target-status {
    text-align: center;
    color: #27e879;
    font-size: 11px;
    font-weight: 800;
    margin-top: 5px;
}

.target-status.unavailable {
    color: #353947;
}

.result-overlay {
    position: fixed;
    inset: 0;

    background: rgba(2,3,8,.82);
    backdrop-filter: blur(8px);

    display: none;

    align-items: center;
    justify-content: center;

    z-index: 100;
}

.result-overlay.show {
    display: flex;
}

.result-modal {
    width: min(420px, calc(100% - 30px));

    padding: 28px;

    border-radius: 24px;

    background:
        radial-gradient(circle at top, rgba(124,58,237,.16), transparent 45%),
        #0e111c;

    border: 1px solid #2b3042;

    text-align: center;
}

.result-title {
    font-size: 28px;
    font-weight: 900;
}

.result-title.win {
    color: #45f08b;
}

.result-title.loss {
    color: #ff5f70;
}

.result-image {
    width: 190px;
    height: 190px;
    object-fit: contain;
    margin: 20px auto;
    display: block;
    border-radius: 20px;
    background: #090c15;
}

.result-name {
    font-size: 21px;
    font-weight: 900;
}

.result-price {
    color: #a78bfa;
    font-size: 18px;
    font-weight: 900;
    margin-top: 6px;
}

.result-close {
    width: 100%;
    height: 52px;

    margin-top: 22px;

    border: 0;
    border-radius: 13px;

    background: #7c3aed;

    color: white;
    font-size: 16px;
    font-weight: 900;

    cursor: pointer;
}

.empty {
    padding: 40px 20px;
    text-align: center;
    color: #696e7d;
}

@media (max-width: 1050px) {
    .layout {
        grid-template-columns: 280px 1fr;
    }

    .panel:last-child {
        grid-column: 1 / -1;
        min-height: auto;
    }

    .targets {
        height: 400px;
    }
}

@media (max-width: 720px) {
    .layout {
        grid-template-columns: 1fr;
    }

    .panel {
        min-height: auto;
    }

    .wheel-wrap {
        transform: scale(.86);
        margin-top: -5px;
        margin-bottom: -20px;
    }

    header {
        height: auto;
        padding: 16px;
    }

    .header-inner {
        flex-direction: column;
        gap: 15px;
    }
}

</style>
</head>

<script>

let inventory = [];
let selectedInventory = new Set();

let selectedTarget = null;

let chance = 50;

let spinning = false;


/* =========================================================
   SOUND
   ========================================================= */

let audioContext = null;

function getAudio() {

    if (!audioContext) {
        audioContext = new (
            window.AudioContext ||
            window.webkitAudioContext
        )();
    }

    return audioContext;
}

function soundTick() {

    try {

        const ctx = getAudio();

        const oscillator = ctx.createOscillator();
        const gain = ctx.createGain();

        oscillator.type = 'square';
        oscillator.frequency.value = 520;

        gain.gain.setValueAtTime(
            .0001,
            ctx.currentTime
        );

        gain.gain.exponentialRampToValueAtTime(
            .045,
            ctx.currentTime + .008
        );

        gain.gain.exponentialRampToValueAtTime(
            .0001,
            ctx.currentTime + .045
        );

        oscillator.connect(gain);
        gain.connect(ctx.destination);

        oscillator.start();
        oscillator.stop(ctx.currentTime + .05);

    } catch {}
}

function soundWin() {

    try {

        const ctx = getAudio();

        [523, 659, 784, 1046].forEach(
            (frequency, index) => {

                const oscillator =
                    ctx.createOscillator();

                const gain =
                    ctx.createGain();

                oscillator.type = 'sine';

                oscillator.frequency.value =
                    frequency;

                gain.gain.setValueAtTime(
                    .0001,
                    ctx.currentTime + index * .08
                );

                gain.gain.exponentialRampToValueAtTime(
                    .13,
                    ctx.currentTime + index * .08 + .02
                );

                gain.gain.exponentialRampToValueAtTime(
                    .0001,
                    ctx.currentTime + index * .08 + .18
                );

                oscillator.connect(gain);
                gain.connect(ctx.destination);

                oscillator.start(
                    ctx.currentTime + index * .08
                );

                oscillator.stop(
                    ctx.currentTime + index * .08 + .2
                );

            }
        );

    } catch {}
}

function soundLoss() {

    try {

        const ctx = getAudio();

        const oscillator =
            ctx.createOscillator();

        const gain =
            ctx.createGain();

        oscillator.type = 'sawtooth';
        oscillator.frequency.setValueAtTime(
            180,
            ctx.currentTime
        );

        oscillator.frequency.exponentialRampToValueAtTime(
            70,
            ctx.currentTime + .45
        );

        gain.gain.setValueAtTime(
            .0001,
            ctx.currentTime
        );

        gain.gain.exponentialRampToValueAtTime(
            .09,
            ctx.currentTime + .02
        );

        gain.gain.exponentialRampToValueAtTime(
            .0001,
            ctx.currentTime + .45
        );

        oscillator.connect(gain);
        gain.connect(ctx.destination);

        oscillator.start();
        oscillator.stop(ctx.currentTime + .48);

    } catch {}
}


/* =========================================================
   IMAGE FIX
   ========================================================= */

function resolveItem(item) {

    if (!item) return null;

    let source = null;

    if (item.id) {
        source = getItemById(item.id);
    }

    if (!source && item.name) {
        source = ITEMS.find(
            x => x.name === item.name
        );
    }

    return source
        ? {
            ...source,
            ...item,
            image: source.image
        }
        : item;
}


/* =========================================================
   INVENTORY
   ========================================================= */

function loadInventory() {

    inventory =
        typeof normalizeInventory === 'function'
            ? normalizeInventory()
            : getInventory();

    inventory =
        inventory.map(resolveItem);

    saveInventory(inventory);

    renderInventory();
    renderTargets();
    updateUI();
}


function renderInventory() {

    const container =
        document.getElementById('inventoryGrid');

    if (!inventory.length) {

        container.innerHTML = `
            <div class="empty" style="grid-column:1/-1">
                Инвентарь пуст
            </div>
        `;

        return;
    }

    container.innerHTML =
        inventory.map((item, index) => {

            const selected =
                selectedInventory.has(
                    item.uid
                );

            return `
                <div
                    class="item-card ${selected ? 'selected' : ''}"
                    data-index="${index}">

                    <img
                        class="item-image"
                        src="${item.image}"
                        alt="${escapeHtml(item.name)}"
                        onerror="this.style.display='none'">

                    <div class="item-name">
                        ${escapeHtml(item.name)}
                    </div>

                    <div class="item-price">
                        ${formatCoins(item.price)}
                    </div>

                </div>
            `;

        }).join('');


    container
        .querySelectorAll('.item-card')
        .forEach(card => {

            card.addEventListener(
                'click',
                () => {

                    const index =
                        Number(card.dataset.index);

                    toggleInventoryItem(
                        inventory[index]
                    );

                }
            );

        });
}


function toggleInventoryItem(item) {

    if (!item || spinning) return;

    if (selectedInventory.has(item.uid)) {

        selectedInventory.delete(item.uid);

    } else {

        selectedInventory.add(item.uid);

    }

    selectedTarget = null;

    renderInventory();
    renderTargets();
    updateUI();
}


/* =========================================================
   TARGETS
   ========================================================= */

function getStake() {

    return inventory
        .filter(item =>
            selectedInventory.has(item.uid)
        )
        .reduce(
            (sum, item) =>
                sum + Number(item.price || 0),
            0
        );
}


function getMaximumTarget() {

    const stake = getStake();

    if (!stake) return 0;

    return Math.floor(
        stake / (chance / 100)
    );
}


function renderTargets() {

    const container =
        document.getElementById('targetGrid');

    const stake = getStake();
    const max = getMaximumTarget();

    const targets =
        ITEMS
            .filter(item =>
                item.price > stake
            )
            .sort(
                (a, b) =>
                    a.price - b.price
            );

    container.innerHTML =
        targets.map(item => {

            const available =
                stake > 0 &&
                item.price <= max;

            const selected =
                selectedTarget &&
                selectedTarget.id === item.id;

            return `
                <div
                    class="
                        target-card
                        ${available ? 'available' : ''}
                        ${selected ? 'selected' : ''}
                    "
                    data-id="${item.id}">

                    <img
                        src="${item.image}"
                        alt="${escapeHtml(item.name)}">

                    <div class="target-name">
                        ${escapeHtml(item.name)}
                    </div>

                    <div class="target-price">
                        ${formatCoins(item.price)}
                    </div>

                    <div class="
                        target-status
                        ${available ? '' : 'unavailable'}
                    ">
                        ${available ? 'ДОСТУПНО' : 'НЕДОСТУПНО'}
                    </div>

                </div>
            `;

        }).join('');


    container
        .querySelectorAll('.target-card.available')
        .forEach(card => {

            card.addEventListener(
                'click',
                () => {

                    const id =
                        card.dataset.id;

                    selectedTarget =
                        getItemById(id);

                    renderTargets();
                    updateUI();

                }
            );

        });
}


/* =========================================================
   UI
   ========================================================= */

function updateUI() {

    const stake = getStake();
    const max = getMaximumTarget();

    document.getElementById(
        'inventoryCoins'
    ).textContent =
        formatCoins(stake);

    document.getElementById(
        'stakeValue'
    ).textContent =
        formatCoins(stake);

    document.getElementById(
        'targetValue'
    ).textContent =
        selectedTarget
            ? formatCoins(selectedTarget.price)
            : '0';

    document.getElementById(
        'maxValue'
    ).textContent =
        formatCoins(max);

    document.getElementById(
        'chanceNumber'
    ).textContent =
        `${chance}%`;

    document.getElementById(
        'chanceValue'
    ).textContent =
        chance;


    const button =
        document.getElementById(
            'upgradeButton'
        );

    const targetAllowed =
        selectedTarget &&
        selectedTarget.price <= max &&
        selectedTarget.price > stake;

    button.disabled =
        spinning ||
        stake <= 0 ||
        !targetAllowed;


    document
        .querySelectorAll('.chance-btn')
        .forEach(btn => {

            btn.classList.toggle(
                'active',
                Number(btn.dataset.chance) === chance
            );

        });


    updateWheelPreview();
}


/* =========================================================
   WHEEL PREVIEW
   ========================================================= */

function updateWheelPreview() {

    const wheel =
        document.getElementById('wheel');

    wheel.style.setProperty(
        '--green-angle',
        `${chance * 3.6}deg`
    );
}


/* =========================================================
   UPGRADE
   ========================================================= */

async function startUpgrade() {

    if (spinning) return;

    const stake = getStake();
    const max = getMaximumTarget();

    if (!stake) return;

    if (!selectedTarget) return;

    if (selectedTarget.price > max) return;

    if (selectedTarget.price <= stake) return;


    spinning = true;

    document.getElementById(
        'upgradeButton'
    ).disabled = true;


    /*
     * =====================================================
     * ВАЖНО:
     *
     * СНАЧАЛА определяем результат.
     *
     * Потом вращаем колесо именно к этому результату.
     *
     * Поэтому визуальная стрелка и сообщение
     * больше никогда не будут противоречить друг другу.
     * =====================================================
     */

    const random =
        Math.random() * 100;

    const won =
        random < chance;


    /*
     * randomPercent:
     *
     * WIN  -> попадает внутрь зелёного сектора
     * LOSS -> попадает за зелёным сектором
     */

    let randomPercent;

    if (won) {

        randomPercent =
            Math.random() * chance;

    } else {

        randomPercent =
            chance +
            Math.random() * (100 - chance);

    }


    /*
     * Колесо находится в состоянии:
     *
     * зелёная зона начинается сверху.
     *
     * Чтобы нужная точка оказалась под
     * фиксированной стрелкой сверху,
     * вращаем колесо на соответствующий угол.
     */

    const targetAngle =
        randomPercent * 3.6;

    const extraSpins =
        360 * 6;

    const finalRotation =
        extraSpins + (360 - targetAngle);


    const wheel =
        document.getElementById('wheel');

    wheel.style.transition =
        'transform 4.3s cubic-bezier(.12,.72,.1,1)';

    wheel.style.transform =
        `rotate(${finalRotation}deg)`;


    /*
     * Звук тиков во время вращения.
     */

    const tickTimer =
        setInterval(
            soundTick,
            105
        );


    await wait(4350);

    clearInterval(tickTimer);


    /*
     * =====================================================
     * СНЯТИЕ СТАВКИ
     * =====================================================
     */

    const selectedIds =
        new Set(selectedInventory);

    inventory =
        inventory.filter(
            item =>
                !selectedIds.has(item.uid)
        );


    /*
     * =====================================================
     * WIN
     * =====================================================
     */

    if (won) {

        const wonItem =
            createInventoryItem(
                selectedTarget
            );

        /*
         * Предмет сразу попадает в инвентарь.
         * Не нужно отдельно "забирать" его,
         * иначе пользователь мог закрыть окно
         * и потерять результат.
         */

        inventory.push(wonItem);

        saveInventory(inventory);

        soundWin();

        showResult(
            true,
            wonItem
        );

    }


    /*
     * =====================================================
     * LOSS
     * =====================================================
     */

    else {

        saveInventory(inventory);

        soundLoss();

        showResult(
            false,
            selectedTarget
        );

    }


    selectedInventory.clear();
    selectedTarget = null;

    spinning = false;

    /*
     * Сбрасываем колесо после результата.
     */

    setTimeout(() => {

        wheel.style.transition =
            'none';

        wheel.style.transform =
            'rotate(0deg)';

        requestAnimationFrame(() => {

            wheel.style.transition =
                'transform 4.3s cubic-bezier(.12,.72,.1,1)';

        });

        renderInventory();
        renderTargets();
        updateUI();

    }, 500);

}


/* =========================================================
   RESULT
   ========================================================= */

function showResult(won, item) {

    const overlay =
        document.getElementById(
            'resultOverlay'
        );

    const title =
        document.getElementById(
            'resultTitle'
        );

    const image =
        document.getElementById(
            'resultImage'
        );

    const name =
        document.getElementById(
            'resultName'
        );

    const price =
        document.getElementById(
            'resultPrice'
        );


    title.className =
        `result-title ${won ? 'win' : 'loss'}`;

    title.textContent =
        won
            ? '🎉 ВЫ ВЫИГРАЛИ!'
            : 'ПОПЫТКА НЕ УДАЛАСЬ';


    image.src =
        item.image;

    image.alt =
        item.name;


    name.textContent =
        item.name;

    price.textContent =
        `${formatCoins(item.price)} монет`;


    overlay.classList.add(
        'show'
    );
}


/* =========================================================
   CLOSE RESULT
   ========================================================= */

document.getElementById(
    'resultClose'
).addEventListener(
    'click',
    () => {

        document.getElementById(
            'resultOverlay'
        ).classList.remove('show');

    }
);


/* =========================================================
   CHANCE BUTTONS
   ========================================================= */

document
    .querySelectorAll('.chance-btn')
    .forEach(button => {

        button.addEventListener(
            'click',
            () => {

                if (spinning) return;

                chance =
                    Number(
                        button.dataset.chance
                    );

                selectedTarget = null;

                renderTargets();
                updateUI();

            }
        );

    });


/* =========================================================
   HELPERS
   ========================================================= */

function wait(ms) {

    return new Promise(
        resolve =>
            setTimeout(
                resolve,
                ms
            )
    );
}


function escapeHtml(value) {

    return String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');

}


/* =========================================================
   START
   ========================================================= */

loadInventory();

</script>
