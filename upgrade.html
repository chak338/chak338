<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CHAK338 — Upgrader</title>

<script src="data.js"></script>

<style>
* {
    box-sizing: border-box;
}

:root {
    --bg: #07090d;
    --panel: #0d1118;
    --panel2: #111722;
    --border: rgba(255,255,255,.08);
    --text: #f4f7fb;
    --muted: #7e899a;
    --green: #22e58a;
    --green2: #16a866;
    --red: #ff3f58;
    --yellow: #ffc857;
    --blue: #4da6ff;
}

body {
    margin: 0;
    min-height: 100vh;
    color: var(--text);
    background:
        radial-gradient(circle at 50% -10%, rgba(30,100,70,.16), transparent 35%),
        linear-gradient(180deg,#080a0f,#05070a);
    font-family: Inter, Arial, sans-serif;
}

button {
    font: inherit;
}

.header {
    height: 70px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 28px;
    border-bottom: 1px solid var(--border);
    background: rgba(7,9,13,.9);
    backdrop-filter: blur(12px);
    position: sticky;
    top: 0;
    z-index: 20;
}

.logo {
    font-size: 22px;
    font-weight: 900;
    letter-spacing: -1px;
}

.logo span {
    color: var(--green);
}

.nav {
    display: flex;
    gap: 8px;
}

.nav a {
    color: #9da7b5;
    text-decoration: none;
    padding: 10px 14px;
    border-radius: 9px;
    font-size: 14px;
    font-weight: 700;
}

.nav a:hover,
.nav a.active {
    color: white;
    background: rgba(255,255,255,.06);
}

.xp {
    padding: 9px 13px;
    border: 1px solid rgba(34,229,138,.2);
    background: rgba(34,229,138,.06);
    color: var(--green);
    border-radius: 9px;
    font-weight: 800;
    font-size: 13px;
}

.page {
    max-width: 1500px;
    margin: auto;
    padding: 30px 20px 70px;
}

.title {
    text-align: center;
    margin-bottom: 24px;
}

.title h1 {
    margin: 0;
    font-size: 32px;
    font-weight: 950;
}

.title p {
    margin: 8px 0 0;
    color: var(--muted);
}

.layout {
    display: grid;
    grid-template-columns: 330px minmax(430px, 1fr) 330px;
    gap: 18px;
    align-items: start;
}

.panel {
    background: linear-gradient(180deg,rgba(17,23,34,.96),rgba(10,14,21,.96));
    border: 1px solid var(--border);
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 15px 50px rgba(0,0,0,.25);
}

.panel-head {
    padding: 17px 18px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.panel-head h2 {
    margin: 0;
    font-size: 15px;
}

.panel-head span {
    color: var(--muted);
    font-size: 12px;
}

.inventory {
    padding: 12px;
    max-height: 690px;
    overflow-y: auto;
}

.item {
    position: relative;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px;
    margin-bottom: 8px;
    border-radius: 11px;
    border: 1px solid rgba(255,255,255,.06);
    background: rgba(255,255,255,.025);
    cursor: pointer;
    transition: .18s;
}

.item:hover {
    border-color: rgba(34,229,138,.25);
    transform: translateY(-1px);
}

.item.selected {
    border-color: rgba(34,229,138,.75);
    background: rgba(34,229,138,.09);
    box-shadow: 0 0 18px rgba(34,229,138,.09);
}

.item-img {
    width: 58px;
    height: 58px;
    object-fit: contain;
    flex: 0 0 58px;
    background: rgba(0,0,0,.2);
    border-radius: 8px;
}

.item-info {
    min-width: 0;
    flex: 1;
}

.item-name {
    font-size: 13px;
    font-weight: 800;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.item-price {
    margin-top: 5px;
    color: var(--green);
    font-size: 13px;
    font-weight: 900;
}

.check {
    width: 21px;
    height: 21px;
    border-radius: 50%;
    border: 1px solid #4b5666;
    display: grid;
    place-items: center;
    font-size: 12px;
}

.item.selected .check {
    background: var(--green);
    color: #04130c;
    border-color: var(--green);
}

.center {
    display: flex;
    flex-direction: column;
    gap: 16px;
}

.upgrade-card {
    padding: 22px;
    text-align: center;
}

.selected-value {
    display: flex;
    justify-content: center;
    gap: 8px;
    color: var(--muted);
    font-size: 13px;
}

.selected-value strong {
    color: white;
    font-size: 16px;
}

.wheel-wrap {
    width: min(390px, 80vw);
    aspect-ratio: 1;
    margin: 24px auto;
    position: relative;
}

.wheel {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background:
        conic-gradient(
            from -90deg,
            var(--green) 0deg,
            var(--green) calc(var(--chance) * 3.6deg),
            #40151e calc(var(--chance) * 3.6deg),
            #151922 360deg
        );
    box-shadow:
        0 0 0 9px #0b0f15,
        0 0 0 10px rgba(255,255,255,.07),
        0 0 35px rgba(34,229,138,.12);
    transition: background .35s ease, transform .15s;
}

.wheel::before {
    content: "";
    position: absolute;
    inset: 17px;
    border-radius: 50%;
    background:
        radial-gradient(circle,#161d28 0%,#0c1119 68%,#090c11 100%);
    box-shadow: inset 0 0 25px rgba(0,0,0,.8);
}

.wheel::after {
    content: "";
    position: absolute;
    inset: 5px;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,.08);
}

.pointer {
    position: absolute;
    z-index: 4;
    left: 50%;
    top: -13px;
    transform: translateX(-50%);
    width: 0;
    height: 0;
    border-left: 13px solid transparent;
    border-right: 13px solid transparent;
    border-top: 27px solid white;
    filter: drop-shadow(0 0 7px rgba(255,255,255,.7));
}

.needle {
    position: absolute;
    z-index: 3;
    left: 50%;
    top: 50%;
    width: 5px;
    height: 44%;
    transform-origin: 50% 100%;
    transform: translate(-50%,-100%) rotate(0deg);
    transition: transform 3.4s cubic-bezier(.12,.68,.12,1);
}

.needle::before {
    content: "";
    position: absolute;
    left: 50%;
    top: 0;
    width: 5px;
    height: 100%;
    transform: translateX(-50%);
    border-radius: 10px;
    background: white;
    box-shadow: 0 0 9px rgba(255,255,255,.8);
}

.needle-dot {
    position: absolute;
    left: 50%;
    bottom: -10px;
    transform: translateX(-50%);
    width: 25px;
    height: 25px;
    border-radius: 50%;
    background: #e8edf4;
    border: 5px solid #0b0f15;
    box-shadow: 0 0 15px rgba(255,255,255,.25);
}

.wheel-center {
    position: absolute;
    z-index: 5;
    inset: 50%;
    transform: translate(-50%,-50%);
    text-align: center;
    width: 180px;
}

.chance-big {
    font-size: 47px;
    line-height: 1;
    font-weight: 950;
    color: var(--green);
    text-shadow: 0 0 22px rgba(34,229,138,.3);
}

.chance-label {
    margin-top: 7px;
    color: #7f8998;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    font-weight: 800;
}

.result {
    min-height: 54px;
    margin-top: 3px;
    display: flex;
    align-items: center;
    justify-content: center;
}

.result-message {
    display: none;
    width: 100%;
    padding: 13px;
    border-radius: 10px;
    font-weight: 900;
}

.result-message.success {
    display: block;
    color: var(--green);
    background: rgba(34,229,138,.08);
    border: 1px solid rgba(34,229,138,.25);
}

.result-message.fail {
    display: block;
    color: var(--red);
    background: rgba(255,63,88,.08);
    border: 1px solid rgba(255,63,88,.25);
}

.chances {
    display: grid;
    grid-template-columns: repeat(4,1fr);
    gap: 8px;
    margin-top: 8px;
}

.chance-btn {
    border: 1px solid rgba(255,255,255,.08);
    background: #0c1118;
    color: #9ba5b4;
    padding: 11px 5px;
    border-radius: 9px;
    cursor: pointer;
    font-weight: 900;
}

.chance-btn:hover {
    color: white;
    border-color: rgba(255,255,255,.18);
}

.chance-btn.active {
    background: rgba(34,229,138,.12);
    color: var(--green);
    border-color: rgba(34,229,138,.55);
    box-shadow: 0 0 15px rgba(34,229,138,.08);
}

.stats {
    display: grid;
    grid-template-columns: repeat(3,1fr);
    gap: 8px;
    margin-top: 15px;
}

.stat {
    padding: 11px 7px;
    background: rgba(255,255,255,.025);
    border: 1px solid rgba(255,255,255,.05);
    border-radius: 9px;
}

.stat span {
    display: block;
    color: var(--muted);
    font-size: 10px;
    text-transform: uppercase;
}

.stat strong {
    display: block;
    margin-top: 4px;
    font-size: 14px;
}

.upgrade-btn {
    width: 100%;
    margin-top: 15px;
    padding: 16px;
    border: 0;
    border-radius: 11px;
    background: linear-gradient(135deg,#26e993,#0fb86e);
    color: #03130b;
    font-size: 16px;
    font-weight: 950;
    cursor: pointer;
    box-shadow: 0 8px 25px rgba(34,229,138,.18);
}

.upgrade-btn:hover {
    filter: brightness(1.08);
}

.upgrade-btn:disabled {
    cursor: not-allowed;
    opacity: .35;
    filter: grayscale(1);
}

.target-list {
    padding: 12px;
    max-height: 690px;
    overflow-y: auto;
}

.target {
    position: relative;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px;
    margin-bottom: 8px;
    border: 1px solid rgba(255,255,255,.06);
    background: rgba(255,255,255,.025);
    border-radius: 11px;
    cursor: pointer;
    transition: .18s;
}

.target:hover:not(.locked) {
    border-color: rgba(34,229,138,.4);
}

.target.active {
    border-color: var(--green);
    background: rgba(34,229,138,.1);
    box-shadow: 0 0 18px rgba(34,229,138,.08);
}

.target.locked {
    cursor: not-allowed;
    opacity: .38;
}

.target-img {
    width: 57px;
    height: 57px;
    object-fit: contain;
    border-radius: 8px;
    background: rgba(0,0,0,.2);
}

.target-info {
    min-width: 0;
    flex: 1;
}

.target-name {
    font-size: 12px;
    font-weight: 800;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.target-price {
    color: var(--yellow);
    font-size: 13px;
    font-weight: 900;
    margin-top: 4px;
}

.target-status {
    margin-top: 3px;
    font-size: 10px;
    font-weight: 800;
}

.available {
    color: var(--green);
}

.unavailable {
    color: var(--red);
}

.empty {
    text-align: center;
    color: var(--muted);
    padding: 40px 15px;
    font-size: 13px;
}

.multiplier {
    display: inline-block;
    margin-top: 3px;
    color: #8290a2;
    font-size: 11px;
}

.spin .wheel {
    animation: wheelPulse .35s infinite alternate;
}

@keyframes wheelPulse {
    from { box-shadow: 0 0 0 9px #0b0f15,0 0 0 10px rgba(255,255,255,.07),0 0 25px rgba(34,229,138,.12); }
    to { box-shadow: 0 0 0 9px #0b0f15,0 0 0 10px rgba(255,255,255,.07),0 0 55px rgba(34,229,138,.35); }
}

.overlay {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: none;
    place-items: center;
    background: rgba(0,0,0,.72);
    backdrop-filter: blur(7px);
}

.overlay.show {
    display: grid;
}

.modal {
    width: min(460px, calc(100vw - 30px));
    background: #0e141d;
    border: 1px solid rgba(255,255,255,.1);
    border-radius: 18px;
    padding: 30px;
    text-align: center;
    box-shadow: 0 25px 100px rgba(0,0,0,.65);
    animation: modalIn .25s ease;
}

@keyframes modalIn {
    from { opacity:0; transform:scale(.92); }
    to { opacity:1; transform:scale(1); }
}

.modal-icon {
    font-size: 48px;
}

.modal h2 {
    margin: 12px 0 6px;
    font-size: 27px;
}

.modal p {
    margin: 0;
    color: var(--muted);
}

.modal-item {
    margin: 20px auto;
    width: 150px;
    height: 150px;
    object-fit: contain;
}

.close-btn {
    width: 100%;
    padding: 13px;
    border: 0;
    border-radius: 10px;
    cursor: pointer;
    background: rgba(255,255,255,.07);
    color: white;
    font-weight: 800;
    margin-top: 20px;
}

@media(max-width:1100px) {
    .layout {
        grid-template-columns: 280px minmax(400px,1fr);
    }

    .targets-panel {
        grid-column: 1 / -1;
    }

    .target-list {
        display: grid;
        grid-template-columns: repeat(2,1fr);
        gap: 8px;
    }
}

@media(max-width:750px) {
    .header {
        padding: 0 12px;
    }

    .nav a {
        display: none;
    }

    .page {
        padding: 20px 10px 50px;
    }

    .layout {
        display: flex;
        flex-direction: column;
    }

    .panel,
    .center {
        width: 100%;
    }

    .target-list {
        grid-template-columns: 1fr;
    }

    .wheel-wrap {
        width: 310px;
    }
}
</style>
</head>

<body>

<header class="header">
    <div class="logo">CHAK338 <span>GAMING</span></div>

    <nav class="nav">
        <a href="index.html">Главная</a>
        <a href="index.html#cases">Кейсы</a>
        <a href="upgrade.html" class="active">Апгрейд</a>
        <a href="inventory.html">Инвентарь</a>
    </nav>

    <div class="xp">
        EXP: <span id="xpValue">0</span>
    </div>
</header>

<main class="page">

    <div class="title">
        <h1>UPGRADER</h1>
        <p>Выбери предметы, выбери цель и попробуй поднять стоимость</p>
    </div>

    <div class="layout">

        <!-- INVENTORY -->
        <section class="panel">
            <div class="panel-head">
                <h2>ТВОЙ ИНВЕНТАРЬ</h2>
                <span id="inventoryCount">0 предметов</span>
            </div>

            <div class="inventory" id="inventory"></div>
        </section>


        <!-- CENTER -->
        <section class="center">

            <div class="panel upgrade-card">

                <div class="selected-value">
                    Ставка:
                    <strong id="stakeValue">0</strong>
                </div>

                <div class="wheel-wrap" id="wheelWrap">

                    <div class="pointer"></div>

                    <div class="wheel" id="wheel">

                        <div class="needle" id="needle">
                            <div class="needle-dot"></div>
                        </div>

                        <div class="wheel-center">
                            <div class="chance-big" id="chanceBig">50%</div>
                            <div class="chance-label">шанс победы</div>
                        </div>

                    </div>
                </div>

                <div class="result">
                    <div id="successMessage" class="result-message success">
                        ✓ АПГРЕЙД УСПЕШЕН
                    </div>

                    <div id="failMessage" class="result-message fail">
                        ✕ АПГРЕЙД НЕ УДАЛСЯ
                    </div>
                </div>

                <div class="chances">
                    <button class="chance-btn" data-chance="10">10%</button>
                    <button class="chance-btn" data-chance="25">25%</button>
                    <button class="chance-btn active" data-chance="50">50%</button>
                    <button class="chance-btn" data-chance="75">75%</button>
                </div>

                <div class="stats">

                    <div class="stat">
                        <span>Ставка</span>
                        <strong id="stakeStat">0</strong>
                    </div>

                    <div class="stat">
                        <span>Макс. цель</span>
                        <strong id="maxStat">0</strong>
                    </div>

                    <div class="stat">
                        <span>Множитель</span>
                        <strong id="multiplierStat">x0</strong>
                    </div>

                </div>

                <button class="upgrade-btn" id="upgradeBtn" disabled>
                    ВЫБЕРИ ЦЕЛЬ
                </button>

            </div>

        </section>


        <!-- TARGETS -->
        <section class="panel targets-panel">

            <div class="panel-head">
                <h2>ВЫБЕРИ ЦЕЛЬ</h2>
                <span id="targetInfo">0 доступно</span>
            </div>

            <div class="target-list" id="targets"></div>

        </section>

    </div>
</main>


<!-- RESULT MODAL -->
<div class="overlay" id="resultOverlay">

    <div class="modal">

        <div class="modal-icon" id="modalIcon">🎯</div>

        <h2 id="modalTitle">АПГРЕЙД</h2>

        <p id="modalText"></p>

        <img id="modalImage" class="modal-item" src="" alt="">

        <button class="close-btn" onclick="closeResult()">
            ПРОДОЛЖИТЬ
        </button>

    </div>

</div>


<script>
/* =========================================================
   CHAK338 UPGRADER
========================================================= */

let inventory = [];
let selected = new Set();
let target = null;

let chance = 50;
let spinning = false;


/* ---------------------------------------------------------
   HELPERS
--------------------------------------------------------- */

function getItems() {
    if (typeof ITEMS !== "undefined" && Array.isArray(ITEMS)) {
        return ITEMS;
    }

    return [];
}

function priceOf(item) {
    return Number(item?.price || 0);
}

function itemName(item) {
    return item?.name || item?.title || "Предмет";
}

function itemImage(item) {
    return item?.image || "";
}

function money(value) {
    if (typeof formatPrice === "function") {
        try {
            return formatPrice(value);
        } catch(e) {}
    }

    return Number(value || 0).toLocaleString("ru-RU");
}

function getLocalInventory() {
    if (typeof getInventory === "function") {
        try {
            return getInventory() || [];
        } catch(e) {}
    }

    try {
        return JSON.parse(localStorage.getItem("chak338_inventory") || "[]");
    } catch(e) {
        return [];
    }
}

function saveLocalInventory(list) {
    localStorage.setItem(
        "chak338_inventory",
        JSON.stringify(list)
    );
}

function getXP() {
    return Number(localStorage.getItem("chak338_xp") || 0);
}

function setXP(value) {
    localStorage.setItem(
        "chak338_xp",
        String(Math.max(0, Math.floor(value)))
    );
}

function uniqueId(item, index) {
    return String(
        item?.uid ??
        item?.instanceId ??
        item?.inventoryId ??
        item?.id ??
        `${itemName(item)}_${priceOf(item)}_${index}`
    );
}


/* ---------------------------------------------------------
   INVENTORY
--------------------------------------------------------- */

function loadInventory() {
    inventory = getLocalInventory();

    inventory = inventory.map((item, index) => ({
        ...item,
        __uid: uniqueId(item, index)
    }));

    renderInventory();
    updateXP();
    updateAll();
}

function renderInventory() {

    const box = document.getElementById("inventory");

    document.getElementById("inventoryCount").textContent =
        `${inventory.length} предметов`;

    if (!inventory.length) {

        box.innerHTML = `
            <div class="empty">
                Инвентарь пуст.<br><br>
                Открой кейс, чтобы получить предмет.
            </div>
        `;

        return;
    }

    box.innerHTML = inventory.map(item => {

        const id = item.__uid;
        const isSelected = selected.has(id);

        return `
            <div
                class="item ${isSelected ? "selected" : ""}"
                onclick="toggleItem('${escapeAttr(id)}')"
            >

                <img
                    class="item-img"
                    src="${escapeAttr(itemImage(item))}"
                    alt=""
                >

                <div class="item-info">

                    <div class="item-name">
                        ${escapeHtml(itemName(item))}
                    </div>

                    <div class="item-price">
                        ${money(priceOf(item))}
                    </div>

                </div>

                <div class="check">
                    ${isSelected ? "✓" : ""}
                </div>

            </div>
        `;

    }).join("");
}

function toggleItem(id) {

    if (spinning) return;

    if (selected.has(id)) {
        selected.delete(id);
    } else {
        selected.add(id);
    }

    renderInventory();
    updateAll();
}


/* ---------------------------------------------------------
   TARGETS
--------------------------------------------------------- */

function renderTargets() {

    const box = document.getElementById("targets");

    const stake = getStake();

    if (!stake) {

        box.innerHTML = `
            <div class="empty">
                Сначала выбери предметы<br>
                из инвентаря слева.
            </div>
        `;

        document.getElementById("targetInfo").textContent =
            "ожидание ставки";

        target = null;

        return;
    }

    const maxTarget = stake / (chance / 100);

    const items = getItems()
        .filter(item => priceOf(item) > stake)
        .sort((a,b) => priceOf(a) - priceOf(b));

    if (!items.length) {

        box.innerHTML = `
            <div class="empty">
                Нет предметов дороже ставки.
            </div>
        `;

        return;
    }

    let availableCount = 0;

    box.innerHTML = items.map((item, index) => {

        const price = priceOf(item);
        const possible = price <= maxTarget;

        if (possible) availableCount++;

        const isTarget =
            target &&
            target.__targetKey === `${itemName(item)}_${price}_${index}`;

        const requiredChance =
            Math.min(100, (stake / price) * 100);

        return `
            <div
                class="target
                ${isTarget ? "active" : ""}
                ${possible ? "" : "locked"}"
                onclick="${possible ? `selectTarget(${index})` : ""}"
                data-target-index="${index}"
            >

                <img
                    class="target-img"
                    src="${escapeAttr(itemImage(item))}"
                    alt=""
                >

                <div class="target-info">

                    <div class="target-name">
                        ${escapeHtml(itemName(item))}
                    </div>

                    <div class="target-price">
                        ${money(price)}
                    </div>

                    ${
                        possible
                        ? `
                            <div class="target-status available">
                                ДОСТУПНО · ${requiredChance.toFixed(1)}% минимум
                            </div>
                        `
                        : `
                            <div class="target-status unavailable">
                                НЕДОСТУПНО · нужно ${requiredChance.toFixed(1)}%
                            </div>
                        `
                    }

                    <div class="multiplier">
                        x${(price / stake).toFixed(2)}
                    </div>

                </div>

            </div>
        `;

    }).join("");

    document.getElementById("targetInfo").textContent =
        `${availableCount} доступно`;
}

function selectTarget(index) {

    if (spinning) return;

    const stake = getStake();

    if (!stake) return;

    const maxTarget = stake / (chance / 100);

    const items = getItems()
        .filter(item => priceOf(item) > stake)
        .sort((a,b) => priceOf(a) - priceOf(b));

    const item = items[index];

    if (!item) return;

    if (priceOf(item) > maxTarget) {
        return;
    }

    target = {
        ...item,
        __targetKey: `${itemName(item)}_${priceOf(item)}_${index}`
    };

    renderTargets();
    updateButton();
}


/* ---------------------------------------------------------
   CALCULATIONS
--------------------------------------------------------- */

function getSelectedItems() {
    return inventory.filter(item => selected.has(item.__uid));
}

function getStake() {
    return getSelectedItems()
        .reduce((sum,item) => sum + priceOf(item), 0);
}

function getMaxTarget() {

    const stake = getStake();

    if (!stake) return 0;

    return stake / (chance / 100);
}

function updateAll() {

    const stake = getStake();
    const max = getMaxTarget();

    document.getElementById("stakeValue").textContent =
        money(stake);

    document.getElementById("stakeStat").textContent =
        money(stake);

    document.getElementById("maxStat").textContent =
        money(max);

    document.getElementById("multiplierStat").textContent =
        stake && target
            ? "x" + (priceOf(target) / stake).toFixed(2)
            : "x0";

    document.getElementById("chanceBig").textContent =
        chance + "%";

    /*
       ГЛАВНОЕ:
       меняем реальный зелёный сектор колеса.
       10% = 36 градусов
       25% = 90 градусов
       50% = 180 градусов
       75% = 270 градусов
    */

    document
        .getElementById("wheel")
        .style.setProperty("--chance", chance);

    document.querySelectorAll(".chance-btn")
        .forEach(btn => {

            btn.classList.toggle(
                "active",
                Number(btn.dataset.chance) === chance
            );

        });

    renderTargets();
    updateButton();
}

function updateButton() {

    const button = document.getElementById("upgradeBtn");

    const stake = getStake();

    if (spinning) {

        button.disabled = true;
        button.textContent = "КОЛЕСО КРУТИТСЯ...";

        return;
    }

    if (!stake) {

        button.disabled = true;
        button.textContent = "ВЫБЕРИ ПРЕДМЕТЫ";

        return;
    }

    if (!target) {

        button.disabled = true;
        button.textContent = "ВЫБЕРИ ЦЕЛЬ";

        return;
    }

    button.disabled = false;
    button.textContent =
        `АПГРЕЙД → ${itemName(target)}`;
}


/* ---------------------------------------------------------
   CHANCE BUTTONS
--------------------------------------------------------- */

document.querySelectorAll(".chance-btn")
    .forEach(button => {

        button.addEventListener("click", () => {

            if (spinning) return;

            chance = Number(button.dataset.chance);

            /*
              При изменении процентов:
              - меняется зелёная зона;
              - пересчитывается максимум цели;
              - недоступные цели блокируются.
            */

            const max = getMaxTarget();

            if (target && priceOf(target) > max) {
                target = null;
            }

            updateAll();
        });

    });


/* ---------------------------------------------------------
   UPGRADE
--------------------------------------------------------- */

document.getElementById("upgradeBtn")
    .addEventListener("click", startUpgrade);

function startUpgrade() {

    if (spinning) return;

    const stake = getStake();

    if (!stake || !target) return;

    const max = getMaxTarget();

    if (priceOf(target) > max) {

        alert("Эта цель недоступна при выбранном проценте.");

        return;
    }

    spinning = true;

    hideResult();

    updateButton();

    /*
       Результат определяется ДО анимации,
       но пользователь увидит его только после остановки.
    */

    const won = Math.random() * 100 < chance;

    const totalDegrees = 360 * 7;

    /*
       ВАЖНО:
       зелёная зона начинается с верхней точки.
       Для победы стрелка должна остановиться
       внутри зелёного сектора.
    */

    let finalAngle;

    if (won) {

        const sector = chance * 3.6;

        finalAngle =
            sector * (0.15 + Math.random() * 0.7);

    } else {

        const sector = chance * 3.6;

        finalAngle =
            sector +
            (360 - sector) * (0.1 + Math.random() * 0.8);

    }

    const rotation =
        totalDegrees + finalAngle;

    const needle =
        document.getElementById("needle");

    /*
       Каждый новый запуск начинается
       с текущего положения + новая полная серия вращений.
    */

    needle.style.transition = "none";
    needle.style.transform =
        "translate(-50%,-100%) rotate(0deg)";

    void needle.offsetWidth;

    needle.style.transition =
        "transform 3.4s cubic-bezier(.12,.68,.12,1)";

    needle.style.transform =
        `translate(-50%,-100%) rotate(${rotation}deg)`;

    document.getElementById("wheelWrap")
        .classList.add("spin");

    playTickSound();

    setTimeout(() => {

        document.getElementById("wheelWrap")
            .classList.remove("spin");

        finishUpgrade(won);

    }, 3550);
}


/* ---------------------------------------------------------
   FINISH
--------------------------------------------------------- */

function finishUpgrade(won) {

    const stakeItems = getSelectedItems();

    /*
       Удаляем ставку.
    */

    const idsToRemove = new Set(
        stakeItems.map(item => item.__uid)
    );

    inventory = inventory.filter(
        item => !idsToRemove.has(item.__uid)
    );

    saveInventory();

    if (won) {

        /*
           Добавляем выигранный предмет.
        */

        const newItem = {
            ...target,
            uid:
                "upgrade_" +
                Date.now() +
                "_" +
                Math.random().toString(36).slice(2)
        };

        delete newItem.__targetKey;

        if (typeof addInventoryItem === "function") {

            try {
                addInventoryItem(newItem);
            } catch(e) {
                inventory.push({
                    ...newItem,
                    __uid: newItem.uid
                });

                saveInventory();
            }

        } else {

            inventory.push({
                ...newItem,
                __uid: newItem.uid
            });

            saveInventory();
        }

        playWinSound();

        showResult(
            true,
            target
        );

    } else {

        playFailSound();

        showResult(
            false,
            target
        );
    }

    selected.clear();
    target = null;

    inventory = getLocalInventory()
        .map((item,index) => ({
            ...item,
            __uid: uniqueId(item,index)
        }));

    spinning = false;

    renderInventory();
    updateAll();
    updateXP();
}

function saveInventory() {

    const clean = inventory.map(item => {

        const copy = {...item};

        delete copy.__uid;
        delete copy.__targetKey;

        return copy;

    });

    saveLocalInventory(clean);
}


/* ---------------------------------------------------------
   RESULT
--------------------------------------------------------- */

function showResult(won, item) {

    const overlay =
        document.getElementById("resultOverlay");

    const icon =
        document.getElementById("modalIcon");

    const title =
        document.getElementById("modalTitle");

    const text =
        document.getElementById("modalText");

    const image =
        document.getElementById("modalImage");

    if (won) {

        icon.textContent = "🏆";
        title.textContent = "АПГРЕЙД УСПЕШЕН!";
        title.style.color = "var(--green)";

        text.textContent =
            `Ты получил ${itemName(item)} за ${money(priceOf(item))}`;

    } else {

        icon.textContent = "💥";
        title.textContent = "НЕУДАЧА";
        title.style.color = "var(--red)";

        text.textContent =
            `Ставка ${money(getStake())} сгорела. Попробуй ещё раз.`;
    }

    image.src = itemImage(item) || "";

    overlay.classList.add("show");
}

function hideResult() {

    document.getElementById("successMessage")
        .classList.remove("success");

    document.getElementById("failMessage")
        .classList.remove("fail");
}

function closeResult() {

    document.getElementById("resultOverlay")
        .classList.remove("show");
}


/* ---------------------------------------------------------
   XP
--------------------------------------------------------- */

function updateXP() {

    document.getElementById("xpValue").textContent =
        getXP().toLocaleString("ru-RU");
}


/* ---------------------------------------------------------
   SOUNDS
--------------------------------------------------------- */

let audioContext = null;

function audio() {

    if (!audioContext) {
        audioContext =
            new (window.AudioContext ||
                 window.webkitAudioContext)();
    }

    return audioContext;
}

function beep(freq, duration, volume = .03) {

    try {

        const ctx = audio();

        const osc =
            ctx.createOscillator();

        const gain =
            ctx.createGain();

        osc.frequency.value = freq;
        osc.type = "sine";

        gain.gain.value = volume;

        osc.connect(gain);
        gain.connect(ctx.destination);

        osc.start();

        gain.gain.exponentialRampToValueAtTime(
            0.001,
            ctx.currentTime + duration
        );

        osc.stop(
            ctx.currentTime + duration
        );

    } catch(e) {}
}

function playTickSound() {

    let ticks = 0;

    const interval =
        setInterval(() => {

            beep(
                700 + ticks * 10,
                .035,
                .018
            );

            ticks++;

            if (ticks > 25) {
                clearInterval(interval);
            }

        }, 125);
}

function playWinSound() {

    beep(600,.12,.04);

    setTimeout(() => beep(850,.15,.04),100);
    setTimeout(() => beep(1100,.25,.05),220);
}

function playFailSound() {

    beep(220,.22,.04);

    setTimeout(
        () => beep(150,.3,.04),
        160
    );
}


/* ---------------------------------------------------------
   ESCAPE
--------------------------------------------------------- */

function escapeHtml(value) {

    return String(value ?? "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
}

function escapeAttr(value) {
    return escapeHtml(value);
}


/* ---------------------------------------------------------
   INIT
--------------------------------------------------------- */

loadInventory();

</script>
