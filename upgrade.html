<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CHAK338 — Upgrade</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    min-height: 100%;
    background:
        radial-gradient(
            circle at 50% 35%,
            rgba(20, 70, 40, .12),
            transparent 35%
        ),
        #06080b;
    color: white;
    font-family:
        Arial,
        Helvetica,
        sans-serif;
}

body {
    overflow-x: hidden;
}

button {
    font-family: inherit;
}

.header {
    height: 70px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 28px;

    background: rgba(5, 7, 10, .94);

    border-bottom:
        1px solid rgba(255,255,255,.07);

    position: sticky;
    top: 0;
    z-index: 100;
}

.logo {
    display: flex;
    align-items: center;

    gap: 10px;

    font-size: 21px;
    font-weight: 1000;
    letter-spacing: 1px;
}

.logoIcon {
    width: 38px;
    height: 38px;

    border-radius: 11px;

    display: grid;
    place-items: center;

    background:
        linear-gradient(
            135deg,
            #22c55e,
            #15803d
        );

    box-shadow:
        0 0 25px
        rgba(34,197,94,.25);
}

.nav {
    display: flex;
    gap: 7px;
}

.nav a {
    text-decoration: none;

    color: #8b929d;

    font-size: 13px;
    font-weight: 800;

    padding: 10px 14px;

    border-radius: 9px;

    transition: .2s;
}

.nav a:hover,
.nav a.active {
    color: white;
    background: rgba(255,255,255,.07);
}

.main {
    width: min(1500px, 100%);

    margin: 0 auto;

    padding:
        35px 22px
        70px;
}

.pageTitle {
    text-align: center;

    margin-bottom: 30px;
}

.pageTitle h1 {
    margin: 0;

    font-size:
        clamp(34px, 5vw, 56px);

    font-weight: 1000;

    letter-spacing: -2px;
}

.pageTitle h1 span {
    color: #22c55e;

    text-shadow:
        0 0 30px
        rgba(34,197,94,.4);
}

.pageTitle p {
    color: #69717d;

    margin:
        10px 0 0;

    font-size: 14px;
}

.layout {
    display: grid;

    grid-template-columns:
        minmax(280px, 1fr)
        540px
        minmax(280px, 1fr);

    gap: 22px;

    align-items: start;
}

.panel {
    border-radius: 20px;

    background:
        linear-gradient(
            180deg,
            rgba(255,255,255,.045),
            rgba(255,255,255,.012)
        );

    border:
        1px solid
        rgba(255,255,255,.075);

    box-shadow:
        0 30px 80px
        rgba(0,0,0,.35);

    overflow: hidden;
}

.panelHeader {
    height: 58px;

    padding: 0 18px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    border-bottom:
        1px solid
        rgba(255,255,255,.06);
}

.panelHeader strong {
    font-size: 14px;
    font-weight: 1000;
}

.panelHeader span {
    color: #626a75;
    font-size: 11px;
    font-weight: 700;
}

.inventoryGrid,
.targetGrid {
    padding: 14px;

    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap: 10px;

    max-height: 590px;

    overflow-y: auto;
}

.inventoryGrid::-webkit-scrollbar,
.targetGrid::-webkit-scrollbar {
    width: 5px;
}

.inventoryGrid::-webkit-scrollbar-thumb,
.targetGrid::-webkit-scrollbar-thumb {
    background: #252b33;
    border-radius: 99px;
}

.inventoryItem,
.targetItem {
    position: relative;

    min-width: 0;

    padding: 8px;

    border-radius: 13px;

    background:
        linear-gradient(
            180deg,
            rgba(255,255,255,.045),
            rgba(0,0,0,.18)
        );

    border:
        1px solid
        rgba(255,255,255,.07);

    cursor: pointer;

    transition:
        .18s;
}

.inventoryItem:hover,
.targetItem:hover {
    transform:
        translateY(-2px);

    border-color:
        rgba(255,255,255,.18);
}

.inventoryItem.selected,
.targetItem.selected {
    border-color: #22c55e;

    background:
        rgba(34,197,94,.09);

    box-shadow:
        0 0 0 1px
        rgba(34,197,94,.15),

        0 0 25px
        rgba(34,197,94,.12);
}

.itemImage {
    height: 100px;

    display: grid;
    place-items: center;

    border-radius: 9px;

    background:
        radial-gradient(
            circle,
            rgba(255,255,255,.07),
            transparent 65%
        ),
        #090c10;

    overflow: hidden;
}

.itemImage img {
    width: 88%;
    height: 88%;

    object-fit: contain;
}

.itemName {
    margin-top: 8px;

    color: #d2d7dd;

    font-size: 11px;
    font-weight: 900;

    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.itemPrice {
    margin-top: 3px;

    color: #22c55e;

    font-size: 13px;
    font-weight: 1000;
}

.selectedMark {
    position: absolute;

    top: 6px;
    right: 6px;

    width: 20px;
    height: 20px;

    display: none;
    place-items: center;

    border-radius: 50%;

    background: #22c55e;

    color: #031007;

    font-size: 11px;
    font-weight: 1000;

    box-shadow:
        0 0 15px
        rgba(34,197,94,.6);
}

.inventoryItem.selected .selectedMark,
.targetItem.selected .selectedMark {
    display: grid;
}

.locked {
    opacity: .35;
    cursor: not-allowed;
}

.targetChance {
    position: absolute;

    left: 6px;
    top: 6px;

    padding:
        4px 6px;

    border-radius: 6px;

    background:
        rgba(0,0,0,.75);

    color: #22c55e;

    font-size: 9px;
    font-weight: 1000;

    z-index: 2;
}

.locked .targetChance {
    color: #777;
}

.empty {
    grid-column: 1 / -1;

    padding: 65px 20px;

    text-align: center;

    color: #5f6670;

    font-size: 13px;
}


/* =========================================================
   CENTER
========================================================= */

.center {
    display: flex;
    flex-direction: column;
    gap: 18px;
}

.upgradeCard {
    padding: 23px;

    border-radius: 22px;

    background:
        radial-gradient(
            circle at 50% 40%,
            rgba(34,197,94,.045),
            transparent 45%
        ),
        linear-gradient(
            180deg,
            rgba(255,255,255,.045),
            rgba(255,255,255,.012)
        );

    border:
        1px solid
        rgba(255,255,255,.075);

    box-shadow:
        0 30px 90px
        rgba(0,0,0,.45);
}

.values {
    display: grid;

    grid-template-columns:
        1fr
        45px
        1fr;

    gap: 8px;

    align-items: center;

    margin-bottom: 20px;
}

.valueBox {
    padding: 12px;

    text-align: center;

    border-radius: 12px;

    background:
        rgba(0,0,0,.23);

    border:
        1px solid
        rgba(255,255,255,.055);
}

.valueLabel {
    color: #656d77;

    font-size: 9px;
    font-weight: 900;

    letter-spacing: 1px;
}

.valueNumber {
    margin-top: 4px;

    font-size: 23px;
    font-weight: 1000;
}

.green {
    color: #22c55e;
}

.arrowBetween {
    text-align: center;

    color: #59616c;

    font-size: 23px;
}

.chanceHeader {
    display: flex;

    align-items: center;
    justify-content: space-between;

    margin-bottom: 9px;
}

.chanceHeader span:first-child {
    color: #8b939e;

    font-size: 12px;
    font-weight: 900;
}

.chanceNumber {
    color: #22c55e;

    font-size: 20px;
    font-weight: 1000;
}

.chanceButtons {
    display: grid;

    grid-template-columns:
        repeat(4, 1fr);

    gap: 7px;

    margin-bottom: 15px;
}

.chanceButton {
    height: 40px;

    border-radius: 10px;

    border:
        1px solid
        rgba(255,255,255,.08);

    background:
        rgba(255,255,255,.035);

    color: #8d95a0;

    font-weight: 1000;

    cursor: pointer;

    transition: .2s;
}

.chanceButton:hover {
    color: white;

    background:
        rgba(255,255,255,.07);
}

.chanceButton.active {
    color: #031007;

    background: #22c55e;

    border-color: #22c55e;

    box-shadow:
        0 0 25px
        rgba(34,197,94,.2);
}


/* =========================================================
   WHEEL
========================================================= */

.wheelArea {
    width: 430px;
    height: 430px;

    margin:
        0 auto
        15px;

    position: relative;

    display: grid;
    place-items: center;
}

.wheelGlow {
    position: absolute;

    width: 360px;
    height: 360px;

    border-radius: 50%;

    background:
        rgba(34,197,94,.08);

    filter: blur(40px);
}

.wheel {
    width: 350px;
    height: 350px;

    position: relative;

    border-radius: 50%;

    background:
        conic-gradient(
            from -90deg,

            #20d94e 0deg,

            #20d94e
            calc(var(--chance) * 3.6deg),

            #11151b
            calc(var(--chance) * 3.6deg),

            #080a0d 360deg
        );

    box-shadow:
        0 0 0 9px #090c10,

        0 0 0 11px
        rgba(255,255,255,.06),

        0 0 70px
        rgba(0,0,0,.85),

        0 0 50px
        rgba(34,197,94,.09);
}

.wheel::before {
    content: "";

    position: absolute;

    inset: 18px;

    border-radius: 50%;

    border:
        1px solid
        rgba(255,255,255,.12);

    box-shadow:
        inset
        0 0 50px
        rgba(0,0,0,.65);
}

.wheel::after {
    content: "";

    position: absolute;

    inset: 0;

    border-radius: 50%;

    background:
        repeating-conic-gradient(
            from -90deg,

            rgba(255,255,255,.12)
            0deg,

            rgba(255,255,255,.12)
            .6deg,

            transparent
            .6deg,

            transparent
            30deg
        );

    opacity: .12;
}


/* =========================================================
   ЦЕНТР КОЛЕСА
========================================================= */

.wheelCenter {
    position: absolute;

    left: 50%;
    top: 50%;

    transform:
        translate(-50%, -50%);

    width: 126px;
    height: 126px;

    border-radius: 50%;

    background:
        radial-gradient(
            circle at 35% 25%,
            #343b44,
            #101419 65%
        );

    border:
        5px solid
        #080b0e;

    box-shadow:
        0 0 0 2px
        rgba(255,255,255,.08),

        0 15px 40px
        rgba(0,0,0,.75);

    z-index: 10;

    display: flex;
    flex-direction: column;

    align-items: center;
    justify-content: center;
}

.wheelPercent {
    font-size: 28px;
    font-weight: 1000;
}

.wheelSmall {
    color: #656d77;

    margin-top: 4px;

    font-size: 8px;
    font-weight: 1000;

    letter-spacing: 1px;
}


/* =========================================================
   НОВАЯ СТРЕЛКА
   ПОВТОРЯЕТ ФОРМУ С КАРТИНКИ
========================================================= */

.rotatingArrow {
    position: absolute;

    left: 50%;
    top: 50%;

    width: 230px;
    height: 160px;

    transform:
        translate(-50%, -50%)
        rotate(0deg);

    transform-origin:
        50% 50%;

    z-index: 25;

    pointer-events: none;

    will-change: transform;
}


/*
    Внешняя синяя часть
*/

.arrowOuter {
    position: absolute;

    left: 50%;
    top: 50%;

    width: 180px;
    height: 125px;

    transform:
        translate(-50%, -50%);

    clip-path:
        polygon(
            0 0,
            54% 50%,
            0 100%,
            45% 100%,
            100% 50%,
            45% 0
        );

    background:
        linear-gradient(
            135deg,
            #04111f 0%,
            #075291 35%,
            #1398ef 70%,
            #063865 100%
        );

    filter:
        drop-shadow(
            0 0 4px
            rgba(0,150,255,.95)
        )
        drop-shadow(
            0 0 17px
            rgba(0,130,255,.55)
        );
}


/*
    Внутренняя зелёная часть
*/

.arrowInner {
    position: absolute;

    left: 50%;
    top: 50%;

    width: 162px;
    height: 107px;

    transform:
        translate(-50%, -50%);

    clip-path:
        polygon(
            0 0,
            54% 50%,
            0 100%,
            45% 100%,
            100% 50%,
            45% 0
        );

    background:
        linear-gradient(
            135deg,
            #031b0d 0%,
            #08752c 35%,
            #21ed57 70%,
            #075b22 100%
        );

    filter:
        drop-shadow(
            0 0 4px
            rgba(35,255,90,.95)
        )
        drop-shadow(
            0 0 13px
            rgba(35,255,90,.55)
        );
}


/*
    Блик
*/

.arrowInner::after {
    content: "";

    position: absolute;

    left: 10%;
    top: 10%;

    width: 55%;
    height: 18%;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,.6),
            transparent
        );

    transform:
        rotate(22deg);

    filter:
        blur(4px);

    opacity: .4;
}


/*
    Анимация стрелки

    ВАЖНО:

    JS передаёт сюда конкретный угол.

    Поэтому стрелка не выбирает результат
    после остановки.
*/

.rotatingArrow.spinning {
    animation:
        upgraderArrowSpin
        4.5s
        cubic-bezier(.10,.74,.10,1)
        forwards;
}

@keyframes upgraderArrowSpin {

    0% {
        transform:
            translate(-50%, -50%)
            rotate(0deg);
    }

    100% {
        transform:
            translate(-50%, -50%)
            rotate(var(--final-angle));
    }
}


/*
    Победа
*/

.rotatingArrow.win {
    animation:
        winGlow
        .7s
        ease-in-out
        2;
}

@keyframes winGlow {

    0% {
        filter:
            brightness(1)
            drop-shadow(
                0 0 5px
                rgba(34,197,94,.4)
            );
    }

    50% {
        filter:
            brightness(1.5)
            drop-shadow(
                0 0 25px
                rgba(34,197,94,1)
            );
    }

    100% {
        filter:
            brightness(1)
            drop-shadow(
                0 0 5px
                rgba(34,197,94,.4)
            );
    }
}


/* =========================================================
   КНОПКА
========================================================= */

.upgradeButton {
    width: 100%;
    height: 59px;

    border: 0;

    border-radius: 14px;

    background:
        linear-gradient(
            135deg,
            #22c55e,
            #15803d
        );

    color: #031007;

    font-size: 16px;
    font-weight: 1000;

    cursor: pointer;

    box-shadow:
        0 12px 35px
        rgba(34,197,94,.17);

    transition: .2s;
}

.upgradeButton:hover:not(:disabled) {
    transform:
        translateY(-2px);

    box-shadow:
        0 15px 45px
        rgba(34,197,94,.3);
}

.upgradeButton:disabled {
    opacity: .35;

    cursor: not-allowed;

    box-shadow: none;
}

.hint {
    margin-top: 9px;

    text-align: center;

    color: #4d555f;

    font-size: 10px;
}


/* =========================================================
   TARGET INFO
========================================================= */

.targetInfo {
    padding:
        12px 17px;

    background:
        rgba(34,197,94,.035);

    border-bottom:
        1px solid
        rgba(255,255,255,.055);
}

.targetInfoRow {
    display: flex;

    align-items: center;
    justify-content: space-between;

    margin-bottom: 6px;

    font-size: 11px;
}

.targetInfoRow:last-child {
    margin-bottom: 0;
}

.muted {
    color: #646c76;
}

.targetMax {
    color: #22c55e;

    font-weight: 1000;
}


/* =========================================================
   RESULT
========================================================= */

.modal {
    position: fixed;

    inset: 0;

    z-index: 1000;

    display: none;

    align-items: center;
    justify-content: center;

    padding: 20px;

    background:
        rgba(0,0,0,.78);

    backdrop-filter:
        blur(15px);
}

.modal.show {
    display: flex;
}

.resultBox {
    width:
        min(450px, 100%);

    padding: 30px;

    text-align: center;

    border-radius: 24px;

    background:
        radial-gradient(
            circle at 50% 0%,
            rgba(34,197,94,.12),
            transparent 40%
        ),
        #0d1117;

    border:
        1px solid
        rgba(255,255,255,.1);

    box-shadow:
        0 40px 120px
        rgba(0,0,0,.7);

    animation:
        resultIn
        .3s
        ease;
}

@keyframes resultIn {

    from {
        opacity: 0;
        transform:
            scale(.9)
            translateY(20px);
    }

    to {
        opacity: 1;
        transform:
            scale(1)
            translateY(0);
    }
}

.resultStatus {
    font-size: 12px;

    font-weight: 1000;

    letter-spacing: 2px;
}

.resultStatus.win {
    color: #22c55e;
}

.resultStatus.loss {
    color: #ef4444;
}

.resultTitle {
    margin:
        7px 0 20px;

    font-size: 34px;

    font-weight: 1000;
}

.resultImage {
    width: 220px;
    height: 180px;

    margin:
        0 auto
        17px;

    display: grid;
    place-items: center;

    border-radius: 18px;

    background:
        radial-gradient(
            circle,
            rgba(34,197,94,.1),
            transparent 65%
        ),
        #090c10;

    overflow: hidden;
}

.resultImage img {
    width: 90%;
    height: 90%;

    object-fit: contain;
}

.resultName {
    font-size: 19px;

    font-weight: 1000;
}

.resultPrice {
    margin-top: 5px;

    color: #22c55e;

    font-size: 17px;
    font-weight: 1000;
}

.resultButtons {
    display: flex;

    gap: 9px;

    margin-top: 24px;
}

.resultButton {
    flex: 1;

    height: 50px;

    border: 0;

    border-radius: 12px;

    cursor: pointer;

    font-weight: 1000;

    transition: .2s;
}

.resultButton:hover {
    transform:
        translateY(-2px);
}

.resultButton.close {
    color: white;

    background:
        rgba(255,255,255,.07);
}

.resultButton.take {
    color: #031007;

    background: #22c55e;
}


/* =========================================================
   RESPONSIVE
========================================================= */

@media (max-width: 1250px) {

    .layout {
        grid-template-columns:
            1fr 1fr;
    }

    .center {
        grid-column:
            1 / -1;

        grid-row: 1;

        width: 600px;
        max-width: 100%;

        margin: 0 auto;
    }

    .inventory {
        grid-column: 1;
    }

    .targets {
        grid-column: 2;
    }
}

@media (max-width: 800px) {

    .header {
        padding:
            0 13px;
    }

    .nav a {
        padding:
            8px;

        font-size: 11px;
    }

    .logo {
        font-size: 16px;
    }

    .main {
        padding:
            25px 12px
            50px;
    }

    .layout {
        display: flex;

        flex-direction: column;
    }

    .center,
    .inventory,
    .targets {
        width: 100%;
    }

    .wheelArea {
        width: 360px;
        height: 360px;

        max-width: 100%;

        transform:
            scale(.92);
    }

    .wheel {
        width: 300px;
        height: 300px;
    }

    .inventoryGrid,
    .targetGrid {
        grid-template-columns:
            repeat(3, 1fr);
    }
}

@media (max-width: 480px) {

    .inventoryGrid,
    .targetGrid {
        grid-template-columns:
            repeat(2, 1fr);
    }

    .upgradeCard {
        padding: 15px;
    }

    .wheelArea {
        transform:
            scale(.8);

        margin:
            -30px auto
            -20px;
    }

    .values {
        grid-template-columns:
            1fr;
    }

    .arrowBetween {
        transform:
            rotate(90deg);
    }
}
</style>
</head>

<body>

<header class="header">

    <div class="logo">

        <div class="logoIcon">
            ⚡
        </div>

        CHAK338

    </div>

    <nav class="nav">

        <a href="index.html">
            Главная
        </a>

        <a href="inventory.html">
            Инвентарь
        </a>

        <a
            href="upgrade.html"
            class="active"
        >
            Апгрейдер
        </a>

    </nav>

</header>


<main class="main">

    <div class="pageTitle">

        <h1>
            UPGRADE
            <span>⚡</span>
        </h1>

        <p>
            Улучши свои предметы и попробуй выбить более дорогой
        </p>

    </div>


    <div class="layout">


        <!-- =================================================
             INVENTORY
        ================================================== -->

        <section class="panel inventory">

            <div class="panelHeader">

                <strong>
                    ТВОЙ ИНВЕНТАРЬ
                </strong>

                <span id="inventoryCount">
                    0 предметов
                </span>

            </div>

            <div
                class="inventoryGrid"
                id="inventoryGrid"
            ></div>

        </section>


        <!-- =================================================
             CENTER
        ================================================== -->

        <section class="center">

            <div class="upgradeCard">


                <div class="values">

                    <div class="valueBox">

                        <div class="valueLabel">
                            СТАВКА
                        </div>

                        <div
                            class="valueNumber green"
                            id="stakeValue"
                        >

/* =========================================================

========================================================= */

function getDatabaseItems() {

    if (
        Array.isArray(window.ITEMS)
    ) {
        return window.ITEMS;
    }

    if (
        Array.isArray(window.items)
    ) {
        return window.items;
    }

    if (
        Array.isArray(window.CASES)
    ) {

        const result = [];

        window.CASES.forEach(
            caseData => {

                if (
                    Array.isArray(
                        caseData.items
                    )
                ) {

                    result.push(
                        ...caseData.items
                    );

                }

            }
        );

        return result;
    }

    return [];
}


function getInventory() {

    try {

        const data =
            localStorage.getItem(
                "chak338_inventory"
            );

        if (!data) {
            return [];
        }

        const parsed =
            JSON.parse(data);

        return Array.isArray(parsed)
            ? parsed
            : [];

    } catch (error) {

        console.error(
            error
        );

        return [];
    }
}


function saveInventory(items) {

    inventory = items;

    localStorage.setItem(
        "chak338_inventory",
        JSON.stringify(items)
    );
}


function getItemId(
    item,
    index
) {

    return String(
        item.instanceId ??
        item.inventoryId ??
        item.uid ??
        item.id ??
        (
            item.name +
            "_" +
            item.price +
            "_" +
            index
        )
    );
}


function getName(item) {

    return (
        item.name ??
        item.title ??
        "Предмет"
    );
}


function getPrice(item) {

    return Number(
        item.price ??
        item.value ??
        0
    );
}


function getImage(item) {

    return (
        item.image ??
        item.img ??
        item.icon ??
        ""
    );
}


function escapeHtml(value) {

    return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll(
            "'",
            "&#039;"
        );
}


/* =========================================================
   IMAGE
========================================================= */

function itemImage(item) {

    const image =
        getImage(item);

    if (!image) {

        return `
            <div

                    font-size:42px;
                    opacity:.4;
                "
            >
                🎁
            </div>
        `;
    }

    return `
        <img
            src="${escapeHtml(image)}"
            alt=""
            onerror="
                this.style.display='none';
                this.nextElementSibling.style.display='block';
            "
        >

        <div
            style="
                display:none;
                font-size:42px;
                opacity:.4;
            "
        >
            🎁
        </div>
    `;
}


/* =========================================================
   INVENTORY
========================================================= */

function renderInventory() {

    inventory =
        getInventory();

    inventoryCount.textContent =
        inventory.length +
        " предметов";


    if (
        inventory.length === 0
    ) {

        inventoryGrid.innerHTML = `

            <div class="empty">

                <div
                    style="
                        font-size:50px;
                        margin-bottom:12px;
                    "
                >
                    📦
                </div>

                Инвентарь пуст

            </div>

        `;

        return;
    }


    inventoryGrid.innerHTML =
        inventory
            .map(
                (item, index) => {

                    const id =
                        getItemId(
                            item,
                            index
                        );

                    const selected =
                        selectedInventoryIds
                            .has(id);


                    return `

                        <div
                            class="
                                inventoryItem
                                ${selected
                                    ? "selected"
                                    : ""
                                }
                            "
                            data-id="${escapeHtml(id)}"
                        >

                            <div
                                class="selectedMark"
                            >
                                ✓
                            </div>

                            <div class="itemImage">
                                ${itemImage(item)}
                            </div>

                            <div class="itemName">
                                ${escapeHtml(
                                    getName(item)
                                )}
                            </div>

                            <div class="itemPrice">
                                ${getPrice(item)}
                            </div>

                        </div>

                    `;

                }
            )
            .join("");


    inventoryGrid
        .querySelectorAll(
            ".inventoryItem"
        )
        .forEach(
            element => {

                element.addEventListener(
                    "click",
                    () => {

                        toggleInventory(
                            element.dataset.id
                        );

                    }
                );

            }
        );
}


function toggleInventory(id) {

    if (spinning) {
        return;
    }


    if (
        selectedInventoryIds
            .has(id)
    ) {

        selectedInventoryIds
            .delete(id);

    } else {

        selectedInventoryIds
            .add(id);
    }


    selectedTarget =
        null;

    renderInventory();
    renderTargets();
    updateInterface();
}


/* =========================================================
   STAKE
========================================================= */

function selectedItems() {

    return inventory.filter(
        (item, index) =>

            selectedInventoryIds
                .has(
                    getItemId(
                        item,
                        index
                    )
                )
    );
}


function getStake() {

    return selectedItems()
        .reduce(
            (total, item) =>
                total +
                getPrice(item),
            0
        );
}


/* =========================================================
   TARGETS
========================================================= */

function renderTargets() {

    const stake =
        getStake();


    const maximum =
        chance > 0
            ? stake /
              (chance / 100)
            : 0;


    const targets =
        getDatabaseItems()
            .filter(
                item =>
                    getPrice(item) >
                    stake
            )
            .sort(
                (a, b) =>
                    getPrice(a) -
                    getPrice(b)
            );


    targetCount.textContent =
        targets.length;


    let reachable = 0;


    targetGrid.innerHTML =
        targets
            .map(
                (item, index) => {

                    const price =
                        getPrice(item);


                    const canUse =
                        stake > 0 &&
                        price <= maximum;


                    if (canUse) {
                        reachable++;
                    }


                    const selected =
                        selectedTarget ===
                        item;


                    const targetChance =
                        price > 0
                            ? Math.min(
                                100,
                                (
                                    stake /
                                    price
                                ) * 100
                            )
                            : 0;


                    return `

                        <div
                            class="
                                targetItem
                                ${canUse
                                    ? ""
                                    : "locked"
                                }
                                ${selected
                                    ? "selected"
                                    : ""
                                }
                            "
                            data-target-index="${index}"
                        >

                            <div
                                class="targetChance"
                            >
                                ${
                                    canUse
                                        ? targetChance
                                            .toFixed(1)
                                            + "%"
                                        : "🔒"
                                }
                            </div>

                            <div
                                class="selectedMark"
                            >
                                ✓
                            </div>

                            <div class="itemImage">
                                ${itemImage(item)}
                            </div>

                            <div class="itemName">
                                ${escapeHtml(
                                    getName(item)
                                )}
                            </div>

                            <div class="itemPrice">
                                ${price}
                            </div>

                        </div>

                    `;

                }
            )
            .join("");


    targetGrid
        .querySelectorAll(
            ".targetItem"
        )
        .forEach(
            element => {

                const index =
                    Number(
                        element.dataset
                            .targetIndex
                    );

                const item =
                    targets[index];


                const price =
                    getPrice(item);


                const canUse =
                    stake > 0 &&
                    price <= maximum;


                if (!canUse) {
                    return;
                }


                element.addEventListener(
                    "click",
                    () => {

                        if (spinning) {
                            return;
                        }

                        selectedTarget =
                            item;

                        renderTargets();
                        updateInterface();

                    }
                );

            }
        );


    reachableCount.textContent =
        reachable;


    maxTarget.textContent =
        maximum > 0
            ? Math.floor(maximum)
            : "0";
}


/* =========================================================
   UI
========================================================= */

function updateInterface() {

    const stake =
        getStake();


    stakeValue.textContent =
        stake;


    targetValue.textContent =
        selectedTarget
            ? getPrice(

            )

    chanceValue.textContent =

    wheelPercent.textContent =

    );


    if (spinning) {

        upgradeButton.disabled =

        upgradeButton.textContent =

    }


    if (!stake) {

        upgradeButton.disabled =
            true;

        upgradeButton.textContent =
            "ВЫБЕРИ ПРЕДМЕТЫ";

        return;
    }


    if (!selectedTarget) {

        upgradeButton.disabled =
            true;

        upgradeButton.textContent =
            "ВЫБЕРИ ЦЕЛЬ";

        return;
    }


    upgradeButton.disabled =
        false;

    upgradeButton.textContent =
        "АПГРЕЙД НА " +

}


/* =========================================================
   CHANCE BUTTONS
========================================================= */

document
    .querySelectorAll(
        ".chanceButton"
    )
    .forEach(
        button => {

            button.addEventListener(
                "click",

                    if (spinning) {

                        );

                                );

                        );

    );


/* =========================================================
   AUDIO
========================================================= */

let audioContext = null;

function audio() {

    if (!audioContext) {

        audioContext =
            new (
                window.AudioContext ||
                window.webkitAudioContext
            )();

    }

    return audioContext;
}


function tickSound() {

    try {

        const ctx =
            audio();

        const oscillator =
            ctx.createOscillator();

        const gain =
            ctx.createGain();


        oscillator.type =
            "square";


        oscillator.frequency.value =
            650 +
            Math.random() * 250;


        gain.gain.setValueAtTime(
            .035,
            ctx.currentTime
        );


        gain.gain.exponentialRampToValueAtTime(
            .001,
            ctx.currentTime + .035
        );


        oscillator.connect(gain);
        gain.connect(ctx.destination);


        oscillator.start();

        oscillator.stop(
            ctx.currentTime + .04
        );

    } catch (e) {}
}


function winSound() {

    try {

        const ctx =
            audio();

        const notes = [
            523,
            659,
            784,
            1047
        ];


        notes.forEach(
            (frequency, index) => {

                const oscillator =
                    ctx.createOscillator();

                const gain =
                    ctx.createGain();


                oscillator.type =
                    "sine";

                oscillator.frequency.value =
                    frequency;


                const start =
                    ctx.currentTime +
                    index * .1;


                gain.gain.setValueAtTime(
                    .001,
                    start
                );


                gain.gain.exponentialRampToValueAtTime(
                    .18,
                    start + .02
                );


                gain.gain.exponentialRampToValueAtTime(
                    .001,
                    start + .25
                );


                oscillator.connect(gain);
                gain.connect(
                    ctx.destination
                );


                oscillator.start(start);

                oscillator.stop(
                    start + .28
                );

            }
        );

    } catch (e) {}
}


function lossSound() {

    try {

        const ctx =
            audio();

        const oscillator =
            ctx.createOscillator();

        const gain =
            ctx.createGain();


        oscillator.type =
            "sawtooth";


        oscillator.frequency.setValueAtTime(
            180,
            ctx.currentTime
        );


        oscillator.frequency.exponentialRampToValueAtTime(
            65,
            ctx.currentTime + .5
        );


        gain.gain.setValueAtTime(
            .001,
            ctx.currentTime
        );


        gain.gain.exponentialRampToValueAtTime(
            .12,
            ctx.currentTime + .03
        );


        gain.gain.exponentialRampToValueAtTime(
            .001,
            ctx.currentTime + .55
        );


        oscillator.connect(gain);
        gain.connect(ctx.destination);


        oscillator.start();

        oscillator.stop(
            ctx.currentTime + .6
        );

    } catch (e) {}
}


/* =========================================================
   TICKS
========================================================= */

let tickTimeout = null;

function startTicks() {

    stopTicks();


    let delay = 80;


    function nextTick() {

        if (!spinning) {
            return;
        }


        tickSound();


        delay *= 1.08;


        if (delay > 300) {
            delay = 300;
        }


        tickTimeout =
            setTimeout(
                nextTick,
                delay
            );
    }


    nextTick();
}


function stopTicks() {

    if (tickTimeout) {

        clearTimeout(
            tickTimeout
        );

        tickTimeout = null;
    }
}


/* =========================================================
   RESULT ANGLE
========================================================= */


/*
    Зелёная зона начинается сверху.

    50%:

    0° ---------------- 180° ---------------- 360°
    |       WIN        |        LOSS         |
*/


function getResultAngle(won) {

    const greenDegrees =
        chance * 3.6;


    if (won) {

        /*
            Берём угол строго внутри зелёной зоны.

            Не используем границу.
        */

        const margin =
            Math.min(
                7,
                greenDegrees * .1
            );


        return (
            margin +
            Math.random() *
            (
                greenDegrees -
                margin * 2
            )
        );

    }


    /*
        Проигрыш.

        Берём угол строго после зелёного
        сектора.
    */

    const lossStart =
        greenDegrees;


    const lossDegrees =
        360 -
        greenDegrees;


    const margin =
        Math.min(
            7,
            lossDegrees * .1
        );


    return (
        lossStart +
        margin +
        Math.random() *
        (
            lossDegrees -
            margin * 2
        )
    );
}


function finalRotation(angle) {

    /*
        5 полных оборотов +
        конечный угол.

        Например:

        angle = 90

        стрелка:
        0 → 1800 → 1890
    */

    return (
        5 * 360 +
        angle
    );
}


/* =========================================================
   START
========================================================= */

upgradeButton.addEventListener(
    "click",
    startUpgrade
);


function startUpgrade() {

    if (spinning) {
        return;
    }


    const items =
        selectedItems();


    const stake =
        getStake();


    if (
        items.length === 0
    ) {

        return;
    }


    if (!selectedTarget) {

        return;
    }


    const targetPrice =
        getPrice(
            selectedTarget
        );


    const maximum =
        stake /
        (chance / 100);


    if (
        targetPrice <= stake ||
        targetPrice > maximum
    ) {

        selectedTarget =
            null;

        renderTargets();
        updateInterface();

        return;
    }


    /*
    =========================================================
       ГЛАВНОЕ ИСПРАВЛЕНИЕ

       RNG вызывается ОДИН РАЗ.

       Результат запоминается.

       После этого стрелка получает угол,
       который соответствует ЭТОМУ результату.
    =========================================================
    */


    const roll =
        Math.random() * 100;


    const won =
        roll < chance;


    /*
        Теперь угол строится
        именно на основании won.
    */

    const resultAngle =
        getResultAngle(
            won
        );


    const rotation =
        finalRotation(
            resultAngle
        );


    console.log(
        "UPGRADE RESULT:",
        {
            roll,
            chance,
            won,
            resultAngle,
            rotation
        }
    );


    /*
        Запоминаем всё до начала анимации.
    */

    window.currentUpgrade = {

        won: won,

        roll: roll,

        angle: resultAngle,

        target:
            selectedTarget,

        stake:
            stake,

        items:
            items

    };


    spinning = true;


    upgradeButton.disabled =
        true;


    /*
        Сбрасываем предыдущую анимацию.
    */

    rotatingArrow.classList.remove(
        "spinning",
        "win",
        "loss"
    );


    void rotatingArrow.offsetWidth;


    /*
        Передаём конечный угол
        CSS-анимации.
    */

    rotatingArrow.style.setProperty(
        "--final-angle",
        rotation + "deg"
    );


    /*
        Запускаем звук.
    */

    startTicks();


    /*
        Запускаем стрелку.
    */

    rotatingArrow.classList.add(
        "spinning"
    );


    /*
        Ждём именно animationend.
    */

    rotatingArrow.addEventListener(
        "animationend",
        finishUpgrade,
        {
            once: true
        }
    );
}


/* =========================================================
   FINISH
========================================================= */

function finishUpgrade() {

    stopTicks();


    const result =
        window.currentUpgrade;


    if (!result) {

        spinning = false;

        updateInterface();

        return;
    }


    /*
        НИКАКОГО НОВОГО RANDOM ЗДЕСЬ НЕТ.

        Берём результат,
        который был определён ДО вращения.
    */

    if (result.won) {

        rotatingArrow.classList.add(
            "win"
        );

        winSound();

    } else {

        rotatingArrow.classList.add(
            "loss"
        );

        lossSound();

    }


    /*
        Сначала сгорает ставка.
    */

    removeStake();


    if (result.won) {

        /*
            Создаём ожидаемый выигрыш.
        */

        pendingWinItem = {
            ...result.target
        };


        showWin(
            pendingWinItem
        );

    } else {

        showLoss();

    }


    selectedInventoryIds.clear();

    selectedTarget = null;

    spinning = false;


    renderInventory();
    renderTargets();
    updateInterface();
}


/* =========================================================
   REMOVE STAKE
========================================================= */

function removeStake() {

    const selected =
        new Set(
            selectedInventoryIds
        );


    inventory =
        inventory.filter(
            (item, index) =>

                !selected.has(
                    getItemId(
                        item,
                        index
                    )
                )
        );


    saveInventory(
        inventory
    );
}


/* =========================================================
   WIN
========================================================= */

function showWin(item) {

    resultStatus.textContent =
        "ПОБЕДА";


    resultStatus.className =
        "resultStatus win";


    resultTitle.textContent =
        "АПГРЕЙД УСПЕШЕН!";


    resultImage.innerHTML =
        itemImage(item);


    resultName.textContent =
        getName(item);


    resultPrice.textContent =
        getPrice(item) +
        " монет";


    takeButton.style.display =
        "block";


    resultModal.classList.add(
        "show"
    );
}


/* =========================================================
   LOSS
========================================================= */

function showLoss() {

    resultStatus.textContent =
        "ПОРАЖЕНИЕ";


    resultStatus.className =
        "resultStatus loss";


    resultTitle.textContent =
        "НЕ ПОВЕЗЛО";


    resultImage.innerHTML = `

        <div
            style="
                font-size:78px;
                opacity:.5;
            "
        >
            💀
        </div>

    `;


    resultName.textContent =
        "Ставка сгорела";


    resultPrice.textContent =
        "Попробуй ещё раз";


    takeButton.style.display =
        "none";


    resultModal.classList.add(
        "show"
    );
}


/* =========================================================
   TAKE WIN
========================================================= */

function takeWonItem() {

    if (!pendingWinItem) {
        return;
    }


    /*
        Создаём НОВЫЙ instanceId.

        Поэтому предмет не конфликтует
        с уже существующим.
    */

    const item = {

        ...pendingWinItem,

        instanceId:
            "upgrade_" +
            Date.now() +
            "_" +
            Math.random()
                .toString(36)
                .slice(2)

    };


    inventory =
        getInventory();


    inventory.push(
        item
    );


    saveInventory(
        inventory
    );


    /*
        За успешный апгрейд
        начисляем стоимость предмета.
    */

    addXP(
        getPrice(item)
    );


    pendingWinItem =
        null;


    closeResult();


    renderInventory();
    renderTargets();
    updateInterface();
}


/* =========================================================
   XP
========================================================= */

function addXP(amount) {

    const current =
        Number(
            localStorage.getItem(
                "chak338_xp"
            ) || 0
        );


    localStorage.setItem(
        "chak338_xp",
        String(
            current +
            Number(amount)
        )
    );
}


/* =========================================================
   CLOSE
========================================================= */

function closeResult() {

    resultModal.classList.remove(
        "show"
    );


    rotatingArrow.classList.remove(
        "spinning",
        "win",
        "loss"
    );


    rotatingArrow.style.transition =
        "transform .35s ease";


    rotatingArrow.style.transform =
        "translate(-50%, -50%) rotate(0deg)";


    setTimeout(
        () => {

            rotatingArrow.style.transition =
                "";

            rotatingArrow.style.transform =
                "";

        },
        400
    );


    window.currentUpgrade =
        null;
}


/* =========================================================
   MODAL OUTSIDE
========================================================= */

resultModal.addEventListener(
    "click",
    event => {

        if (
            event.target ===
            resultModal
        ) {

            closeResult();

        }

    }
);


/* =========================================================
   ESC
========================================================= */

document.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Escape" &&
            resultModal.classList.contains(
                "show"
            )
        ) {

            closeResult();

        }

    }
);


/* =========================================================
   INIT
========================================================= */

function init() {

    inventory =
        getInventory();

    selectedInventoryIds =
        new Set();

    selectedTarget =
        null;

    chance =
        50;


    renderInventory();
    renderTargets();
    updateInterface();
}


init();

</script>

</body>
</html>
