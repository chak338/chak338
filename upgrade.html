<script>

let selected =
  new Set();

let chance = 50;

let target = null;

let busy = false;


/* =========================================
   IMAGE
========================================= */

function img(item){

  return `

    <img
      src="${item.image}"
      class="
        w-full
        h-full
        object-contain
      "
      alt="${item.name}"
    >

  `;

}


/* =========================================
   RENDER
========================================= */

function render(){

  const inventory =
    getInventory();


  const stake =
    inventory.filter(
      item =>
        selected.has(
          item.uid
        )
    );


  const total =
    stake.reduce(
      (sum,item) =>
        sum +
        Number(
          item.price || 0
        ),
      0
    );


  const max =
    Math.floor(
      total /
      (chance / 100)
    );


  document.getElementById(
    'stake'
  ).textContent =
    formatPrice(total);


  document.getElementById(
    'center'
  ).textContent =
    formatPrice(total);


  document.getElementById(
    'max'
  ).textContent =
    formatPrice(max);


  document.getElementById(
    'chance'
  ).textContent =
    chance + '%';


  document.getElementById(
    'mult'
  ).textContent =
    'x' +
    (100 / chance)
      .toFixed(2);


  /* INVENTORY */

  document.getElementById(
    'inventory'
  ).innerHTML =

    inventory.length

      ?

    inventory.map(
      item => `

      <button
        onclick="
          toggle('${item.uid}')
        "
        class="
          item-card
          rounded-2xl
          border
          border-white/10
          bg-black/20
          p-3
          text-left

          ${
            selected.has(item.uid)
              ? 'selected'
              : ''
          }
        "
      >

        <div
          class="
            h-28
          "
        >

          ${img(item)}

        </div>


        <div
          class="
            font-black
            text-sm
            mt-2
            truncate
          "
        >

          ${item.name}

        </div>


        <div
          class="
            text-xs
            mt-1
          "
          style="
            color:
            ${RARITIES[item.rarity].color}
          "
        >

          ${RARITIES[item.rarity].name}

        </div>


        <div
          class="
            text-xs
            text-amber-400
            mt-1
          "
        >

          🪙 ${item.price}

        </div>

      </button>

    `
    ).join('')

      :

    `

      <div
        class="
          col-span-full
          text-center
          p-10
          text-zinc-600
        "
      >

        Инвентарь пуст.

      </div>

    `;


  /* CHANCES */

  document.getElementById(
    'chances'
  ).innerHTML =

    [10,25,50,75]
      .map(
        value => `

        <button
          onclick="
            setChance(${value})
          "
          class="
            py-3
            rounded-xl
            border

            ${
              chance === value
                ? `
                  border-fuchsia-500
                  bg-fuchsia-500/10
                `
                : `
                  border-white/10
                  bg-white/5
                `
            }

            font-black
          "
        >

          ${value}%

        </button>

      `
      )
      .join('');


  /* TARGETS */

  const targets =
    ITEMS
      .filter(
        item =>
          item.price > total
      )
      .sort(
        (a,b) =>
          a.price - b.price
      );


  if(
    target &&
    !targets.some(
      item =>
        item.id === target
    )
  ){

    target = null;

  }


  document.getElementById(
    'targets'
  ).innerHTML =

    targets.length

      ?

    targets
      .map(
        item => {

          const possible =
            total > 0 &&
            item.price <= max;


          const need =
            Math.min(
              100,
              total /
              item.price *
              100
            );


          return `

          <button

            ${
              possible
                ?
                `onclick="
                  chooseTarget('${item.id}')
                "`
                :
                ''
            }

            class="
              target-card
              rounded-2xl
              border
              border-white/10
              bg-black/20
              p-3
              text-left

              ${
                target === item.id
                  ? 'selected'
                  : ''
              }

              ${
                possible
                  ? ''
                  : 'locked'
              }
            "
          >

            <div
              class="
                h-28
              "
            >

              ${img(item)}

            </div>


            <div
              class="
                font-black
                text-sm
                mt-2
              "
            >

              ${item.name}

            </div>


            <div
              class="
                text-xs
                mt-1
              "
              style="
                color:
                ${RARITIES[item.rarity].color}
              "
            >

              ${RARITIES[item.rarity].name}

            </div>


            <div
              class="
                text-xs
                text-amber-400
                mt-1
              "
            >

              🪙 ${item.price}

            </div>


            <div
              class="
                text-[10px]
                font-black
                mt-2

                ${
                  possible
                    ? 'text-emerald-400'
                    : 'text-zinc-600'
                }
              "
            >

              ${
                possible

                  ?

                `ДОСТУПНО · ${need.toFixed(1)}%`

                  :

                'НЕ ДОСТУПНО ПРИ ЭТОМ ШАНСЕ'
              }

            </div>

          </button>

        `;

        }
      )
      .join('')

      :

    `

      <div
        class="
          col-span-full
          text-center
          p-10
          text-zinc-600
        "
      >

        Нет целей дороже ставки.

      </div>

    `;


  document.getElementById(
    'upgradeBtn'
  ).disabled =

    !(
      total > 0 &&
      target &&
      targets.some(
        item =>
          item.id === target
      ) &&
      !busy
    );

}


/* =========================================
   SELECT ITEM
========================================= */

function toggle(uid){

  if(
    selected.has(uid)
  ){

    selected.delete(uid);

  }else{

    selected.add(uid);

  }

  target = null;

  render();

}


/* =========================================
   CHANCE
========================================= */

function setChance(value){

  chance = value;

  target = null;

  render();

}


/* =========================================
   TARGET
========================================= */

function chooseTarget(id){

  target = id;

  render();

}


/* =========================================
   UPGRADE
========================================= */

function upgrade(){

  if(busy){
    return;
  }


  const inventory =
    getInventory();


  const stake =
    inventory.filter(
      item =>
        selected.has(
          item.uid
        )
    );


  const winItem =
    getItem(target);


  const total =
    stake.reduce(
      (sum,item) =>
        sum +
        Number(
          item.price || 0
        ),
      0
    );


  const max =
    Math.floor(
      total /
      (chance / 100)
    );


  if(
    !stake.length ||
    !winItem ||
    winItem.price > max
  ){

    return;

  }


  busy = true;


  document.getElementById(
    'upgradeBtn'
  ).disabled = true;


  document.getElementById(
    'result'
  ).textContent =
    'КРУТИМ АПГРЕЙД...';


  const wheel =
    document.getElementById(
      'wheel'
    );


  wheel.classList.remove(
    'wheel-spin'
  );


  void wheel.offsetWidth;


  wheel.classList.add(
    'wheel-spin'
  );


  setTimeout(
    () => {

      const win =
        Math.random() *
        100 <
        chance;


      removeInventoryItems(
        stake.map(
          item =>
            item.uid
        )
      );


      if(win){

        addInventoryItem(
          winItem
        );


        document.getElementById(
          'result'
        ).innerHTML = `

          <div
            class="
              pop
              text-emerald-400
              text-xl
              font-black
            "
          >

            🔥 УСПЕХ!

          </div>

          <div
            class="
              text-zinc-400
              mt-1
            "
          >

            ${winItem.name}
            добавлен в инвентарь.

          </div>

        `;

      }else{

        document.getElementById(
          'result'
        ).innerHTML = `

          <div
            class="
              pop
              text-red-400
              text-xl
              font-black
            "
          >

            💀 НЕ ПОВЕЗЛО

          </div>

          <div
            class="
              text-zinc-500
              mt-1
            "
          >

            Ставка сгорела.

          </div>

        `;

      }


      selected.clear();

      target = null;

      busy = false;

      render();

    },
    2000
  );

}


render();

</script>
