<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,initial-scale=1"
>

<title>CHAK338 — Апгрейд</title>

<script src="data.js"></script>

<style>

* {
    box-sizing:border-box;
}

body {

    margin:0;

    min-height:100vh;

    color:white;

    font-family:
        Arial,
        sans-serif;

    background:
        radial-gradient(
            circle at top,
            #25345a,
            #070a10 70%
        );

}

a {
    color:inherit;
    text-decoration:none;
}

.header {

    display:flex;

    justify-content:space-between;

    align-items:center;

    padding:18px 5%;

    background:
        rgba(5,8,14,.85);

    border-bottom:
        1px solid
        rgba(255,255,255,.08);

}

.logo {

    font-size:27px;

    font-weight:1000;

}

.logo span {
    color:#6ea8ff;
}

.nav {

    display:flex;

    gap:22px;

    color:#9ba6ba;

    font-size:14px;

    font-weight:800;

}

.container {

    width:min(1300px,92%);

    margin:auto;

    padding:50px 0;

}

h1 {

    text-align:center;

    font-size:42px;

    margin:0;

}

.subtitle {

    text-align:center;

    margin-top:10px;

    color:#8f9aad;

}

.upgrade {

    display:grid;

    grid-template-columns:
        1fr 190px 1fr;

    gap:20px;

    margin-top:45px;

    align-items:start;

}

.panel {

    padding:22px;

    border-radius:25px;

    background:
        rgba(255,255,255,.045);

    border:
        1px solid
        rgba(255,255,255,.09);

}

.panel-title {

    font-size:20px;

    font-weight:1000;

    margin-bottom:20px;

}

.items {

    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    gap:10px;

    max-height:500px;

    overflow:auto;

}

.item {

    padding:8px;

    border-radius:15px;

    background:
        rgba(255,255,255,.045);

    border:
        1px solid transparent;

    cursor:pointer;

    text-align:center;

}

.item:hover {

    background:
        rgba(255,255,255,.08);

}

.item.selected {

    border-color:
        #6ea8ff;

    box-shadow:
        0 0 0 1px #6ea8ff;

}

.item img {

    width:100%;

    height:100px;

    object-fit:contain;

}

.item-name {

    font-size:10px;

    font-weight:900;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;

}

.item-price {

    margin-top:5px;

    color:#b0bbcd;

    font-size:10px;

    font-weight:900;

}

.item-rarity {

    margin-top:3px;

    font-size:8px;

    font-weight:1000;

    text-transform:uppercase;

}

.common {
    color:#aeb7c8;
}

.uncommon {
    color:#62d98b;
}

.rare {
    color:#55a8ff;
}

.epic {
    color:#b87cff;
}

.legendary {
    color:#ffb84d;
}

.mythic {
    color:#ff4c72;
}


/* CENTER */

.center {

    text-align:center;

}

.chance-label {

    color:#8e99ad;

    font-size:10px;

    text-transform:uppercase;

}

.chance {

    font-size:50px;

    font-weight:1000;

    margin-top:5px;

}

.chances {

    display:grid;

    grid-template-columns:
        1fr 1fr;

    gap:7px;

    margin-top:20px;

}

.chances button {

    border:0;

    border-radius:10px;

    padding:11px 5px;

    background:
        rgba(255,255,255,.08);

    color:white;

    cursor:pointer;

    font-weight:1000;

}

.chances button.active {

    background:#6ea8ff;

    color:#07101d;

}

.total {

    margin-top:25px;

    color:#929db0;

    font-size:11px;

}

.total strong {

    display:block;

    color:white;

    font-size:20px;

    margin-top:5px;

}

.upgrade-button {

    width:100%;

    margin-top:25px;

    padding:15px;

    border:0;

    border-radius:14px;

    background:white;

    color:#05080d;

    font-weight:1000;

    cursor:pointer;

}

.upgrade-button:disabled {

    opacity:.3;

    cursor:not-allowed;

}


/* RESULT */

.result {

    position:fixed;

    inset:0;

    z-index:100;

    display:none;

    justify-content:center;

    align-items:center;

    background:
        rgba(0,0,0,.9);

}

.result.show {
    display:flex;
}

.result-box {

    width:min(430px,90%);

    padding:40px;

    text-align:center;

    border-radius:30px;

    background:#111824;

}

.result-title {

    font-size:27px;

    font-weight:1000;

}

.win {
    color:#63e69a;
}

.lose {
    color:#ff5872;
}

.result img {

    width:220px;

    height:220px;

    object-fit:contain;

    margin:15px;

}

.result-name {

    font-size:24px;

    font-weight:1000;

}

.result-price {

    margin-top:8px;

    color:#9da8ba;

}

.result button {

    width:100%;

    margin-top:25px;

    padding:15px;

    border:0;

    border-radius:13px;

    background:white;

    font-weight:1000;

}


/* REEL */

.reel-screen {

    position:fixed;

    inset:0;

    z-index:90;

    display:none;

    justify-content:center;

    align-items:center;

    background:
        rgba(2,4,8,.96);

}

.reel-screen.show {
    display:flex;
}

.reel {

    position:relative;

    width:min(1050px,90%);

    height:210px;

    overflow:hidden;

    border-radius:25px;

    background:#111722;

}

.marker {

    position:absolute;

    z-index:2;

    left:50%;

    top:0;

    bottom:0;

    width:4px;

    transform:
        translateX(-50%);

    background:white;

}

.track {

    position:absolute;

    top:0;

    left:0;

    height:100%;

    display:flex;

    align-items:center;

    gap:10px;

}

.reel-item {

    flex:
        0 0 170px;

    height:180px;

    display:flex;

    flex-direction:column;

    justify-content:center;

    align-items:center;

    border-radius:18px;

    background:
        rgba(255,255,255,.05);

}

.reel-item img {

    width:115px;

    height:115px;

    object-fit:contain;

}

.reel-item span {

    font-size:10px;

    font-weight:900;

}

@media(max-width:950px) {

    .upgrade {
        grid-template-columns:1fr;
    }

    .center {
        order:-1;
    }

}

@media(max-width:600px) {

    .nav {
        display:none;
    }

    .items {
        grid-template-columns:
            repeat(2,1fr);
    }

}

</style>

</head>

<body>


<header class="header">

<a
    href="index.html"
    class="logo"
>
CHAK<span>338</span>
</a>


<nav class="nav">

<a href="index.html">
Главная
</a>

<a href="inventory.html">
Инвентарь
</a>

<a href="upgrade.html">
Апгрейд
</a>

</nav>

</header>


<main class="container">


<h1>
АПГРЕЙДЕР
</h1>

<div class="subtitle">
Обменивай свои предметы
на шанс получить более дорогой предмет.
</div>


<div class="upgrade">


<!-- ======================================================
     STAKE
     ====================================================== -->

<section class="panel">

<div class="panel-title">
ТЫ СТАВИШЬ
</div>

<div
    class="items"
    id="inventoryItems"
></div>

</section>


<!-- ======================================================
     CENTER
     ====================================================== -->

<section class="center">


<div class="chance-label">
Шанс победы
</div>


<div
    class="chance"
    id="chance"
>
50%
</div>


<div class="chances">

<button data-chance="10">
10%
</button>

<button data-chance="25">
25%
</button>

<button
    data-chance="50"
    class="active"
>
50%
</button>

<button data-chance="75">
75%
</button>

</div>


<div class="total">

Стоимость ставки

<strong id="total">
💰 0
</strong>

</div>


<button
    class="upgrade-button"
    id="upgradeButton"
    disabled
>
АПГРЕЙД
</button>


</section>


<!-- ======================================================
     TARGET
     ====================================================== -->

<section class="panel">

<div class="panel-title">
ЧТО ХОЧУ ПОЛУЧИТЬ
</div>

<div
    class="items"
    id="targetItems"
></div>

</section>


</div>

</main>


<!-- REEL -->

<div
    class="reel-screen"
    id="reelScreen"
>

<div class="reel">

<div class="marker"></div>

<div
    class="track"
    id="track"
></div>

</div>

</div>


<!-- RESULT -->

<div
    class="result"
    id="result"
>

<div class="result-box">

<div
    class="result-title"
    id="resultTitle"
></div>

<img id="resultImage">

<div
    class="result-name"
    id="resultName"
></div>

<div
    class="result-price"
    id="resultPrice"
></div>

<button onclick="closeResult()">
ПРОДОЛЖИТЬ
</button>

</div>

</div>


<script>

let inventory =
    getInventory();


let selectedStake = [];


let selectedTarget =
    null;


let selectedChance =
    50;


/* ============================================================
   CHANCE
   ============================================================ */


document
    .querySelectorAll(
        "[data-chance]"
    )
    .forEach(button => {

        button.onclick = () => {

            selectedChance =
                Number(
                    button.dataset.chance
                );


            document
                .querySelectorAll(
                    "[data-chance]"
                )
                .forEach(btn => {

                    btn.classList.remove(
                        "active"
                    );

                });


            button.classList.add(
                "active"
            );


            document.getElementById(
                "chance"
            ).textContent =
                selectedChance +
                "%";


            renderTargets();

            updateButton();

        };

    });


/* ============================================================
   INVENTORY
   ============================================================ */


function renderInventory() {

    const container =
        document.getElementById(
            "inventoryItems"
        );


    container.innerHTML = "";


    if (!inventory.length) {

        container.innerHTML = `

            <div style="
                grid-column:1/-1;
                text-align:center;
                padding:30px;
                color:#7f899b;
            ">

                Инвентарь пуст

            </div>

        `;

        return;

    }


    inventory.forEach(item => {

        const card =
            document.createElement(
                "div"
            );


        card.className =
            "item";


        if (
            selectedStake.includes(
                item.uid
            )
        ) {

            card.classList.add(
                "selected"
            );

        }


        const rarity =
            getRarity(
                item.rarity
            );


        card.innerHTML = `

            <img
                src="${item.image}"
            >

            <div class="item-name">
                ${item.name}
            </div>

            <div
                class="
                    item-rarity
                    ${item.rarity}
                "
            >
                ${rarity.name}
            </div>

            <div class="item-price">
                💰 ${formatPrice(item.price)}
            </div>

        `;


        card.onclick = () => {

            if (
                selectedStake.includes(
                    item.uid
                )
            ) {

                selectedStake =
                    selectedStake.filter(
                        id =>
                            id !== item.uid
                    );

            } else {

                selectedStake.push(
                    item.uid
                );

            }


            renderInventory();

            updateTotal();

            renderTargets();

            updateButton();

        };


        container.appendChild(
            card
        );

    });

}


/* ============================================================
   TOTAL
   ============================================================ */


function getTotal() {

    return selectedStake.reduce(

        (sum, uid) => {

            const item =
                inventory.find(
                    x =>
                        x.uid === uid
                );


            return sum +
                Number(
                    item?.price || 0
                );

        },

        0

    );

}


function updateTotal() {

    document.getElementById(
        "total"
    ).textContent =
        "💰 " +
        formatPrice(
            getTotal()
        );

}


/* ============================================================
   TARGET ITEMS
   ============================================================ */


function renderTargets() {

    const container =
        document.getElementById(
            "targetItems"
        );


    container.innerHTML = "";


    const total =
        getTotal();


    if (!total) {

        container.innerHTML = `

            <div style="
                grid-column:1/-1;
                text-align:center;
                padding:30px;
                color:#7f899b;
            ">

                Сначала выбери ставку

            </div>

        `;

        selectedTarget =
            null;

        return;

    }


    /*
       Например:

       ставка = 100

       50%:

       максимум =
       100 / 0.50
       = 200

       25%:

       максимум =
       100 / 0.25
       = 400

       10%:

       максимум =
       100 / 0.10
       = 1000

    */


    const maxPrice =
        total /
        (
            selectedChance /
            100
        );


    const targets =
        ITEMS.filter(
            item =>

                item.price >
                total

                &&

                item.price <=
                maxPrice
        );


    if (!targets.length) {

        container.innerHTML = `

            <div style="
                grid-column:1/-1;
                text-align:center;
                padding:30px;
                color:#7f899b;
            ">

                При этой ставке
                и шансе нет подходящих
                предметов.

            </div>

        `;

        selectedTarget =
            null;

        return;

    }


    targets.forEach(item => {

        const card =
            document.createElement(
                "div"
            );


        card.className =
            "item";


        if (
            selectedTarget &&
            selectedTarget.id ===
            item.id
        ) {

            card.classList.add(
                "selected"
            );

        }


        const rarity =
            getRarity(
                item.rarity
            );


        card.innerHTML = `

            <img
                src="${item.image}"
            >

            <div class="item-name">
                ${item.name}
            </div>

            <div
                class="
                    item-rarity
                    ${item.rarity}
                "
            >
                ${rarity.name}
            </div>

            <div class="item-price">
                💰 ${formatPrice(item.price)}
            </div>

        `;


        card.onclick = () => {

            selectedTarget =
                item;


            renderTargets();

            updateButton();

        };


        container.appendChild(
            card
        );

    });

}


/* ============================================================
   BUTTON
   ============================================================ */


function updateButton() {

    document.getElementById(
        "upgradeButton"
    ).disabled =
        selectedStake.length === 0 ||
        !selectedTarget;

}


/* ============================================================
   START UPGRADE
   ============================================================ */


document.getElementById(
    "upgradeButton"
).onclick =
    startUpgrade;


function startUpgrade() {

    if (
        !selectedStake.length ||
        !selectedTarget
    ) {
        return;
    }


    const target =
        selectedTarget;


    const success =
        Math.random() * 100 <
        selectedChance;


    buildReel(
        target
    );


    document.getElementById(
        "reelScreen"
    ).classList.add(
        "show"
    );


    setTimeout(() => {

        document.getElementById(
            "reelScreen"
        ).classList.remove(
            "show"
        );


        if (success) {

            win(target);

        } else {

            lose();

        }

    },5100);

}


/* ============================================================
   REEL
   ============================================================ */


function buildReel(winner) {

    const track =
        document.getElementById(
            "track"
        );


    track.innerHTML = "";


    const reel = [];


    for (
        let i = 0;
        i < 45;
        i++
    ) {

        reel.push(
            ITEMS[
                Math.floor(
                    Math.random() *
                    ITEMS.length
                )
            ]
        );

    }


    const winnerIndex =
        35;


    reel[winnerIndex] =
        winner;


    reel.forEach(item => {

        const element =
            document.createElement(
                "div"
            );


        element.className =
            "reel-item";


        element.innerHTML = `

            <img
                src="${item.image}"
            >

            <span>
                ${item.name}
            </span>

        `;


        track.appendChild(
            element
        );

    });


    const width =
        170 + 10;


    const reelWidth =
        document.querySelector(
            ".reel"
        ).clientWidth;


    const target =
        -(winnerIndex * width)
        +
        reelWidth / 2
        -
        width / 2;


    track.style.transition =
        "none";


    track.style.transform =
        "translateX(0)";


    requestAnimationFrame(() => {

        requestAnimationFrame(() => {

            track.style.transition =
                "transform 5s cubic-bezier(.08,.75,.12,1)";

            track.style.transform =
                `translateX(${target}px)`;

        });

    });

}


/* ============================================================
   WIN
   ============================================================ */


function win(target) {

    removeInventoryItems(
        selectedStake
    );


    addInventoryItem(
        target
    );


    inventory =
        getInventory();


    document.getElementById(
        "resultTitle"
    ).textContent =
        "АПГРЕЙД УДАЛСЯ!";


    document.getElementById(
        "resultTitle"
    ).className =
        "result-title win";


    document.getElementById(
        "resultImage"
    ).src =
        target.image;


    document.getElementById(
        "resultName"
    ).textContent =
        target.name;


    document.getElementById(
        "resultPrice"
    ).textContent =
        "💰 " +
        formatPrice(
            target.price
        );


    document.getElementById(
        "result"
    ).classList.add(
        "show"
    );


    reset();

}


/* ============================================================
   LOSE
   ============================================================ */


function lose() {

    removeInventoryItems(
        selectedStake
    );


    inventory =
        getInventory();


    document.getElementById(
        "resultTitle"
    ).textContent =
        "НЕ ПОВЕЗЛО";


    document.getElementById(
        "resultTitle"
    ).className =
        "result-title lose";


    document.getElementById(
        "resultImage"
    ).style.display =
        "none";


    document.getElementById(
        "resultName"
    ).textContent =
        "Ставка потеряна";


    document.getElementById(
        "resultPrice"
    ).textContent =
        "";


    document.getElementById(
        "result"
    ).classList.add(
        "show"
    );


    reset();

}


function reset() {

    selectedStake = [];

    selectedTarget = null;

    renderInventory();

    updateTotal();

    renderTargets();

    updateButton();

}


function closeResult() {

    document.getElementById(
        "result"
    ).classList.remove(
        "show"
    );


    document.getElementById(
        "resultImage"
    ).style.display =
        "block";

}

</script>

</body>

</html>
