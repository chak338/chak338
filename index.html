<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,initial-scale=1.0"
>

<title>CHAK338</title>

<script src="data.js"></script>

<style>

* {
    box-sizing:border-box;
}

body {

    margin:0;

    color:white;

    font-family:
        Arial,
        sans-serif;

    background:
        radial-gradient(
            circle at top,
            #24345a,
            #070a11 65%
        );

}

a {
    color:inherit;
    text-decoration:none;
}

.header {

    position:sticky;

    top:0;

    z-index:20;

    display:flex;

    justify-content:space-between;

    align-items:center;

    padding:18px 5%;

    background:
        rgba(5,8,14,.85);

    backdrop-filter:
        blur(20px);

    border-bottom:
        1px solid
        rgba(255,255,255,.08);

}

.logo {

    font-size:28px;

    font-weight:1000;

}

.logo span {
    color:#6ea8ff;
}

.nav {

    display:flex;

    gap:22px;

    color:#9ba6ba;

    font-size:14px;

    font-weight:800;

}

.nav a:hover {
    color:white;
}

.container {

    width:min(1250px,90%);

    margin:auto;

}

.hero {

    min-height:380px;

    display:flex;

    justify-content:center;

    align-items:center;

    text-align:center;

}

.hero h1 {

    font-size:
        clamp(60px,10vw,110px);

    margin:0;

    font-weight:1000;

    letter-spacing:-6px;

}

.hero h1 span {
    color:#6ea8ff;
}

.hero p {

    max-width:600px;

    margin:25px auto;

    color:#929db2;

    line-height:1.7;

}

.title {

    margin:40px 0 25px;

    font-size:30px;

    font-weight:1000;

}

.cases {

    display:grid;

    grid-template-columns:
        repeat(4,1fr);

    gap:18px;

}

.case {

    min-height:390px;

    padding:20px;

    border-radius:25px;

    cursor:pointer;

    display:flex;

    flex-direction:column;

    justify-content:space-between;

    align-items:center;

    text-align:center;

    border:
        1px solid
        rgba(255,255,255,.1);

    transition:
        .25s;

}

.case:hover {

    transform:
        translateY(-8px);

    border-color:
        rgba(255,255,255,.3);

}

.case.blue {

    background:
        radial-gradient(
            circle,
            #315cae,
            #0c152b
        );

}

.case.purple {

    background:
        radial-gradient(
            circle,
            #7838a9,
            #21102f
        );

}

.case.red {

    background:
        radial-gradient(
            circle,
            #b23932,
            #2b0d0d
        );

}

.case.dota {

    background:
        radial-gradient(
            circle,
            #6d3b25,
            #160d0a
        );

}

.case img {

    width:210px;

    height:210px;

    object-fit:contain;

    filter:
        drop-shadow(
            0 20px 25px
            rgba(0,0,0,.5)
        );

}

.case-name {

    font-size:24px;

    font-weight:1000;

}

.case-description {

    margin-top:7px;

    color:
        rgba(255,255,255,.65);

    font-size:12px;

}


/* MODAL */

.modal {

    position:fixed;

    inset:0;

    z-index:100;

    display:none;

    justify-content:center;

    align-items:center;

    padding:20px;

    background:
        rgba(0,0,0,.85);

    backdrop-filter:
        blur(10px);

}

.modal.show {
    display:flex;
}

.modal-box {

    width:min(1100px,100%);

    max-height:90vh;

    overflow:auto;

    padding:30px;

    border-radius:28px;

    background:
        linear-gradient(
            145deg,
            #171f30,
            #090c13
        );

    border:
        1px solid
        rgba(255,255,255,.12);

}

.modal-header {

    display:flex;

    justify-content:space-between;

    align-items:center;

    margin-bottom:25px;

}

.modal-title {

    font-size:28px;

    font-weight:1000;

}

.close {

    width:42px;

    height:42px;

    border:0;

    border-radius:12px;

    background:
        rgba(255,255,255,.08);

    color:white;

    font-size:20px;

    cursor:pointer;

}

.contents {

    display:grid;

    grid-template-columns:
        repeat(6,1fr);

    gap:12px;

}

.item {

    padding:12px;

    border-radius:17px;

    text-align:center;

    background:
        rgba(255,255,255,.045);

    border:
        1px solid
        rgba(255,255,255,.07);

}

.item img {

    width:100%;

    height:120px;

    object-fit:contain;

}

.item-name {

    font-size:12px;

    font-weight:900;

}

.rarity {

    margin-top:5px;

    font-size:9px;

    font-weight:1000;

    text-transform:uppercase;

}

.common {
    color:#aeb7c8;
}

.uncommon {
    color:#62d98b;
}

.rare {
    color:#55a8ff;
}

.epic {
    color:#b87cff;
}

.legendary {
    color:#ffb84d;
}

.mythic {
    color:#ff4c72;
}

.price {

    margin-top:5px;

    font-size:11px;

    color:#d7dfed;

    font-weight:900;

}

.open {

    display:block;

    margin:25px auto 0;

    padding:
        15px 45px;

    border:0;

    border-radius:14px;

    background:white;

    color:#070a10;

    font-weight:1000;

    cursor:pointer;

}


/* SPIN */

.spin {

    position:fixed;

    inset:0;

    z-index:200;

    display:none;

    justify-content:center;

    align-items:center;

    background:
        rgba(2,4,8,.96);

}

.spin.show {
    display:flex;
}

.reel {

    position:relative;

    width:min(1100px,90%);

    height:210px;

    overflow:hidden;

    border-radius:25px;

    background:#111722;

}

.marker {

    position:absolute;

    z-index:2;

    left:50%;

    top:0;

    bottom:0;

    width:4px;

    transform:
        translateX(-50%);

    background:white;

}

.track {

    position:absolute;

    left:0;

    top:0;

    height:100%;

    display:flex;

    gap:10px;

    align-items:center;

}

.reel-item {

    flex:
        0 0 170px;

    height:180px;

    display:flex;

    flex-direction:column;

    justify-content:center;

    align-items:center;

    border-radius:18px;

    background:
        rgba(255,255,255,.05);

}

.reel-item img {

    width:120px;

    height:120px;

    object-fit:contain;

}

.reel-item span {

    font-size:10px;

    font-weight:900;

}


/* RESULT */

.result {

    position:fixed;

    inset:0;

    z-index:300;

    display:none;

    justify-content:center;

    align-items:center;

    background:
        rgba(0,0,0,.9);

}

.result.show {
    display:flex;
}

.result-box {

    width:min(430px,90%);

    padding:40px;

    text-align:center;

    border-radius:30px;

    background:#111824;

}

.result-box img {

    width:230px;

    height:230px;

    object-fit:contain;

}

.result-name {

    font-size:28px;

    font-weight:1000;

    margin-top:10px;

}

.result-price {

    color:#aab4c5;

    margin-top:8px;

}

.result button {

    width:100%;

    margin-top:25px;

    padding:15px;

    border:0;

    border-radius:14px;

    background:white;

    font-weight:1000;

}

@media(max-width:1100px) {

    .cases {
        grid-template-columns:
            repeat(2,1fr);
    }

    .contents {
        grid-template-columns:
            repeat(4,1fr);
    }

}

@media(max-width:650px) {

    .nav {
        display:none;
    }

    .cases {
        grid-template-columns:1fr;
    }

    .contents {
        grid-template-columns:
            repeat(2,1fr);
    }

}

</style>

</head>

<body>


<header class="header">

<a
    href="index.html"
    class="logo"
>
    CHAK<span>338</span>
</a>


<nav class="nav">

<a href="index.html">
Главная
</a>

<a href="#cases">
Кейсы
</a>

<a href="inventory.html">
Инвентарь
</a>

<a href="upgrade.html">
Апгрейд
</a>

</nav>

</header>


<main class="container">


<section class="hero">

<div>

<h1>
CHAK<span>338</span>
</h1>

<p>
Открывай кейсы, собирай редкие предметы
и улучшай свою коллекцию.
</p>

</div>

</section>


<section id="cases">

<div class="title">
Кейсы
</div>

<div
    class="cases"
    id="casesGrid"
></div>

</section>


</main>


<!-- CONTENT MODAL -->

<div
    class="modal"
    id="contentsModal"
>

<div class="modal-box">


<div class="modal-header">

<div
    class="modal-title"
    id="modalTitle"
>
</div>

<button
    class="close"
    onclick="closeModal()"
>
×
</button>

</div>


<div
    class="contents"
    id="contents"
></div>


<button
    class="open"
    id="openCaseButton"
>
ОТКРЫТЬ КЕЙС
</button>


</div>

</div>


<!-- SPIN -->

<div
    class="spin"
    id="spin"
>

<div class="reel">

<div class="marker"></div>

<div
    class="track"
    id="track"
></div>

</div>

</div>


<!-- RESULT -->

<div
    class="result"
    id="result"
>

<div class="result-box">

<div>
ТЕБЕ ВЫПАЛО
</div>

<img
    id="resultImage"
>

<div
    class="result-name"
    id="resultName"
></div>

<div
    class="result-price"
    id="resultPrice"
></div>

<button onclick="closeResult()">
ЗАБРАТЬ
</button>

</div>

</div>


<script>

const casesGrid =
    document.getElementById(
        "casesGrid"
    );


let currentCase = null;


/* ============================================================
   CASE CARDS
   ============================================================ */


CASES.forEach(caseData => {

    const card =
        document.createElement("div");


    card.className =
        "case " +
        caseData.color;


    card.innerHTML = `

        <img
            src="${caseData.image}"
            onerror="
                this.src='https://dummyimage.com/400x400/151b29/ffffff&text=${caseData.name}'
            "
        >

        <div>

            <div class="case-name">
                ${caseData.name}
            </div>

            <div class="case-description">
                ${caseData.description}
            </div>

        </div>

    `;


    card.onclick = () => {

        openCaseContents(
            caseData.id
        );

    };


    casesGrid.appendChild(
        card
    );

});


/* ============================================================
   CONTENTS
   ============================================================ */


function openCaseContents(caseId) {

    currentCase =
        getCase(caseId);


    document.getElementById(
        "modalTitle"
    ).textContent =
        currentCase.name +
        " — СОДЕРЖИМОЕ";


    const container =
        document.getElementById(
            "contents"
        );


    container.innerHTML = "";


    const items =
        getCaseItems(caseId);


    items.forEach(item => {

        const rarity =
            getRarity(
                item.rarity
            );


        const element =
            document.createElement(
                "div"
            );


        element.className =
            "item";


        element.innerHTML = `

            <img
                src="${item.image}"
                onerror="
                    this.src='https://dummyimage.com/300x300/151b29/ffffff&text=ITEM'
                "
            >

            <div class="item-name">
                ${item.name}
            </div>

            <div
                class="
                    rarity
                    ${item.rarity}
                "
            >
                ${rarity.name}
            </div>

            <div class="price">
                💰 ${formatPrice(item.price)}
            </div>

        `;


        container.appendChild(
            element
        );

    });


    document.getElementById(
        "contentsModal"
    ).classList.add(
        "show"
    );

}


function closeModal() {

    document.getElementById(
        "contentsModal"
    ).classList.remove(
        "show"
    );

}


/* ============================================================
   OPEN CASE
   ============================================================ */


document.getElementById(
    "openCaseButton"
).onclick = () => {

    if (!currentCase) {
        return;
    }


    if (
        !canOpenCase(
            currentCase.id
        )
    ) {

        alert(
            "Кейс пока недоступен.\n\nОсталось: " +
            formatTime(
                getRemaining(
                    currentCase.id
                )
            )
        );

        return;

    }


    closeModal();

    spinCase(
        currentCase.id
    );

};


/* ============================================================
   SPIN
   ============================================================ */


function spinCase(caseId) {

    const winner =
        randomCaseItem(
            caseId
        );


    if (!winner) {
        return;
    }


    setCaseOpened(
        caseId
    );


    document.getElementById(
        "spin"
    ).classList.add(
        "show"
    );


    buildReel(
        winner
    );


    setTimeout(() => {

        document.getElementById(
            "spin"
        ).classList.remove(
            "show"
        );


        showResult(
            winner
        );

    },5300);

}


function buildReel(winner) {

    const track =
        document.getElementById(
            "track"
        );


    track.innerHTML = "";


    const items = [];


    for (
        let i = 0;
        i < 50;
        i++
    ) {

        items.push(
            ITEMS[
                Math.floor(
                    Math.random() *
                    ITEMS.length
                )
            ]
        );

    }


    const winnerIndex = 40;


    items[winnerIndex] =
        winner;


    items.forEach(item => {

        const el =
            document.createElement(
                "div"
            );


        el.className =
            "reel-item";


        el.innerHTML = `

            <img
                src="${item.image}"
            >

            <span>
                ${item.name}
            </span>

        `;


        track.appendChild(
            el
        );

    });


    const width =
        170 + 10;


    const reelWidth =
        document.querySelector(
            ".reel"
        ).clientWidth;


    const target =
        -(winnerIndex * width)
        +
        reelWidth / 2
        -
        width / 2;


    track.style.transition =
        "none";


    track.style.transform =
        "translateX(0)";


    requestAnimationFrame(() => {

        requestAnimationFrame(() => {

            track.style.transition =
                "transform 5s cubic-bezier(.08,.75,.12,1)";

            track.style.transform =
                `translateX(${target}px)`;

        });

    });

}


/* ============================================================
   RESULT
   ============================================================ */


function showResult(item) {

    document.getElementById(
        "resultImage"
    ).src =
        item.image;


    document.getElementById(
        "resultName"
    ).textContent =
        item.name;


    document.getElementById(
        "resultPrice"
    ).textContent =
        "Стоимость: 💰 " +
        formatPrice(
            item.price
        );


    document.getElementById(
        "result"
    ).classList.add(
        "show"
    );


    addInventoryItem(
        item
    );


    const caseData =
        getCase(
            item.caseId
        );


    if (caseData) {

        addXP(
            caseData.xp
        );

    }

}


function closeResult() {

    document.getElementById(
        "result"
    ).classList.remove(
        "show"
    );

}


function formatTime(ms) {

    const seconds =
        Math.ceil(
            ms / 1000
        );


    const h =
        Math.floor(
            seconds / 3600
        );


    const m =
        Math.floor(
            (seconds % 3600) / 60
        );


    const s =
        seconds % 60;


    return (
        String(h).padStart(2,"0")
        + ":" +
        String(m).padStart(2,"0")
        + ":" +
        String(s).padStart(2,"0")
    );

}

</script>

</body>

</html>
