<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CHAK338 Gaming Hub</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="data.js"></script>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background:
        radial-gradient(circle at 50% -20%, rgba(86, 70, 180, .25), transparent 45%),
        #070912;
    color: #fff;
    font-family: Inter, Arial, sans-serif;
}

.glass {
    background: rgba(15, 18, 32, .82);
    border: 1px solid rgba(255,255,255,.07);
    backdrop-filter: blur(14px);
}

.header {
    position: sticky;
    top: 0;
    z-index: 100;
    background: rgba(7,9,18,.86);
    border-bottom: 1px solid rgba(255,255,255,.06);
    backdrop-filter: blur(18px);
}

.case-card {
    position: relative;
    overflow: hidden;
    transition: .25s;
}

.case-card:hover {
    transform: translateY(-6px);
    border-color: rgba(139,92,246,.55);
    box-shadow: 0 20px 60px rgba(0,0,0,.35);
}

.case-image {
    width: 100%;
    height: 230px;
    object-fit: contain;
    display: block;
}

.hantiks-art {
    height: 230px;
    display: flex;
    align-items: center;
    justify-content: center;
    background:
        radial-gradient(circle, rgba(139,92,246,.3), transparent 60%);
}

.hantiks-logo {
    width: 150px;
    height: 150px;
    border-radius: 42px;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 52px;
    font-weight: 1000;
    letter-spacing: -5px;

    background:
        linear-gradient(135deg,#7c3aed,#ec4899);

    box-shadow:
        0 0 60px rgba(139,92,246,.4),
        inset 0 0 35px rgba(255,255,255,.12);

    transform: rotate(-6deg);
}

.modal-bg {
    position: fixed;
    inset: 0;
    z-index: 1000;

    display: none;
    align-items: center;
    justify-content: center;

    background: rgba(0,0,0,.78);
    backdrop-filter: blur(10px);

    padding: 20px;
}

.modal-bg.show {
    display: flex;
}

.modal {
    width: min(1050px, 100%);
    max-height: 90vh;
    overflow: auto;

    border-radius: 28px;
    background: #0c1020;
    border: 1px solid rgba(255,255,255,.08);

    box-shadow: 0 30px 100px rgba(0,0,0,.65);
}

.modal-item {
    background: rgba(255,255,255,.035);
    border: 1px solid rgba(255,255,255,.06);
    border-radius: 15px;
    padding: 10px;
}

.modal-item img {
    width: 70px;
    height: 70px;
    object-fit: contain;
}

.reel-window {
    position: relative;
    overflow: hidden;
    border-radius: 18px;
    border: 1px solid rgba(255,255,255,.08);
    background: #080b15;
}

.reel {
    display: flex;
    gap: 10px;
    padding: 20px;
    will-change: transform;
}

.reel-card {
    min-width: 130px;
    width: 130px;
    height: 155px;

    flex-shrink: 0;

    border-radius: 16px;
    background: #111626;
    border: 1px solid rgba(255,255,255,.06);

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
}

.reel-card img {
    width: 85px;
    height: 85px;
    object-fit: contain;
}

.reel-line {
    position: absolute;
    z-index: 5;
    top: 0;
    bottom: 0;
    left: 50%;
    width: 3px;
    transform: translateX(-50%);
    background: #fff;
    box-shadow: 0 0 15px rgba(255,255,255,.9);
}

.result {
    display: none;
    text-align: center;
    padding: 25px;
}

.result.show {
    display: block;
}

.result img {
    width: 180px;
    height: 180px;
    object-fit: contain;
    margin: auto;
}

button {
    transition: .2s;
}

button:disabled {
    opacity: .45;
    cursor: not-allowed;
}

</style>
</head>

<body>

<header class="header">
    <div class="max-w-7xl mx-auto px-5 py-4 flex items-center justify-between">

        <a href="index.html"
           class="text-2xl font-black tracking-tight">
            CHAK338
            <span class="text-violet-400">GAMING</span>
        </a>

        <nav class="flex gap-2">
            <a href="index.html"
               class="px-4 py-2 rounded-xl bg-violet-600">
                Главная
            </a>

            <a href="inventory.html"
               class="px-4 py-2 rounded-xl hover:bg-white/5">
                Инвентарь
            </a>

            <a href="upgrade.html"
               class="px-4 py-2 rounded-xl hover:bg-white/5">
                Апгрейд
            </a>
        </nav>

    </div>
</header>


<main class="max-w-7xl mx-auto px-5 py-12">

    <!-- HERO -->

    <section class="glass rounded-3xl p-8 md:p-12 mb-10">

        <div class="max-w-3xl">

            <div class="text-violet-400 font-bold uppercase tracking-widest mb-3">
                CHAK338 GAMING HUB
            </div>

            <h1 class="text-4xl md:text-6xl font-black leading-tight mb-5">
                Открывай кейсы.
                <br>
                Лови редкие предметы.
            </h1>

            <p class="text-white/55 text-lg mb-7">
                Открывай игровые кейсы, собирай инвентарь,
                прокачивай уровень и используй предметы
                в апгрейдере.
            </p>

            <div class="flex flex-wrap gap-3">

                <a href="#cases"
                   class="px-6 py-3 rounded-xl bg-violet-600 hover:bg-violet-500 font-bold">
                    Открыть кейсы
                </a>

                <a href="upgrade.html"
                   class="px-6 py-3 rounded-xl bg-white/5 hover:bg-white/10 font-bold">
                    Перейти в апгрейд
                </a>

            </div>

        </div>

    </section>


    <!-- CASES -->

    <section id="cases">

        <div class="flex items-end justify-between mb-6">

            <div>
                <div class="text-violet-400 font-bold uppercase tracking-widest text-sm">
                    CASES
                </div>

                <h2 class="text-3xl font-black mt-1">
                    Кейсы
                </h2>
            </div>

            <div id="xpDisplay"
                 class="text-white/60">
                XP: 0
            </div>

        </div>


        <div id="casesGrid"
             class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-4 gap-5">
        </div>

    </section>

</main>


<!-- CASE MODAL -->

<div id="caseModal"
     class="modal-bg">

    <div class="modal">

        <div class="p-6 border-b border-white/5 flex justify-between items-center">

            <div>
                <div class="text-white/40 text-sm">
                    CASE
                </div>

                <h2 id="modalTitle"
                    class="text-2xl font-black">
                    Кейc
                </h2>
            </div>

            <button onclick="closeCase()"
                    class="w-10 h-10 rounded-xl bg-white/5 hover:bg-white/10">
                ✕
            </button>

        </div>


        <div id="caseContent"
             class="p-6">

            <!-- JS -->

        </div>

    </div>

</div>


<script>

let selectedCase = null;
let opening = false;


// ============================================================
// RENDER CASES
// ============================================================

function renderCases() {

    const grid = document.getElementById("casesGrid");

    grid.innerHTML = "";

    CASES.forEach((c, index) => {

        const cooldown = c.noCooldown
            ? 0
            : getCaseCooldown(c.id);

        const remaining = cooldown - Date.now();

        const locked = remaining > 0;

        const card = document.createElement("div");

        card.className =
            "glass rounded-3xl p-4 case-card";


        let art = "";

        if (c.image) {

            art = `
                <img
                    class="case-image"
                    src="${c.image}"
                    alt="${c.name}"
                    onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';"
                >

                <div
                    style="display:none"
                    class="hantiks-art">
                    <div class="hantiks-logo">
                        ${index + 1}
                    </div>
                </div>
            `;

        } else {

            art = `
                <div class="hantiks-art">
                    <div class="hantiks-logo">
                        H
                    </div>
                </div>
            `;
        }


        card.innerHTML = `

            ${art}

            <div class="px-2 pb-2">

                <div class="flex items-center justify-between mb-2">

                    <h3 class="text-xl font-black">
                        ${c.name}
                    </h3>

                    <div class="text-xs text-white/35">
                        #${index + 1}
                    </div>

                </div>


                <div class="text-white/45 text-sm mb-4">
                    ${c.items.length} предметов
                </div>


                <button
                    class="w-full py-3 rounded-xl font-bold
                    ${locked
                        ? "bg-white/5"
                        : "bg-violet-600 hover:bg-violet-500"}"
                    onclick="openCase('${c.id}')">

                    ${
                        c.noCooldown
                            ? "ОТКРЫТЬ"
                            : locked
                                ? formatTime(remaining)
                                : "ОТКРЫТЬ КЕЙС"
                    }

                </button>

            </div>
        `;


        grid.appendChild(card);
    });


    document.getElementById("xpDisplay").textContent =
        `XP: ${getXP()}`;
}


// ============================================================
// FORMAT TIME
// ============================================================

function formatTime(ms) {

    if (ms <= 0) {
        return "ОТКРЫТЬ КЕЙС";
    }

    let sec = Math.floor(ms / 1000);

    const h = Math.floor(sec / 3600);

    sec %= 3600;

    const m = Math.floor(sec / 60);

    sec %= 60;

    return `${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}:${String(sec).padStart(2,"0")}`;
}


// ============================================================
// OPEN CASE WINDOW
// ============================================================

function openCase(caseId) {

    if (opening) return;

    const c = CASES.find(x => x.id === caseId);

    if (!c) return;

    if (!c.noCooldown) {

        const remaining =
            getCaseCooldown(caseId) - Date.now();

        if (remaining > 0) {
            return;
        }
    }


    selectedCase = c;

    document.getElementById("modalTitle").textContent =
        c.name;


    const content =
        document.getElementById("caseContent");


    content.innerHTML = `

        <div class="grid md:grid-cols-[260px_1fr] gap-7">

            <div>

                ${
                    c.image
                        ? `
                        <img
                            src="${c.image}"
                            class="w-full h-64 object-contain rounded-2xl"
                        >
                        `
                        : `
                        <div class="h-64 hantiks-art rounded-2xl">
                            <div class="hantiks-logo">
                                H
                            </div>
                        </div>
                        `
                }

                <div class="mt-4 p-4 rounded-2xl bg-white/5">

                    <div class="text-white/40 text-sm">
                        Награда XP
                    </div>

                    <div class="text-2xl font-black text-violet-400">
                        +${c.xp} XP
                    </div>

                </div>

            </div>


            <div>

                <h3 class="text-xl font-black mb-4">
                    Содержимое кейса
                </h3>


                <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-3">

                    ${c.items.map(item => `

                        <div class="modal-item">

                            <img src="${item.image}">

                            <div class="text-sm font-bold mt-2">
                                ${item.name}
                            </div>

                            <div class="text-violet-400 font-black">
                                ${item.price} монет
                            </div>

                        </div>

                    `).join("")}

                </div>


                <button
                    onclick="startOpening()"
                    class="mt-6 w-full py-4 rounded-2xl bg-violet-600 hover:bg-violet-500 font-black text-lg">

                    ОТКРЫТЬ КЕЙС

                </button>

            </div>

        </div>


        <div id="reelArea"
             class="hidden mt-8">

            <div class="text-center text-white/40 text-sm mb-3">
                ОПРЕДЕЛЕНИЕ ПРЕДМЕТА
            </div>

            <div class="reel-window">

                <div class="reel-line"></div>

                <div id="reel"
                     class="reel">
                </div>

            </div>

        </div>


        <div id="caseResult"
             class="result">

        </div>

    `;


    document.getElementById("caseModal")
        .classList.add("show");
}


// ============================================================
// CLOSE CASE
// ============================================================

function closeCase() {

    if (opening) return;

    document.getElementById("caseModal")
        .classList.remove("show");

    selectedCase = null;
}


// ============================================================
// OPENING
// ============================================================

function startOpening() {

    if (!selectedCase || opening) return;

    opening = true;


    const c = selectedCase;


    if (!c.noCooldown) {

        const remaining =
            getCaseCooldown(c.id) - Date.now();

        if (remaining > 0) {
            opening = false;
            return;
        }
    }


    const reelArea =
        document.getElementById("reelArea");

    const reel =
        document.getElementById("reel");


    reelArea.classList.remove("hidden");


    const result =
        document.getElementById("caseResult");

    result.classList.remove("show");

    result.innerHTML = "";


    // выбираем предмет заранее
    const winner =
        weightedItem(c.items);


    // создаём длинную ленту
    const sequence = [];

    for (let i = 0; i < 55; i++) {

        sequence.push(
            c.items[
                Math.floor(
                    Math.random() * c.items.length
                )
            ]
        );
    }


    // победитель примерно в конце
    sequence[48] = winner;


    reel.innerHTML =
        sequence.map(item => `

            <div class="reel-card">

                <img src="${item.image}">

                <div class="text-xs text-white/70 text-center px-2">
                    ${item.name}
                </div>

                <div class="text-violet-400 font-black text-sm">
                    ${item.price}
                </div>

            </div>

        `).join("");


    const cardWidth = 140;

    const target =
        (48 * cardWidth) -
        (reelArea.clientWidth / 2) +
        70;


    reel.style.transition = "none";
    reel.style.transform = "translateX(0px)";


    requestAnimationFrame(() => {

        requestAnimationFrame(() => {

            reel.style.transition =
                "transform 4.5s cubic-bezier(.08,.72,.12,1)";

            reel.style.transform =
                `translateX(-${target}px)`;

        });

    });


    // звуки
    playSpinSound();


    setTimeout(() => {

        finishCase(winner);

    }, 4700);
}


// ============================================================
// WEIGHTED ITEM
// ============================================================

function weightedItem(items) {

    // обычная мягкая система:
    // дешёвые предметы выпадают чаще,
    // дорогие реже.

    const weights =
        items.map(item =>
            1 / Math.sqrt(item.price)
        );

    const total =
        weights.reduce((a,b) => a+b, 0);

    let random =
        Math.random() * total;


    for (let i = 0; i < items.length; i++) {

        random -= weights[i];

        if (random <= 0) {
            return items[i];
        }
    }


    return items[0];
}


// ============================================================
// FINISH CASE
// ============================================================

function finishCase(winner) {

    const c = selectedCase;


    // предмет добавляется в инвентарь
    const inventory = getInventory();

    inventory.push(
        makeInventoryItem(
            winner,
            c.id
        )
    );

    saveInventory(inventory);


    // XP
    if (c.xp > 0) {
        addXP(c.xp);
    }


    // cooldown
    if (!c.noCooldown) {

        setCaseCooldown(
            c.id,
            Date.now() + c.cooldown
        );
    }


    const result =
        document.getElementById("caseResult");


    result.innerHTML = `

        <div class="text-white/40 uppercase tracking-widest text-sm">
            ВЫПАЛО
        </div>

        <img src="${winner.image}">

        <div class="text-3xl font-black">
            ${winner.name}
        </div>

        <div class="text-violet-400 text-2xl font-black mt-2">
            ${winner.price} монет
        </div>

        <div class="text-green-400 font-bold mt-3">
            Предмет добавлен в инвентарь
        </div>

        ${
            c.xp > 0
                ? `<div class="text-white/50 mt-1">+${c.xp} XP</div>`
                : ""
        }

        <button
            onclick="closeAfterWin()"
            class="mt-6 px-8 py-3 rounded-xl bg-violet-600 hover:bg-violet-500 font-bold">

            ЗАБРАТЬ

        </button>

    `;


    result.classList.add("show");


    playWinSound();


    opening = false;

    renderCases();
}


// ============================================================
// CLOSE AFTER WIN
// ============================================================

function closeAfterWin() {

    document.getElementById("caseModal")
        .classList.remove("show");

    selectedCase = null;

    opening = false;
}


// ============================================================
// SIMPLE SOUND
// ============================================================

function playSpinSound() {

    try {

        const ctx =
            new (window.AudioContext ||
                window.webkitAudioContext)();

        const osc =
            ctx.createOscillator();

        const gain =
            ctx.createGain();


        osc.type = "triangle";

        osc.frequency.value = 150;

        gain.gain.setValueAtTime(
            .001,
            ctx.currentTime
        );

        gain.gain.exponentialRampToValueAtTime(
            .12,
            ctx.currentTime + .1
        );

        gain.gain.exponentialRampToValueAtTime(
            .001,
            ctx.currentTime + 4
        );


        osc.connect(gain);
        gain.connect(ctx.destination);

        osc.start();
        osc.stop(ctx.currentTime + 4);

    } catch {}
}


function playWinSound() {

    try {

        const ctx =
            new (window.AudioContext ||
                window.webkitAudioContext)();


        [440, 660, 880].forEach(
            (freq, index) => {

                const osc =
                    ctx.createOscillator();

                const gain =
                    ctx.createGain();


                osc.frequency.value = freq;

                gain.gain.setValueAtTime(
                    .001,
                    ctx.currentTime
                );

                gain.gain.exponentialRampToValueAtTime(
                    .12,
                    ctx.currentTime + index * .12
                );

                gain.gain.exponentialRampToValueAtTime(
                    .001,
                    ctx.currentTime + .8
                );


                osc.connect(gain);
                gain.connect(ctx.destination);

                osc.start(
                    ctx.currentTime + index * .12
                );

                osc.stop(
                    ctx.currentTime + .9
                );
            }
        );

    } catch {}
}


// ============================================================
// UPDATE TIMERS
// ============================================================

setInterval(() => {
    renderCases();
}, 1000);


renderCases();

</script>

</body>
</html>
