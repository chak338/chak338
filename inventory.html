<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

<title>CHAK338 — Инвентарь</title>

<script src="https://cdn.tailwindcss.com"></script>

<style>

body {
    background:#07070b;
    color:#f8fafc;
}

body::before {

    content:"";

    position:fixed;
    inset:0;

    pointer-events:none;

    opacity:.15;

    background-image:
        linear-gradient(
            rgba(255,255,255,.035) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(255,255,255,.035) 1px,
            transparent 1px
        );

    background-size:36px 36px;

}

.card {

    background:#0c0c12;

    border:
        1px solid
        rgba(255,255,255,.08);

}

</style>

</head>


<body>


<header
    class="fixed top-0
    left-0 right-0 z-50
    bg-[#0c0c12]/90
    backdrop-blur-xl
    border-b border-white/10">

<div
    class="max-w-7xl
    mx-auto px-5">

<div
    class="h-20
    flex items-center
    justify-between">

<a
    href="index.html"
    class="font-black
    text-xl">

CHAK338

</a>


<div class="flex gap-3">

<a
    href="index.html"
    class="px-4 py-3
    rounded-xl
    bg-white/5
    font-bold">

ГЛАВНАЯ

</a>

<a
    href="upgrade.html"
    class="px-4 py-3
    rounded-xl
    bg-fuchsia-500
    font-black">

АПГРЕЙДЕР

</a>

</div>

</div>

</div>

</header>


<main
    class="max-w-7xl
    mx-auto
    px-5
    pt-32
    pb-20">


<div class="mb-12">

<div
    class="text-xs
    text-fuchsia-400
    uppercase
    tracking-[.3em]
    font-black">

CHAK338 PLAYER

</div>


<h1
    class="text-5xl
    font-black
    mt-3">

ИНВЕНТАРЬ

</h1>


<p
    class="text-zinc-500
    mt-4">

Все предметы, которые
ты получил в CHAK338.

</p>

</div>


<div
    class="grid
    sm:grid-cols-3
    gap-4
    mb-10">


<div class="card rounded-3xl p-6">

<div
    class="text-xs
    text-zinc-500
    uppercase">

Предметов

</div>

<div
    id="itemCount"
    class="text-4xl
    font-black mt-2">

0

</div>

</div>


<div class="card rounded-3xl p-6">

<div
    class="text-xs
    text-zinc-500
    uppercase">

Стоимость

</div>

<div
    id="totalValue"
    class="text-4xl
    font-black mt-2">

0

</div>

</div>


<div class="card rounded-3xl p-6">

<div
    class="text-xs
    text-zinc-500
    uppercase">

XP

</div>

<div
    id="xp"
    class="text-4xl
    font-black mt-2">

0

</div>

</div>

</div>


<div
    id="inventory"
    class="grid
    grid-cols-2
    sm:grid-cols-3
    lg:grid-cols-5
    gap-4">

</div>


<div
    id="empty"
    class="hidden
    text-center
    py-32">

<div class="text-7xl">
🎒
</div>

<h2
    class="text-3xl
    font-black
    mt-6">

Инвентарь пуст

</h2>

<p
    class="text-zinc-500
    mt-3">

Открой первый кейс
на главной странице.

</p>

<a
    href="index.html#cases"
    class="inline-block
    mt-7
    px-6 py-4
    rounded-2xl
    bg-fuchsia-500
    font-black">

ОТКРЫТЬ КЕЙС

</a>

</div>


</main>


<script src="data.js"></script>

<script>

const inventory =
    getInventory();


document.getElementById(
    "itemCount"
).textContent =
    inventory.length;


document.getElementById(
    "xp"
).textContent =
    getXP();


const total =
    inventory.reduce(
        (sum,item) =>
            sum + Number(item.price || 0),
        0
    );


document.getElementById(
    "totalValue"
).textContent =
    total + " коп.";


const container =
    document.getElementById(
        "inventory"
    );


if (!inventory.length) {

    document.getElementById(
        "empty"
    ).classList.remove("hidden");

}


inventory
    .slice()
    .reverse()
    .forEach(item => {

        const rarity =
            getRarity(item.rarity);


        const card =
            document.createElement("div");

        card.className =
            "card rounded-3xl p-4";


        card.innerHTML = `

            <div
                class="h-40
                flex items-center
                justify-center">

                <img
                    src="${item.image}"
                    alt="${item.name}"
                    class="max-w-full
                    max-h-full
                    object-contain"
                    onerror="this.style.display='none'"
                >

            </div>


            <div
                class="text-[10px]
                uppercase
                font-black
                mt-3"
                style="
                    color:${rarity.color}
                ">

                ${rarity.name}

            </div>


            <div
                class="font-black
                mt-1">

                ${item.name}

            </div>


            <div
                class="text-zinc-500
                text-sm mt-2">

                ${formatPrice(item.price)}

            </div>

        `;


        container.appendChild(card);

    });

</script>

</body>
</html>
