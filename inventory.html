<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>CHAK338 — Инвентарь</title>

<meta name="description"
      content="Инвентарь CHAK338 — все выпавшие персонажи, одежда и оружие.">

<script src="https://cdn.tailwindcss.com"></script>

<style>

html{
  scroll-behavior:smooth
}

body{
  background:#07070b;
  color:#f8fafc
}

body:before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  opacity:.16;

  background-image:
    linear-gradient(
      rgba(255,255,255,.035) 1px,
      transparent 1px
    ),

    linear-gradient(
      90deg,
      rgba(255,255,255,.035) 1px,
      transparent 1px
    );

  background-size:36px 36px
}

.glass{
  background:rgba(12,12,18,.82);

  backdrop-filter:blur(18px);

  -webkit-backdrop-filter:blur(18px)
}

.item-card{
  transition:
    transform .25s,
    box-shadow .25s
}

.item-card:hover{
  transform:translateY(-5px);

  box-shadow:
    0 0 35px
    rgba(168,85,247,.12)
}

.rarity-common{
  border-color:#64748b
}

.rarity-uncommon{
  border-color:#22c55e
}

.rarity-rare{
  border-color:#38bdf8
}

.rarity-epic{
  border-color:#a855f7
}

.rarity-legendary{
  border-color:#f59e0b
}

.rarity-mythic{
  border-color:#ef4444
}

.empty{
  background:
    radial-gradient(
      circle at 50% 20%,
      rgba(168,85,247,.12),
      transparent 45%
    ),
    #0b0b10
}

::-webkit-scrollbar{
  width:8px
}

::-webkit-scrollbar-thumb{
  background:#27272a;
  border-radius:20px
}

</style>

</head>


<body class="antialiased min-h-screen">


<header class="sticky top-0 z-50">

  <div class="glass
              border-b
              border-white/10">

    <div class="max-w-7xl mx-auto
                px-4 sm:px-6 lg:px-8
                h-20
                flex items-center
                justify-between
                gap-4">


      <a href="index.html"
         class="flex items-center
                gap-3 shrink-0">

        <div class="w-11 h-11
                    rounded-2xl
                    bg-gradient-to-br
                    from-fuchsia-500
                    to-violet-700
                    flex items-center
                    justify-center
                    font-black text-xl">

          C

        </div>


        <div>

          <div class="font-black text-xl">
            CHAK338
          </div>

          <div class="text-[10px]
                      uppercase
                      tracking-[.22em]
                      text-zinc-500">

            Gaming Hub

          </div>

        </div>

      </a>


      <div class="flex items-center gap-2">

        <a href="index.html#cases"
           class="hidden sm:inline-flex
                  px-4 py-3
                  rounded-xl
                  bg-white/5
                  border border-white/10
                  text-sm font-black
                  hover:bg-white/10">

          КЕЙСЫ

        </a>


        <a href="index.html"
           class="px-4 py-3
                  rounded-xl
                  bg-white
                  text-black
                  text-sm font-black
                  hover:bg-zinc-200">

          НА ГЛАВНУЮ

        </a>

      </div>

    </div>

  </div>

</header>


<main class="max-w-7xl mx-auto
             px-4 sm:px-6 lg:px-8
             py-14">


<!-- TITLE -->

<div class="flex flex-col
            md:flex-row
            md:items-end
            md:justify-between
            gap-6">


  <div>

    <div class="text-xs
                font-black
                uppercase
                tracking-[.25em]
                text-fuchsia-400">

      CHAK338 COLLECTION

    </div>


    <h1 class="mt-3
               text-5xl sm:text-6xl
               font-black
               tracking-tight">

      ИНВЕНТАРЬ

    </h1>


    <p class="mt-4
              text-zinc-400
              max-w-2xl">

      Здесь хранится всё,
      что ты выбил из кейсов.

      Персонажи, одежда и оружие
      сохраняются в браузере.

    </p>

  </div>


  <!-- STATS -->

  <div class="grid grid-cols-3
              gap-2 sm:gap-3
              w-full md:w-auto">


    <div class="rounded-2xl
                border border-white/10
                bg-zinc-950
                px-4 py-4
                min-w-24">

      <div class="text-xs text-zinc-500">
        ВСЕГО
      </div>

      <div id="total"
           class="text-2xl
                  font-black
                  mt-1">
        0
      </div>

    </div>


    <div class="rounded-2xl
                border border-white/10
                bg-zinc-950
                px-4 py-4
                min-w-24">

      <div class="text-xs text-zinc-500">
        RARE+
      </div>

      <div id="rare"
           class="text-2xl
                  font-black
                  mt-1">
        0
      </div>

    </div>


    <div class="rounded-2xl
                border border-white/10
                bg-zinc-950
                px-4 py-4
                min-w-24">

      <div class="text-xs text-zinc-500">
        MYTHIC
      </div>

      <div id="mythic"
           class="text-2xl
                  font-black
                  mt-1">
        0
      </div>

    </div>

  </div>

</div>


<!-- FILTERS -->

<div class="mt-10
            flex flex-wrap
            gap-2">


  <button
    data-filter="ALL"
    class="filter
           px-4 py-2.5
           rounded-xl
           bg-white
           text-black
           text-sm
           font-black">

    ВСЕ

  </button>


  <button
    data-filter="Uhilyant"
    class="filter
           px-4 py-2.5
           rounded-xl
           bg-white/5
           border border-white/10
           text-sm
           font-black">

    ПЕРСОНАЖИ

  </button>


  <button
    data-filter="Shkaf"
    class="filter
           px-4 py-2.5
           rounded-xl
           bg-white/5
           border border-white/10
           text-sm
           font-black">

    ОДЕЖДА

  </button>


  <button
    data-filter="Chak"
    class="filter
           px-4 py-2.5
           rounded-xl
           bg-white/5
           border border-white/10
           text-sm
           font-black">

    ОРУЖИЕ

  </button>


  <button
    id="clearBtn"
    class="ml-auto
           px-4 py-2.5
           rounded-xl
           bg-red-500/10
           border border-red-500/20
           text-red-300
           text-sm
           font-black
           hover:bg-red-500/20">

    ОЧИСТИТЬ

  </button>

</div>


<!-- INVENTORY GRID -->

<div id="grid"
     class="mt-8
            grid grid-cols-2
            md:grid-cols-3
            lg:grid-cols-4
            xl:grid-cols-5
            gap-4">

</div>


</main>


<script>

/* =====================================================
   INVENTORY
   ===================================================== */


const rarityLabels = {

  COMMON:'Обычный',

  UNCOMMON:'Необычный',

  RARE:'Редкий',

  EPIC:'Эпический',

  LEGENDARY:'Легендарный',

  MYTHIC:'Мифический'

};


let inventory = [];


function loadInventory(){

  try{

    inventory =
      JSON.parse(
        localStorage.getItem(
          'chak338_inventory'
        ) || '[]'
      );

  }

  catch(error){

    inventory = [];

  }

}


function rarityClass(rarity){

  return (
    'rarity-' +
    rarity.toLowerCase()
  );

}


/* =====================================================
   RENDER
   ===================================================== */

function render(){

  const grid =
    document.getElementById(
      'grid'
    );


  grid.innerHTML = '';


  /*
    Статистика
  */

  document.getElementById(
    'total'
  ).textContent =
    inventory.length;


  document.getElementById(
    'rare'
  ).textContent =

    inventory.filter(
      item =>
        [
          'RARE',
          'EPIC',
          'LEGENDARY',
          'MYTHIC'
        ].includes(
          item.rarity
        )
    ).length;


  document.getElementById(
    'mythic'
  ).textContent =

    inventory.filter(
      item =>
        item.rarity ===
        'MYTHIC'
    ).length;


  /*
    Если ничего нет
  */

  if(
    inventory.length === 0
  ){

    grid.innerHTML = `

      <div class="empty
                  col-span-full
                  rounded-3xl
                  border
                  border-white/10
                  p-16
                  text-center">

        <div class="text-7xl">
          🎒
        </div>

        <h2 class="mt-6
                   text-3xl
                   font-black">

          Инвентарь пуст

        </h2>

        <p class="mt-3
                  text-zinc-500">

          Открой свой первый кейс
          и здесь появится предмет.

        </p>

        <a href="index.html#cases"
           class="inline-block
                  mt-7
                  px-6 py-4
                  rounded-2xl
                  bg-fuchsia-500
                  hover:bg-fuchsia-400
                  font-black">

          ОТКРЫТЬ КЕЙС

        </a>

      </div>

    `;

    return;

  }


  /*
    Рендер предметов
  */

  inventory.forEach(
    (item,index)=>{

      const card =
        document.createElement(
          'div'
        );


      card.className =
        `item-card
         ${rarityClass(item.rarity)}
         rounded-3xl
         border
         bg-zinc-950
         p-5`;


      const date =
        item.date
          ? new Date(
              item.date
            ).toLocaleDateString(
              'ru-RU'
            )
          : 'Сегодня';


      card.innerHTML = `

        <div class="
          h-36
          rounded-2xl
          bg-zinc-900
          flex
          items-center
          justify-center
          text-7xl">

          ${item.emoji || '🎁'}

        </div>


        <div class="mt-5">

          <div class="
            text-[10px]
            uppercase
            tracking-widest
            text-zinc-500
            font-black">

            ${item.type || ''}

          </div>


          <h3 class="
            mt-2
            text-lg
            font-black">

            ${item.name}

          </h3>


          <div class="
            mt-2
            text-xs
            font-black">

            ${item.rarity}

          </div>


          <div class="
            mt-1
            text-xs
            text-zinc-500">

            ${rarityLabels[item.rarity] || ''}

          </div>


          <div class="
            mt-4
            pt-3
            border-t
            border-white/5
            flex
            justify-between
            text-[10px]
            text-zinc-600">

            <span>
              ${item.caseName}
            </span>

            <span>
              ${date}
            </span>

          </div>

        </div>

      `;


      grid.appendChild(
        card
      );

    }
  );

}


/* =====================================================
   FILTER
   ===================================================== */

function filterItems(type){

  const cards =
    document.querySelectorAll(
      '#grid .item-card'
    );


  /*
    Вместо повторного рендера
    просто фильтруем исходный массив.
  */

  const filtered =

    type === 'ALL'

      ? inventory

      : inventory.filter(
          item =>
            item.caseName === type
        );


  const grid =
    document.getElementById(
      'grid'
    );


  grid.innerHTML = '';


  if(
    filtered.length === 0
  ){

    grid.innerHTML = `

      <div class="
        col-span-full
        rounded-3xl
        border
        border-white/10
        bg-zinc-950
        p-16
        text-center">

        <div class="text-6xl">
          🔎
        </div>

        <h2 class="
          mt-5
          text-2xl
          font-black">

          Здесь пока пусто

        </h2>

        <p class="
          mt-2
          text-zinc-500">

          В этой категории
          ещё ничего не выпало.

        </p>

      </div>

    `;

    return;

  }


  filtered.forEach(
    item=>{

      const card =
        document.createElement(
          'div'
        );


      card.className =
        `item-card
         ${rarityClass(item.rarity)}
         rounded-3xl
         border
         bg-zinc-950
         p-5`;


      card.innerHTML = `

        <div class="
          h-36
          rounded-2xl
          bg-zinc-900
          flex
          items-center
          justify-center
          text-7xl">

          ${item.emoji || '🎁'}

        </div>


        <div class="mt-5">

          <div class="
            text-[10px]
            uppercase
            tracking-widest
            text-zinc-500
            font-black">

            ${item.type || ''}

          </div>


          <h3 class="
            mt-2
            text-lg
            font-black">

            ${item.name}

          </h3>


          <div class="
            mt-2
            text-xs
            font-black">

            ${item.rarity}

          </div>


          <div class="
            mt-1
            text-xs
            text-zinc-500">

            ${rarityLabels[item.rarity] || ''}

          </div>

        </div>

      `;


      grid.appendChild(
        card
      );

    }
  );

}


/* =====================================================
   FILTER BUTTONS
   ===================================================== */

document
  .querySelectorAll('.filter')
  .forEach(button=>{

    button.addEventListener(
      'click',
      ()=>{

        document
          .querySelectorAll('.filter')
          .forEach(btn=>{

            btn.classList.remove(
              'bg-white',
              'text-black'
            );

            btn.classList.add(
              'bg-white/5'
            );

          });


        button.classList.remove(
          'bg-white/5'
        );

        button.classList.add(
          'bg-white',
          'text-black'
        );


        filterItems(
          button.dataset.filter
        );

      }
    );

  });


/* =====================================================
   CLEAR
   ===================================================== */

document
  .getElementById('clearBtn')
  .addEventListener(
    'click',
    ()=>{

      if(
        !confirm(
          'Удалить весь инвентарь?'
        )
      ){

        return;

      }


      localStorage.removeItem(
        'chak338_inventory'
      );


      loadInventory();

      render();

    }
  );


/* INIT */

loadInventory();

render();

</script>

</body>
</html>
