<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>CHAK338 — Инвентарь</title>

<script src="data.js"></script>

<style>

* {
    box-sizing: border-box;
}

body {

    margin: 0;

    min-height: 100vh;

    font-family:
        Inter,
        Arial,
        sans-serif;

    color: white;

    background:
        radial-gradient(
            circle at 50% -10%,
            #26365e,
            #080b12 65%
        );
}

a {
    color: inherit;
    text-decoration: none;
}

.header {

    position: sticky;

    top: 0;

    z-index: 20;

    display: flex;

    justify-content: space-between;

    align-items: center;

    padding: 18px 5vw;

    background:
        rgba(7,10,17,.85);

    backdrop-filter: blur(18px);

    border-bottom:
        1px solid rgba(255,255,255,.08);
}

.logo {

    font-size: 27px;

    font-weight: 1000;
}

.logo span {
    color: #6ea8ff;
}

.nav {

    display: flex;

    gap: 22px;

    color: #9da7bb;

    font-size: 14px;

    font-weight: 800;
}

.nav a:hover {
    color: white;
}

.container {

    width: min(1250px,90%);

    margin: auto;

    padding: 55px 0;
}

.title {

    font-size: 42px;

    font-weight: 1000;

    margin-bottom: 10px;
}

.subtitle {

    color: #8f9aad;

    margin-bottom: 35px;
}

.stats {

    display: flex;

    gap: 14px;

    margin-bottom: 35px;

    flex-wrap: wrap;
}

.stat {

    padding: 15px 22px;

    border-radius: 15px;

    background:
        rgba(255,255,255,.05);

    border:
        1px solid rgba(255,255,255,.08);
}

.stat span {

    display: block;

    color: #8e99ae;

    font-size: 11px;

    text-transform: uppercase;

    margin-bottom: 5px;
}

.stat strong {
    font-size: 20px;
}

.inventory {

    display: grid;

    grid-template-columns:
        repeat(5,1fr);

    gap: 15px;
}

.card {

    position: relative;

    min-height: 260px;

    padding: 15px;

    border-radius: 20px;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.07),
            rgba(255,255,255,.025)
        );

    border:
        1px solid rgba(255,255,255,.08);

    transition:
        transform .2s,
        border-color .2s;
}

.card:hover {

    transform:
        translateY(-5px);

    border-color:
        rgba(255,255,255,.2);
}

.item-img {

    width: 100%;

    height: 165px;

    object-fit: contain;
}

.item-name {

    font-size: 14px;

    font-weight: 1000;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;
}

.item-rarity {

    margin-top: 5px;

    font-size: 10px;

    font-weight: 1000;

    text-transform: uppercase;
}

.item-price {

    margin-top: 7px;

    color: #d9e1ef;

    font-weight: 900;

    font-size: 13px;
}

.common {
    color: #aeb7c8;
}

.uncommon {
    color: #62d98b;
}

.rare {
    color: #55a8ff;
}

.epic {
    color: #b87cff;
}

.legendary {
    color: #ffb84d;
}

.mythic {
    color: #ff4c72;
}

.empty {

    padding: 80px 20px;

    text-align: center;

    border:
        1px dashed rgba(255,255,255,.12);

    border-radius: 25px;

    color: #818ca0;
}

@media(max-width:1000px) {

    .inventory {
        grid-template-columns:
            repeat(3,1fr);
    }
}

@media(max-width:600px) {

    .nav {
        display: none;
    }

    .inventory {
        grid-template-columns:
            repeat(2,1fr);
    }
}

</style>

</head>

<body>


<header class="header">

    <a class="logo" href="index.html">
        CHAK<span>338</span>
    </a>

    <nav class="nav">

        <a href="index.html">
            Главная
        </a>

        <a href="index.html#cases">
            Кейсы
        </a>

        <a href="inventory.html">
            Инвентарь
        </a>

        <a href="upgrade.html">
            Апгрейд
        </a>

    </nav>

</header>


<main class="container">

    <div class="title">
        Мой инвентарь
    </div>

    <div class="subtitle">
        Все предметы, которые ты получил из кейсов.
    </div>


    <div class="stats">

        <div class="stat">

            <span>
                Предметов
            </span>

            <strong id="count">
                0
            </strong>

        </div>


        <div class="stat">

            <span>
                Общая стоимость
            </span>

            <strong id="total">
                0
            </strong>

        </div>


        <div class="stat">

            <span>
                XP
            </span>

            <strong id="xp">
                0
            </strong>

        </div>

    </div>


    <div
        class="inventory"
        id="inventory"
    ></div>

</main>


<script>

function renderInventory() {

    const inventory =
        getInventory();


    const container =
        document.getElementById(
            "inventory"
        );


    document.getElementById(
        "count"
    ).textContent =
        inventory.length;


    const total =
        inventory.reduce(
            (sum, item) =>
                sum + Number(item.price || 0),
            0
        );


    document.getElementById(
        "total"
    ).textContent =
        "💰 " +
        formatPrice(total);


    document.getElementById(
        "xp"
    ).textContent =
        formatPrice(getXP());


    container.innerHTML = "";


    if (!inventory.length) {

        container.innerHTML = `

            <div class="empty"
                 style="grid-column:1/-1">

                <h2>
                    Инвентарь пуст
                </h2>

                <p>
                    Открой первый кейс,
                    чтобы получить предмет.
                </p>

            </div>

        `;

        return;
    }


    inventory
        .slice()
        .reverse()
        .forEach(item => {

            const card =
                document.createElement("div");

            card.className =
                "card";


            const rarity =
                getRarity(item.rarity);


            card.innerHTML = `

                <img
                    class="item-img"
                    src="${item.image}"
                    onerror="
                        this.src='https://dummyimage.com/400x400/151b29/ffffff&text=${encodeURIComponent(item.name)}'
                    "
                >

                <div class="item-name">
                    ${item.name}
                </div>

                <div class="
                    item-rarity
                    ${item.rarity}
                ">
                    ${rarity.name}
                </div>

                <div class="item-price">
                    💰 ${formatPrice(item.price)}
                </div>

            `;


            container.appendChild(card);

        });

}


renderInventory();

</script>

</body>

</html>
