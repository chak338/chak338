<!doctype html>

<head>

<meta
  name="viewport"
  content="width=device-width,initial-scale=1"
>

  CHAK338 — Инвентарь
</title>

<script src="https://cdn.tailwindcss.com"></script>

<style>

body{
  background:#06070b;
  color:#f8fafc;
}

.glass{

  background:
    rgba(8,9,14,.86);

  backdrop-filter:
    blur(18px);

}

.item{

  transition:.2s;

}

.item:hover{

  transform:
    translateY(-5px);

  box-shadow:
    0 20px 50px
    rgba(168,85,247,.1);

}

</style>

</head>


<body>


<header
  class="
    fixed
    top-0
    left-0
    right-0
    z-40
    glass
    border-b
    border-white/10
  "
>

<div
  class="
    max-w-7xl
    mx-auto
    px-4
    h-20
    flex
    items-center
    justify-between
  "
>

<a
  href="index.html"
  class="font-black text-xl"
>

CHAK338

<span
  class="
    text-fuchsia-400
    text-xs
  "
>

GAMING HUB

</span>

</a>


<nav
  class="
    flex
    gap-5
    text-sm
    font-bold
    text-zinc-400
  "
>

<a href="index.html">
  Кейсы
</a>

<a href="upgrade.html">
  Апгрейдер
</a>

<a
  class="text-white"
  href="inventory.html"
>
  Инвентарь
</a>

</nav>

</div>

</header>



<main
  class="
    pt-28
    max-w-7xl
    mx-auto
    px-4
    pb-20
  "
>


<div
  class="
    flex
    flex-col
    md:flex-row
    justify-between
    gap-5
  "
>

<div>

<div
  class="
    text-xs
    uppercase
    tracking-[.3em]
    text-fuchsia-400
    font-black
  "
>

YOUR COLLECTION

</div>


<h1
  class="
    text-5xl
    font-black
    mt-3
  "
>

Инвентарь

</h1>


<p
  class="
    text-zinc-500
    mt-3
  "
>

Все выпавшие предметы.

</p>

</div>



<div
  class="
    grid
    grid-cols-3
    gap-3
  "
>

<div
  class="
    rounded-2xl
    border
    border-white/10
    bg-zinc-950
    p-4
  "
>

<div
  class="
    text-xs
    text-zinc-600
  "
>

ПРЕДМЕТОВ

</div>

<b
  id="count"
  class="text-2xl"
>

0

</b>

</div>



<div
  class="
    rounded-2xl
    border
    border-white/10
    bg-zinc-950
    p-4
  "
>

<div
  class="
    text-xs
    text-zinc-600
  "
>

СТОИМОСТЬ

</div>

<b
  id="total"
  class="text-2xl"
>

0

</b>

</div>



<div
  class="
    rounded-2xl
    border
    border-white/10
    bg-zinc-950
    p-4
  "
>

<div
  class="
    text-xs
    text-zinc-600
  "
>

XP

</div>

<b
  id="xp"
  class="text-2xl"
>

0

</b>

</div>

</div>

</div>



<div
  id="grid"
  class="
    mt-10
    grid
    sm:grid-cols-2
    lg:grid-cols-4
    xl:grid-cols-5
    gap-4
  "
></div>

</main>



<script src="data.js"></script>


<script>

function render(){

  const inventory =
    getInventory();


  document.getElementById(
    'count'
  ).textContent =
    inventory.length;


  document.getElementById(
    'total'
  ).textContent =
    inventory
      .reduce(
        (sum,item) =>
          sum +
          Number(
            item.price || 0
          ),
        0
      )
      .toLocaleString(
        'ru-RU'
      )
      +
      ' монет';


  document.getElementById(
    'xp'
  ).textContent =
    getXP();


  const grid =
    document.getElementById(
      'grid'
    );


  if(!inventory.length){

    grid.innerHTML = `

      <div
        class="
          col-span-full
          rounded-3xl
          border
          border-dashed
          border-white/10
          p-12
          text-center
          text-zinc-500
        "
      >

        Инвентарь пуст.

        <a
          class="
            text-fuchsia-400
            font-black
          "
          href="index.html#cases"
        >

          Открыть кейс →

        </a>

      </div>

    `;

    return;

  }


  grid.innerHTML =
    inventory
      .slice()
      .reverse()
      .map(
        item => `

        <article
          class="
            item
            rounded-3xl
            border
            border-white/10
            bg-zinc-950
            p-4
          "
        >

          <div
            class="
              h-40
              rounded-2xl
              bg-black/30
            "
          >

            <img
              src="${item.image}"
              class="
                w-full
                h-full
                object-contain
              "
              alt="${item.name}"
            >

          </div>


          <h3
            class="
              font-black
              mt-4
            "
          >

            ${item.name}

          </h3>


          <div
            class="
              text-xs
              mt-1
            "
            style="
              color:
              ${
                RARITIES[item.rarity]
                  ?.color || '#fff'
              }
            "
          >

            ${
              RARITIES[item.rarity]
                ?.name || 'Предмет'
            }

          </div>


          <div
            class="
              text-amber-400
              font-black
              mt-2
            "
          >

            🪙 ${item.price}

          </div>

        </article>

      `
      )
      .join('');

}


render();

</script>

</body>
</html>
