<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,initial-scale=1"
>

<title>CHAK338 — Инвентарь</title>

<script src="data.js"></script>

<style>

* {
    box-sizing:border-box;
}

body {

    margin:0;

    min-height:100vh;

    color:white;

    font-family:
        Arial,
        sans-serif;

    background:
        radial-gradient(
            circle at top,
            #25345a,
            #070a10 70%
        );

}

a {
    color:inherit;
    text-decoration:none;
}

.header {

    display:flex;

    justify-content:space-between;

    align-items:center;

    padding:18px 5%;

    background:
        rgba(5,8,14,.85);

    border-bottom:
        1px solid
        rgba(255,255,255,.08);

}

.logo {

    font-size:27px;

    font-weight:1000;

}

.logo span {
    color:#6ea8ff;
}

.nav {

    display:flex;

    gap:22px;

    color:#9ba6ba;

    font-size:14px;

    font-weight:800;

}

.container {

    width:min(1250px,90%);

    margin:auto;

    padding:55px 0;

}

h1 {

    font-size:42px;

    margin:0;

    font-weight:1000;

}

.subtitle {

    margin-top:10px;

    color:#8e99ad;

}

.stats {

    display:flex;

    gap:15px;

    margin:35px 0;

    flex-wrap:wrap;

}

.stat {

    padding:17px 22px;

    border-radius:15px;

    background:
        rgba(255,255,255,.05);

    border:
        1px solid
        rgba(255,255,255,.08);

}

.stat span {

    display:block;

    color:#8994a8;

    font-size:10px;

    text-transform:uppercase;

}

.stat strong {

    display:block;

    margin-top:5px;

    font-size:20px;

}

.inventory {

    display:grid;

    grid-template-columns:
        repeat(5,1fr);

    gap:15px;

}

.card {

    padding:14px;

    border-radius:20px;

    background:
        rgba(255,255,255,.045);

    border:
        1px solid
        rgba(255,255,255,.08);

}

.card img {

    width:100%;

    height:170px;

    object-fit:contain;

}

.name {

    font-size:14px;

    font-weight:1000;

}

.rarity {

    margin-top:6px;

    font-size:10px;

    font-weight:1000;

    text-transform:uppercase;

}

.price {

    margin-top:8px;

    font-size:14px;

    font-weight:1000;

}

.common {
    color:#aeb7c8;
}

.uncommon {
    color:#62d98b;
}

.rare {
    color:#55a8ff;
}

.epic {
    color:#b87cff;
}

.legendary {
    color:#ffb84d;
}

.mythic {
    color:#ff4c72;
}

.empty {

    grid-column:
        1/-1;

    text-align:center;

    padding:80px;

    color:#7f8a9d;

    border:
        1px dashed
        rgba(255,255,255,.15);

    border-radius:20px;

}

@media(max-width:1000px) {

    .inventory {
        grid-template-columns:
            repeat(3,1fr);
    }

}

@media(max-width:600px) {

    .nav {
        display:none;
    }

    .inventory {
        grid-template-columns:
            repeat(2,1fr);
    }

}

</style>

</head>

<body>


<header class="header">

<a
    href="index.html"
    class="logo"
>
CHAK<span>338</span>
</a>


<nav class="nav">

<a href="index.html">
Главная
</a>

<a href="inventory.html">
Инвентарь
</a>

<a href="upgrade.html">
Апгрейд
</a>

</nav>

</header>


<main class="container">


<h1>
МОЙ ИНВЕНТАРЬ
</h1>

<div class="subtitle">
Все полученные предметы
</div>


<div class="stats">

<div class="stat">

<span>
Предметов
</span>

<strong id="count">
0
</strong>

</div>


<div class="stat">

<span>
Стоимость
</span>

<strong id="total">
💰 0
</strong>

</div>


<div class="stat">

<span>
XP
</span>

<strong id="xp">
0
</strong>

</div>

</div>


<div
    class="inventory"
    id="inventory"
></div>


</main>


<script>

function render() {

    const inventory =
        getInventory();


    const container =
        document.getElementById(
            "inventory"
        );


    document.getElementById(
        "count"
    ).textContent =
        inventory.length;


    const total =
        inventory.reduce(
            (
                sum,
                item
            ) =>
                sum +
                Number(
                    item.price || 0
                ),
            0
        );


    document.getElementById(
        "total"
    ).textContent =
        "💰 " +
        formatPrice(
            total
        );


    document.getElementById(
        "xp"
    ).textContent =
        formatPrice(
            getXP()
        );


    container.innerHTML = "";


    if (!inventory.length) {

        container.innerHTML = `

            <div class="empty">

                <h2>
                    Инвентарь пуст
                </h2>

                <p>
                    Открой кейс,
                    чтобы получить предмет.
                </p>

            </div>

        `;

        return;

    }


    inventory
        .slice()
        .reverse()
        .forEach(item => {

            const rarity =
                getRarity(
                    item.rarity
                );


            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "card";


            card.innerHTML = `

                <img
                    src="${item.image}"
                    onerror="
                        this.src='https://dummyimage.com/400x400/151b29/ffffff&text=ITEM'
                    "
                >

                <div class="name">
                    ${item.name}
                </div>

                <div
                    class="
                        rarity
                        ${item.rarity}
                    "
                >
                    ${rarity.name}
                </div>

                <div class="price">
                    💰 ${formatPrice(item.price)}
                </div>

            `;


            container.appendChild(
                card
            );

        });

}


render();

</script>

</body>

</html>
