<script>

let currentFilter = "ALL";


function render() {

  const all =
    getInventory();


  const items =
    currentFilter === "ALL"
      ? all
      : all.filter(
          x => x.type === currentFilter
        );


  document.getElementById(
    "total"
  ).textContent =
    all.length;


  document.getElementById(
    "value"
  ).textContent =
    formatMoney(
      all.reduce(
        (sum, item) =>
          sum + Number(item.price || 0),
        0
      )
    );


  document.getElementById(
    "mythic"
  ).textContent =
    all.filter(
      x => x.rarity === "MYTHIC"
    ).length;


  const grid =
    document.getElementById(
      "grid"
    );


  if (!items.length) {

    grid.innerHTML = `

      <div
        class="
        col-span-full
        rounded-[30px]
        border border-white/10
        bg-zinc-950
        p-14
        text-center
        "
      >

        <div class="text-6xl">
          📦
        </div>

        <h2
          class="
          mt-5
          text-2xl
          font-black
          "
        >
          Инвентарь пуст
        </h2>

        <p class="
          mt-3
          text-zinc-500
        ">
          Открой кейс и получи первый предмет.
        </p>

        <a
          href="index.html#cases"
          class="
          inline-block
          mt-6
          px-6 py-3
          rounded-xl
          bg-fuchsia-500
          font-black
          "
        >
          ОТКРЫТЬ КЕЙС
        </a>

      </div>

    `;

    return;

  }


  /*
    Группируем одинаковые предметы.
  */

  const grouped = {};


  items.forEach(item => {

    const key =
      item.id + "_" +
      item.caseId;


    if (!grouped[key]) {

      grouped[key] = {
        ...item,
        count: 0
      };

    }


    grouped[key].count++;

  });


  grid.innerHTML =
    Object.values(grouped)
      .map(item => `

        <article
          class="
          item-card
          rounded-3xl
          border-2
          rarity-${item.rarity}
          bg-zinc-950
          p-5
          "
        >

          <div
            class="
            h-40
            rounded-2xl
            bg-white/[.03]
            flex
            items-center
            justify-center
            relative
            "
          >

            <img
              src="${item.image}"
              class="
              w-28
              h-28
              object-contain
              "
            >


            ${
              item.count > 1
              ? `
                <div
                  class="
                  absolute
                  top-3
                  right-3
                  px-2.5
                  py-1
                  rounded-lg
                  bg-white
                  text-black
                  text-xs
                  font-black
                  "
                >
                  x${item.count}
                </div>
              `
              : ""
            }

          </div>


          <div class="
            mt-4
            text-[10px]
            uppercase
            tracking-widest
            text-zinc-500
          ">
            ${item.type}
          </div>


          <h3
            class="
            mt-2
            font-black
            text-lg
            leading-tight
            "
          >
            ${item.name}
          </h3>


          <div
            class="
            mt-2
            text-xs
            font-bold
            "
          >
            ${item.rarity}
          </div>


          <div
            class="
            mt-3
            flex
            justify-between
            items-center
            "
          >

            <span
              class="text-zinc-500 text-xs"
            >
              Цена
            </span>

            <span
              class="font-black"
            >
              ${formatMoney(item.price)}
            </span>

          </div>


          <div
            class="
            mt-2
            pt-2
            border-t
            border-white/5
            flex
            justify-between
            text-xs
            "
          >

            <span class="text-zinc-600">
              Всего
            </span>

            <span class="font-black">
              ${formatMoney(
                item.price *
                item.count
              )}
            </span>

          </div>

        </article>

      `)
      .join("");

}


document
  .querySelectorAll(".filter")
  .forEach(button => {

    button.addEventListener(
      "click",
      () => {

        currentFilter =
          button.dataset.filter;


        document
          .querySelectorAll(".filter")
          .forEach(x => {

            x.classList.remove(
              "bg-white",
              "text-black"
            );

            x.classList.add(
              "bg-white/5",
              "border",
              "border-white/10"
            );

          });


        button.classList.remove(
          "bg-white/5",
          "border",
          "border-white/10"
        );


        button.classList.add(
          "bg-white",
          "text-black"
        );


        render();

      }
    );

  });


document
  .getElementById("clearBtn")
  .addEventListener(
    "click",
    () => {

      if (!getInventory().length) {
        return;
      }


      if (
        confirm(
          "Удалить весь инвентарь?"
        )
      ) {

        localStorage.removeItem(
          "chak338_inventory"
        );

        render();

      }

    }
  );


window.addEventListener(
  "storage",
  render
);


render();

</script>
